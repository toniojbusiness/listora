name: Deploy personal

# Deploys the personal environment with scripts/deploy-personal.sh --ci (infra/README.md,
# Deploying from GitHub): after every push to main whose server checks passed, and by hand from the
# Actions tab. The server checks are CI's jobs that cover the server (SERVER_CHECKS below); the
# iPhone checks do not hold a server deploy back, because nothing they test ships with it. AWS access is short-lived OIDC role assumption; no AWS keys are stored in GitHub.
# The deploy role trusts only this workflow file, on this repository's main branch, in the
# protected `personal` GitHub environment: renaming the file needs the deploy-access stack
# redeployed first (infra/README.md). scripts/deploy-personal.sh --profile <profile> from a Mac
# stays the fallback.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# One deploy at a time. A deploy that has started is never cancelled; a newer pending run
# replaces an older pending one.
concurrency:
  group: deploy-personal
  cancel-in-progress: false

jobs:
  commit:
    name: Pick the commit
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    # Room for the backend check (about 7 to 10 minutes, its jobs side by side) to finish.
    timeout-minutes: 45
    permissions:
      contents: read
      checks: read
    outputs:
      sha: ${{ steps.pick.outputs.sha }}
    steps:
      # The pushed commit (or main's head, by hand), once CI's server checks passed for it, and
      # unless main has moved past it: the newer commit's own run deploys that, so an older one
      # never replaces it. A server check that fails fails this job, so nothing deploys.
      - name: Wait for the server checks, then pick the commit
        id: pick
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
          # The names of CI's jobs that cover the server (.github/workflows/ci.yml).
          SERVER_CHECKS: |
            Detect changed areas
            Backend check (Linux)
            Application image build and smoke test (Linux)
        run: |
          while :; do
            # Once main has moved past this commit, the newer commit's run deploys it (and CI
            # cancels this commit's superseded run, so its checks may never finish).
            head=$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)
            if [ "$head" != "$SHA" ]; then
              echo "main is at $head, past $SHA; the run for $head deploys it"
              exit 0
            fi
            pending=0
            while IFS= read -r check; do
              [ -n "$check" ] || continue
              # The newest run of the check for this commit, from this repository's CI.
              state=$(gh api -X GET "repos/$GITHUB_REPOSITORY/commits/$SHA/check-runs" \
                -f check_name="$check" -f filter=latest \
                --jq '[.check_runs[] | select(.app.slug == "github-actions")][0] | "\(.status) \(.conclusion)"')
              case "$state" in
                'completed success') ;;
                completed*)
                  echo "::error::$check ended with '${state#completed }' for $SHA, so it is not deployed."
                  exit 1 ;;
                *) pending=1 ;;
              esac
            done <<<"$SERVER_CHECKS"
            [ "$pending" = 0 ] && break
            sleep 30
          done
          head=$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)
          if [ "$head" = "$SHA" ]; then
            echo "sha=$SHA" >>"$GITHUB_OUTPUT"
          else
            echo "main is at $head, past $SHA; the run for $head deploys it"
          fi

  deploy:
    name: Deploy personal
    needs: commit
    if: needs.commit.outputs.sha != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    # The GitHub environment allows deployments from main only. Its name is in the OIDC subject
    # the AWS role trusts, with the branch and this workflow file, so no other workflow run can
    # assume the role.
    environment: personal
    permissions:
      contents: read
      id-token: write
    env:
      LISTORA_AWS_REGION: ${{ vars.AWS_REGION }}
      LISTORA_AVAILABILITY_ZONES: ${{ vars.AVAILABILITY_ZONES }}
      LISTORA_ALARM_EMAIL: ${{ vars.ALARM_EMAIL }}
      LISTORA_DOMAIN: ${{ vars.DOMAIN }}
      LISTORA_HOSTED_ZONE_ID: ${{ vars.HOSTED_ZONE_ID }}
      # The one person who can sign in (docs/features/auth.md). A secret only so that GitHub
      # masks it: this repository's run logs are public.
      LISTORA_OWNER_EMAIL: ${{ secrets.OWNER_EMAIL }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.commit.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      # GitHub grants id-token to the whole job, not to one step, so nothing in it runs an install
      # script: one in any of the hundreds of packages could ask for the job's OIDC token. No
      # package Listora uses needs one (infra/src/deploy-workflow.test.ts checks the lockfile).
      - run: npm ci --ignore-scripts
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/listora-personal-github-deploy
          role-session-name: deploy-personal-${{ github.run_id }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}
          allowed-account-ids: ${{ vars.AWS_ACCOUNT_ID }}
          mask-aws-account-id: true
      # Everything the deploy from a Mac does, in the same order, with the deploy role: offline
      # synthesis and template checks, the bootstrap check, images, state stacks, migrations,
      # services, the health check and smoke test, and a rollback when either fails.
      - name: Deploy
        run: scripts/deploy-personal.sh --ci
