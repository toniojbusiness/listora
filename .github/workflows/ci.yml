name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend check (Linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      PG_BIN_DIR: /usr/lib/postgresql/18/bin
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install PostgreSQL 18 from PGDG
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y postgresql-18
      # `npm run contract:check` (part of `npm run check`) regenerates the Swift client and
      # runs its tests with the Swift toolchain preinstalled on the Ubuntu runner image.
      # The version file keys the SwiftPM cache, so a runner image with a new Swift never
      # restores modules built by the old compiler.
      - name: Show Swift toolchain
        run: |
          mkdir -p .build
          swift --version | tee .build/swift-version.txt
      - name: Cache SwiftPM builds for the API contract
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .build/api-contract
            .build/swiftpm-cache
          key: swiftpm-${{ runner.os }}-${{ hashFiles('.build/swift-version.txt', 'packages/api-contract/swift/Package.resolved', 'packages/api-contract/tools/swift-generator/Package.resolved') }}
      - run: npm ci
      - run: scripts/dev-db.sh
      - run: npm run check

  ios:
    name: iOS lint, build and test (macOS)
    runs-on: macos-26
    timeout-minutes: 30
    env:
      # Pinned to the Xcode used for local development (README prerequisites).
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Show Xcode and simulators
        run: |
          xcodebuild -version
          xcrun simctl list devices available | grep iPhone
      - name: Install XcodeGen, SwiftLint, and SwiftFormat
        run: brew install xcodegen swiftlint swiftformat
      - run: make ios-lint
      - run: make ios-test
      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ios-test-results
          path: .build/ios/Test.xcresult
          retention-days: 7
