name: CI

# Cost rules (the CI section of README.md): the macOS iOS job and the image job only do real
# work when one of their inputs changed (the filters in the `changes` job). Pushes run only for `main`; branches are covered by
# their pull request, so one commit never runs twice. Draft pull requests run nothing until
# they are marked ready for review.
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

# A newer run replaces a superseded one, on a pull request (its branch) and on `main` alike: the
# newest `main` commit contains every earlier merge, so its full run covers them, and the macOS
# runners every lane shares are not spent on commits already behind. So the latest `main` commit
# always gets a full result, not every merged commit.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect changed areas
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      # paths-filter lists a pull request's files through the API.
      pull-requests: read
    outputs:
      ios: ${{ steps.filter.outputs.ios_inputs == 'true' || steps.app.outputs.ios_app == 'true' }}
      ios_ui: ${{ steps.filter.outputs.ios_ui_inputs == 'true' || steps.app.outputs.ios_app_ui == 'true' }}
      image: ${{ steps.filter.outputs.image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          # What decides whether the application image builds and starts: the Dockerfile and
          # its context rules, the dependency manifests, the entry points, the container
          # configuration in infra/, and the smoke test. Source changes behind the entry points
          # are covered by the backend check. Keep in sync with the CI section of README.md.
          # `ios_inputs`: what the iOS jobs read outside apps/ios (apps/ios itself is the `app`
          # step below). `ios_ui_inputs`: those of them the UI tests read.
          filters: |
            ios_inputs:
              - 'packages/api-contract/**'
              - 'packages/shared/fixtures/listing-urls.json'
              - 'packages/e2e/**'
              - 'Makefile'
              - 'scripts/ios-*'
              - '.github/workflows/ci.yml'
            ios_ui_inputs:
              - 'packages/api-contract/**'
              - 'packages/e2e/**'
              - 'Makefile'
              - 'scripts/ios-*'
              - '.github/workflows/ci.yml'
            image:
              - 'Dockerfile'
              - '.dockerignore'
              - '.nvmrc'
              - '.npmrc'
              - 'package.json'
              - 'package-lock.json'
              - 'apps/*/package.json'
              - 'packages/*/package.json'
              - 'apps/api/src/main.ts'
              - 'apps/worker/src/main.ts'
              - 'apps/worker/src/runner/main.ts'
              # Read from the image's file system at startup: the feature discovery indexes
              # and the bundled contract the API validates requests with.
              - 'apps/api/src/features.ts'
              - 'apps/worker/src/features.ts'
              - 'packages/api-contract/bundled/**'
              - 'infra/**'
              - 'scripts/container-smoke.sh'
              - '.github/workflows/ci.yml'
      # A file matches one of these filters only when it matches every pattern: inside apps/ios
      # and none of the exclusions. Documentation never builds anything; the unit tests'
      # sources, the app-level integration tests (ListoraTests), and the fixture generators
      # (Tools, run by hand) cannot change what a UI test sees.
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: app
        with:
          predicate-quantifier: every
          filters: |
            ios_app:
              - 'apps/ios/**'
              - '!**/*.md'
            ios_app_ui:
              - 'apps/ios/**'
              - '!**/*.md'
              - '!apps/ios/ListoraTests/**'
              - '!apps/ios/Packages/**/Tests/**'
              - '!apps/ios/Tools/**'

  backend:
    name: Backend check (Linux)
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      PG_BIN_DIR: /usr/lib/postgresql/18/bin
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Every new migration must sort after the newest one on main, or the live migration step
      # refuses it (docs/architecture.md, Migrations). A pull request is checked against its base
      # branch; a push to main against the commit before it, which catches two pull requests that
      # each passed but merged in the wrong order, so main's CI fails before anything deploys.
      - name: Check migration order
        env:
          BASE_REF: ${{ github.event_name == 'pull_request' && github.base_ref || '' }}
          BEFORE: ${{ github.event_name == 'push' && github.event.before || '' }}
        run: |
          if [[ -n "$BASE_REF" ]]; then
            git fetch --no-tags --depth=1 origin "$BASE_REF"
            scripts/check-migration-order.sh FETCH_HEAD
          elif [[ -n "$BEFORE" && "$BEFORE" != 0000000000000000000000000000000000000000 ]]; then
            git fetch --no-tags --depth=1 origin "$BEFORE"
            scripts/check-migration-order.sh "$BEFORE"
          else
            echo "migration order: nothing to compare with"
          fi
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install PostgreSQL 18 from PGDG
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y postgresql-18
      # `npm run contract:check` (part of `npm run check`) regenerates the Swift client and
      # runs its tests with the Swift toolchain preinstalled on the Ubuntu runner image.
      # The version file keys the SwiftPM cache, so a runner image with a new Swift never
      # restores modules built by the old compiler.
      - name: Show Swift toolchain
        run: |
          mkdir -p .build
          swift --version | tee .build/swift-version.txt
      - name: Cache SwiftPM builds for the API contract
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .build/api-contract
            .build/swiftpm-cache
          key: swiftpm-${{ runner.os }}-${{ hashFiles('.build/swift-version.txt', 'packages/api-contract/swift/Package.resolved', 'packages/api-contract/tools/swift-generator/Package.resolved') }}
      - run: npm ci
      - run: scripts/dev-db.sh
      # The browser runner's tests drive a real headless Chromium (against a local fake site).
      - name: Cache headless Chromium
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .local/playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - run: scripts/dev-browser.sh --with-deps
      - run: npm run check

  # This job always reports a result, so it can be a required check: when no image input
  # changed it succeeds in seconds without building. It never succeeds when change detection
  # failed. Skipped (which also satisfies a required check) on a draft pull request.
  image:
    name: Application image build and smoke test (Linux)
    needs: changes
    if: ${{ !cancelled() && !github.event.pull_request.draft }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      IMAGE_AFFECTED: ${{ needs.changes.outputs.image }}
    steps:
      - name: Require a successful change detection
        if: ${{ needs.changes.result != 'success' }}
        run: |
          echo "::error::Change detection ended with '${{ needs.changes.result }}', so the image result is unknown."
          exit 1
      - name: Skip the image build (no image input changed)
        if: ${{ env.IMAGE_AFFECTED != 'true' }}
        run: echo "No file the application image depends on changed; see the changes job for the filter."
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: ${{ env.IMAGE_AFFECTED == 'true' }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: ${{ env.IMAGE_AFFECTED == 'true' }}
        with:
          node-version-file: .nvmrc
          cache: npm
      - if: ${{ env.IMAGE_AFFECTED == 'true' }}
        run: npm ci
      - if: ${{ env.IMAGE_AFFECTED == 'true' }}
        run: scripts/container-smoke.sh

  # SwiftLint and SwiftFormat on Linux, before any macOS runner is reserved: a lint failure costs
  # a minute of Linux, not a macOS slot. The Linux builds, pinned to the versions the macOS
  # runners have (Homebrew's SwiftLint, the runner image's SwiftFormat); bump them together.
  # This SwiftLint build has no SourceKit, so it skips the one SourceKit rule the configuration
  # enables, statement_position, whose `} else {` layout SwiftFormat's elseOnSameLine enforces.
  ios-lint:
    name: iOS lint (Linux)
    needs: changes
    if: ${{ needs.changes.outputs.ios == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      SWIFTLINT_VERSION: 0.65.1
      SWIFTLINT_SHA256: caeed6f4a679c35539ffaf124f6c4ab4a8416917f7d8796279dc52b74026059d
      SWIFTFORMAT_VERSION: 0.63.1
      SWIFTFORMAT_SHA256: 9e10090e0213378c68cedb42adc2c6461916a9c8e457cf452b5585b84096c333
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install SwiftLint and SwiftFormat
        run: |
          tools="$RUNNER_TEMP/swift-lint-tools"
          mkdir -p "$tools" && cd "$tools"
          curl -sSfL -o swiftlint.zip "https://github.com/realm/SwiftLint/releases/download/$SWIFTLINT_VERSION/swiftlint_linux_amd64.zip"
          curl -sSfL -o swiftformat.zip "https://github.com/nicklockwood/SwiftFormat/releases/download/$SWIFTFORMAT_VERSION/swiftformat_linux.zip"
          printf '%s  swiftlint.zip\n%s  swiftformat.zip\n' "$SWIFTLINT_SHA256" "$SWIFTFORMAT_SHA256" | sha256sum -c -
          unzip -q swiftlint.zip swiftlint-static && mv swiftlint-static swiftlint
          unzip -q swiftformat.zip swiftformat_linux && mv swiftformat_linux swiftformat
          echo "$tools" >>"$GITHUB_PATH"
      - run: make ios-lint

  # The iOS checks: once the lint passed, one macOS job builds, then hands the built tests (the products and
  # their .xctestrun) to the test jobs, which run side by side on macOS runners: the unit and
  # package tests in one, and the UI tests in IOS_UI_SHARDS shards split by running time
  # (scripts/ios-ui-shard.sh), each with its own local stack. One build per run keeps the macOS
  # minutes down: an account runs only a few macOS jobs at once, shared by every open pull
  # request. `iOS checks` below sums them up into one result for a required check.
  ios-build:
    name: iOS build (macOS)
    needs: [changes, ios-lint]
    if: ${{ needs.changes.outputs.ios == 'true' }}
    runs-on: macos-26
    timeout-minutes: 30
    env:
      # Pinned to the Xcode used for local development (README prerequisites).
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
      HOMEBREW_NO_AUTO_UPDATE: '1'
      HOMEBREW_NO_INSTALL_CLEANUP: '1'
      IOS_COMPILATION_CACHE: ${{ github.workspace }}/.build/ios/CompilationCache
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install XcodeGen
        run: |
          xcodebuild -version
          brew install xcodegen
      # SwiftPM checkouts for the app's package graph, and the compilation cache (Makefile,
      # IOS_COMPILATION_CACHE): Xcode keys it on file contents, so it stays valid in a fresh
      # checkout, where DerivedData would not (Xcode keys that on timestamps). Only `main` saves
      # them; a pull request restores `main`'s, which keeps the repository's cache space for
      # the caches every run uses.
      - name: Restore SwiftPM checkouts for the iOS app
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .build/ios/SourcePackages
            .build/ios/PackageCache
          key: ios-swiftpm-${{ runner.os }}-xcode-26.3-${{ hashFiles('apps/ios/project.yml', 'apps/ios/Packages/*/Package.swift', 'apps/ios/**/Package.resolved') }}
      - name: Restore the Xcode compilation cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .build/ios/CompilationCache
          key: ios-compilation-${{ runner.os }}-xcode-26.3-${{ github.sha }}
          restore-keys: ios-compilation-${{ runner.os }}-xcode-26.3-
      # Each save adds what changed, so the cache only grows; past 4 GB it starts over (one
      # cold build), which keeps the restore quick and the saved entry small.
      - name: Start the compilation cache over when it has grown past 4 GB
        run: |
          size_kb=$(du -sk "$IOS_COMPILATION_CACHE" 2>/dev/null | cut -f1)
          echo "Compilation cache: $(( ${size_kb:-0} / 1024 )) MB"
          if (( ${size_kb:-0} > 4 * 1024 * 1024 )); then rm -rf "$IOS_COMPILATION_CACHE"; echo 'Starting it over.'; fi
      - run: make ios-check-ats
      # The exact device the build targets (scripts/ios-ci-simulator.sh): a name alone can
      # match one device per installed iOS runtime.
      - name: Pick the iPhone 17 simulator
        run: scripts/ios-ci-simulator.sh pick
      - id: build
        run: make ios-build-for-testing
      # Everything the tests run from: the app, the extension, every test bundle, and the
      # .xctestrun that lists them (about 1 GB). A tar keeps the executables' modes and the
      # frameworks' symlinks, which an artifact alone drops. Kept a day; the test jobs read it
      # right away.
      - name: Pack the built tests
        run: tar -cf .build/ios/built-tests.tar -C .build/ios/DerivedData/Build Products
      - name: Hand the built tests to the test jobs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ios-built-tests
          path: .build/ios/built-tests.tar
          retention-days: 1
          compression-level: 1
          if-no-files-found: error
      - name: Save SwiftPM checkouts for the iOS app
        if: ${{ github.event_name == 'push' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .build/ios/SourcePackages
            .build/ios/PackageCache
          key: ios-swiftpm-${{ runner.os }}-xcode-26.3-${{ hashFiles('apps/ios/project.yml', 'apps/ios/Packages/*/Package.swift', 'apps/ios/**/Package.resolved') }}
      - name: Save the Xcode compilation cache
        if: ${{ github.event_name == 'push' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .build/ios/CompilationCache
          key: ios-compilation-${{ runner.os }}-xcode-26.3-${{ github.sha }}

  ios-unit:
    name: iOS unit and package tests (macOS)
    needs: [changes, ios-build]
    if: ${{ needs.changes.outputs.ios == 'true' }}
    runs-on: macos-26
    timeout-minutes: 25
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # One clean boot of the test simulator: every other simulator is shut down and the test
      # one erased first. It boots (about two minutes) while the built tests download; the
      # tests start only once it has finished booting.
      - name: Start booting a clean iPhone 17 simulator
        run: scripts/ios-ci-simulator.sh start
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ios-built-tests
          path: .build/ios
      - name: Unpack the built tests
        run: |
          mkdir -p .build/ios/DerivedData/Build
          tar -xf .build/ios/built-tests.tar -C .build/ios/DerivedData/Build
          rm .build/ios/built-tests.tar
      - name: Wait until the simulator has booted and Xcode lists it
        run: scripts/ios-ci-simulator.sh wait
      # Retries a failing test up to twice. It ends by naming the tests that failed and the ones
      # that passed only on a retry; the same summary goes into .build/ios/test-summary.txt.
      - run: make ios-unit-test IOS_PREBUILT=1 IOS_TEST_SUMMARY_FILE=.build/ios/test-summary.txt
      - name: Show the failing-test summary
        if: ${{ always() && hashFiles('.build/ios/test-summary.txt') != '' }}
        run: |
          { echo '### iOS unit and package tests'; echo '```'; cat .build/ios/test-summary.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload test results
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ios-unit-test-results
          path: |
            .build/ios/Unit.xcresult
            .build/ios/test-summary.txt
          retention-days: 7

  ios-ui:
    name: iOS UI tests (macOS, shard ${{ matrix.shard }} of 3)
    needs: [changes, ios-build]
    if: ${{ needs.changes.outputs.ios_ui == 'true' }}
    runs-on: macos-26
    # A shard takes about 15 to 25 minutes of tests. The rest is room for the re-runs of failed
    # tests: a test that runs out its 5-minute allowance takes about 6.5 minutes a try, and a
    # job cut off by its timeout uploads no summary of what failed.
    timeout-minutes: 60
    strategy:
      # Every shard reports its own failures, not only the first one's.
      fail-fast: false
      matrix:
        # 1 to IOS_UI_SHARDS.
        shard: [1, 2, 3]
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
      HOMEBREW_NO_AUTO_UPDATE: '1'
      HOMEBREW_NO_INSTALL_CLEANUP: '1'
      IOS_UI_SHARDS: '3'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The UI tests that go through the backend run against the local stack (packages/e2e):
      # the API and worker from this checkout, on the scripts/dev-db.sh cluster.
      - name: Install PostgreSQL 18
        run: brew install postgresql@18
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # As in ios-unit: it boots while the built tests download. Started after the installs,
      # which it slowed down by as much as it saved.
      - name: Start booting a clean iPhone 17 simulator
        run: scripts/ios-ci-simulator.sh start
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ios-built-tests
          path: .build/ios
      - name: Unpack the built tests
        run: |
          mkdir -p .build/ios/DerivedData/Build
          tar -xf .build/ios/built-tests.tar -C .build/ios/DerivedData/Build
          rm .build/ios/built-tests.tar
      - name: Wait until the simulator has booted and Xcode lists it
        run: scripts/ios-ci-simulator.sh wait
      # Runs the failed tests again, up to twice, and ends with the summary
      # (scripts/ios-test-run.sh).
      - run: make ios-ui-test IOS_PREBUILT=1 IOS_UI_SHARD="${{ matrix.shard }}/$IOS_UI_SHARDS" IOS_TEST_SUMMARY_FILE=.build/ios/test-summary.txt
      - name: Show the failing-test summary
        if: ${{ always() && hashFiles('.build/ios/test-summary.txt') != '' }}
        run: |
          { echo '### iOS UI tests, shard ${{ matrix.shard }}'; echo '```'; cat .build/ios/test-summary.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      # Uploads on success too, so the UI tests' kept screenshots (Review, Cost, Price, Saved)
      # are available as evidence, not only when a run fails.
      - name: Upload test results, screenshots, and the stack's logs
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ios-ui-test-results-${{ matrix.shard }}
          # The Postgres log names slow statements and lock waits (scripts/dev-db.sh).
          path: |
            .build/ios/UI*.xcresult
            .build/ios/e2e-logs
            .build/ios/test-summary.txt
            .local/pg/server.log
          retention-days: 7

  # One result for the iOS jobs, so it can be the required check: it passes when every iOS job
  # that the change needs passed, and when the change needed none (the jobs are then skipped).
  # It never passes when change detection failed. Skipped (which also satisfies a required
  # check) on a draft pull request.
  ios:
    name: iOS checks
    needs: [changes, ios-lint, ios-build, ios-unit, ios-ui]
    if: ${{ !cancelled() && !github.event.pull_request.draft }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every iOS job the change needs to have passed
        env:
          CHANGES: ${{ needs.changes.result }}
          IOS: ${{ needs.changes.outputs.ios }}
          IOS_UI: ${{ needs.changes.outputs.ios_ui }}
          LINT: ${{ needs.ios-lint.result }}
          BUILD: ${{ needs.ios-build.result }}
          UNIT: ${{ needs.ios-unit.result }}
          UI: ${{ needs.ios-ui.result }}
        run: |
          if [[ $CHANGES != success ]]; then
            echo "::error::Change detection ended with '$CHANGES', so the iOS result is unknown."
            exit 1
          fi
          status=0
          check() { # <job> <needed: true|false> <result>
            local want=skipped
            [[ $2 == true ]] && want=success
            if [[ $3 == "$want" ]]; then
              echo "$1: $3"
            else
              echo "::error::$1 ended with '$3' (expected '$want')."
              status=1
            fi
          }
          check 'iOS lint' "$IOS" "$LINT"
          check 'iOS build' "$IOS" "$BUILD"
          check 'iOS unit and package tests' "$IOS" "$UNIT"
          check 'iOS UI tests' "$IOS_UI" "$UI"
          exit $status
