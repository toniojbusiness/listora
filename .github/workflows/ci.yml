name: CI

# Cost rules (the CI section of README.md): the macOS iOS job and the image job only do real
# work when one of their inputs changed (the filters in the `changes` job). Pushes run only for `main`; branches are covered by
# their pull request, so one commit never runs twice. Draft pull requests run nothing until
# they are marked ready for review.
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

# A new push to a pull request cancels its superseded run. A `main` push gets its own group (by
# commit), so it is never cancelled or replaced while pending and every merged commit gets a
# full result.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Detect changed areas
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      # paths-filter lists a pull request's files through the API.
      pull-requests: read
    outputs:
      ios: ${{ steps.filter.outputs.ios }}
      image: ${{ steps.filter.outputs.image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          # What decides whether the application image builds and starts: the Dockerfile and
          # its context rules, the dependency manifests, the entry points, the container
          # configuration in infra/, and the smoke test. Source changes behind the entry points
          # are covered by the backend check. Keep in sync with the CI section of README.md.
          # `ios`: everything the iOS job reads.
          filters: |
            ios:
              - 'apps/ios/**'
              - 'packages/api-contract/**'
              - 'packages/shared/fixtures/listing-urls.json'
              - 'packages/e2e/**'
              - 'Makefile'
              - '.github/workflows/ci.yml'
            image:
              - 'Dockerfile'
              - '.dockerignore'
              - '.nvmrc'
              - '.npmrc'
              - 'package.json'
              - 'package-lock.json'
              - 'apps/*/package.json'
              - 'packages/*/package.json'
              - 'apps/api/src/main.ts'
              - 'apps/worker/src/main.ts'
              - 'apps/worker/src/runner/main.ts'
              # Read from the image's file system at startup: the feature discovery indexes
              # and the bundled contract the API validates requests with.
              - 'apps/api/src/features.ts'
              - 'apps/worker/src/features.ts'
              - 'packages/api-contract/bundled/**'
              - 'infra/**'
              - 'scripts/container-smoke.sh'
              - '.github/workflows/ci.yml'

  backend:
    name: Backend check (Linux)
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      PG_BIN_DIR: /usr/lib/postgresql/18/bin
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install PostgreSQL 18 from PGDG
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y postgresql-18
      # `npm run contract:check` (part of `npm run check`) regenerates the Swift client and
      # runs its tests with the Swift toolchain preinstalled on the Ubuntu runner image.
      # The version file keys the SwiftPM cache, so a runner image with a new Swift never
      # restores modules built by the old compiler.
      - name: Show Swift toolchain
        run: |
          mkdir -p .build
          swift --version | tee .build/swift-version.txt
      - name: Cache SwiftPM builds for the API contract
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .build/api-contract
            .build/swiftpm-cache
          key: swiftpm-${{ runner.os }}-${{ hashFiles('.build/swift-version.txt', 'packages/api-contract/swift/Package.resolved', 'packages/api-contract/tools/swift-generator/Package.resolved') }}
      - run: npm ci
      - run: scripts/dev-db.sh
      # The browser runner's tests drive a real headless Chromium (against a local fake site).
      - name: Cache headless Chromium
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .local/playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - run: scripts/dev-browser.sh --with-deps
      - run: npm run check

  # This job always reports a result, so it can be a required check: when no image input
  # changed it succeeds in seconds without building. It never succeeds when change detection
  # failed. Skipped (which also satisfies a required check) on a draft pull request.
  image:
    name: Application image build and smoke test (Linux)
    needs: changes
    if: ${{ !cancelled() && !github.event.pull_request.draft }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      IMAGE_AFFECTED: ${{ needs.changes.outputs.image }}
    steps:
      - name: Require a successful change detection
        if: ${{ needs.changes.result != 'success' }}
        run: |
          echo "::error::Change detection ended with '${{ needs.changes.result }}', so the image result is unknown."
          exit 1
      - name: Skip the image build (no image input changed)
        if: ${{ env.IMAGE_AFFECTED != 'true' }}
        run: echo "No file the application image depends on changed; see the changes job for the filter."
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: ${{ env.IMAGE_AFFECTED == 'true' }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: ${{ env.IMAGE_AFFECTED == 'true' }}
        with:
          node-version-file: .nvmrc
          cache: npm
      - if: ${{ env.IMAGE_AFFECTED == 'true' }}
        run: npm ci
      - if: ${{ env.IMAGE_AFFECTED == 'true' }}
        run: scripts/container-smoke.sh

  # This job always reports a result, so it can be a required check: when no iOS input changed
  # it runs on Linux and succeeds in seconds without building. It never succeeds when change
  # detection failed.
  ios:
    name: iOS lint, build and test (macOS)
    needs: changes
    if: ${{ !cancelled() && !github.event.pull_request.draft }}
    runs-on: ${{ needs.changes.outputs.ios == 'true' && 'macos-26' || 'ubuntu-24.04' }}
    # Room for a cold build plus up to two retries of a failing test (make ios-test): a passing
    # run alone took 55 to 57 minutes on main (October 2026), so 60 cut off runs mid-test.
    timeout-minutes: 90
    env:
      IOS_AFFECTED: ${{ needs.changes.outputs.ios }}
      # Pinned to the Xcode used for local development (README prerequisites).
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
      HOMEBREW_NO_AUTO_UPDATE: '1'
      HOMEBREW_NO_INSTALL_CLEANUP: '1'
    steps:
      - name: Require a successful change detection
        if: ${{ needs.changes.result != 'success' }}
        run: |
          echo "::error::Change detection ended with '${{ needs.changes.result }}', so the iOS result is unknown."
          exit 1
      - name: Skip the iOS build (no iOS input changed)
        if: ${{ env.IOS_AFFECTED != 'true' }}
        run: echo "No file the iOS build reads changed; see the changes job for the filter."
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: ${{ env.IOS_AFFECTED == 'true' }}
      - name: Show Xcode and simulators
        if: ${{ env.IOS_AFFECTED == 'true' }}
        run: |
          xcodebuild -version
          xcrun simctl list devices available | grep iPhone
      - name: Install XcodeGen, SwiftLint, SwiftFormat, and PostgreSQL 18
        if: ${{ env.IOS_AFFECTED == 'true' }}
        run: brew install xcodegen swiftlint swiftformat postgresql@18
      # `make ios-test` runs the UI tests that go through the backend against the local stack
      # (packages/e2e): the API and worker from this checkout, on the scripts/dev-db.sh cluster.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: ${{ env.IOS_AFFECTED == 'true' }}
        with:
          node-version-file: .nvmrc
          cache: npm
      - if: ${{ env.IOS_AFFECTED == 'true' }}
        run: npm ci
      # SwiftPM checkouts for the app's package graph. DerivedData is not cached: Xcode keys
      # incremental builds on file timestamps, which every fresh checkout resets.
      - name: Cache SwiftPM checkouts for the iOS app
        if: ${{ env.IOS_AFFECTED == 'true' }}
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .build/ios/SourcePackages
            .build/ios/PackageCache
          key: ios-swiftpm-${{ runner.os }}-xcode-26.3-${{ hashFiles('apps/ios/project.yml', 'apps/ios/Packages/*/Package.swift', 'apps/ios/**/Package.resolved') }}
      - if: ${{ env.IOS_AFFECTED == 'true' }}
        run: make ios-lint
      # One clean boot of the test simulator before the tests: every other simulator is shut
      # down, the test one is erased and booted, and the tests start only once it has finished
      # booting, so the first UI test does not race a half-booted device.
      - name: Boot a clean iPhone 17 simulator
        if: ${{ env.IOS_AFFECTED == 'true' }}
        run: |
          xcrun simctl shutdown all
          xcrun simctl erase 'iPhone 17'
          xcrun simctl boot 'iPhone 17'
          xcrun simctl bootstatus 'iPhone 17' -b
      # Retries a failing test up to twice. It ends by naming the tests that failed and the ones
      # that passed only on a retry; the same summary goes into .build/ios/test-summary.txt.
      - if: ${{ env.IOS_AFFECTED == 'true' }}
        run: make ios-test IOS_TEST_SUMMARY_FILE=.build/ios/test-summary.txt
      - name: Show the failing-test summary
        if: ${{ always() && env.IOS_AFFECTED == 'true' && hashFiles('.build/ios/test-summary.txt') != '' }}
        run: |
          { echo '### iOS tests'; echo '```'; cat .build/ios/test-summary.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      # Uploads on success too, so the UI tests' kept screenshots (Review, Cost, Price, Saved)
      # are available as evidence, not only when a run fails.
      - name: Upload test results and screenshots
        if: ${{ always() && env.IOS_AFFECTED == 'true' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ios-test-results
          path: |
            .build/ios/Test.xcresult
            .build/ios/e2e-logs
            .build/ios/test-summary.txt
          retention-days: 7
