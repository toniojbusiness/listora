name: Deploy

# Manual only: an operator picks the environment in the Actions tab. This workflow never runs
# on pushes or pull requests. AWS access is short-lived OIDC role assumption; no AWS keys are
# stored in GitHub. Setup (accounts, bootstrap, GitHub environments) is in infra/README.md.
on:
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to deploy
        type: choice
        options: [staging, prod, personal]
        required: true

permissions:
  contents: read

concurrency:
  group: deploy-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy ${{ inputs.environment }}
    # Only what is on main is deployed.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    # The GitHub environment carries the protection rules (required reviewers, main only) and
    # the non-secret settings below. Its name is also the OIDC subject the AWS role trusts, so
    # no other workflow, branch, or environment can assume the role.
    environment: ${{ inputs.environment }}
    permissions:
      contents: read
      id-token: write
    env:
      LISTORA_ENV: ${{ inputs.environment }}
      LISTORA_AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
      LISTORA_AWS_REGION: ${{ vars.AWS_REGION }}
      LISTORA_DOMAIN: ${{ vars.DOMAIN }}
      LISTORA_HOSTED_ZONE_ID: ${{ vars.HOSTED_ZONE_ID }}
      LISTORA_ALARM_EMAIL: ${{ vars.ALARM_EMAIL }}
      LISTORA_AVAILABILITY_ZONES: ${{ vars.AVAILABILITY_ZONES }}
      # Images are tagged with the commit they are built from; tags are immutable in ECR.
      LISTORA_IMAGE_TAG: ${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Test and synthesize the infrastructure (offline)
        run: |
          npx vitest run --project unit infra
          npm run infra:synth
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/listora-${{ inputs.environment }}-github-deploy
          role-session-name: deploy-${{ inputs.environment }}-${{ github.run_id }}
          aws-region: ${{ vars.AWS_REGION }}
          allowed-account-ids: ${{ vars.AWS_ACCOUNT_ID }}
          mask-aws-account-id: true
      # The image repository must exist before the image can be pushed to it.
      - name: Deploy the image repository
        working-directory: infra
        run: npx cdk deploy "listora-$LISTORA_ENV-registry" --require-approval never --no-notices
      # The application image (the Dockerfile's default `app` stage) and the browser runner's
      # (`runner`: the same sources with headless Chromium), both tagged with the commit.
      - name: Build and push the application image
        run: |
          registry="$LISTORA_AWS_ACCOUNT_ID.dkr.ecr.$LISTORA_AWS_REGION.amazonaws.com"
          aws ecr get-login-password | docker login --username AWS --password-stdin "$registry"
          for target in app runner; do
            image="$registry/listora/$target:$LISTORA_IMAGE_TAG"
            if aws ecr describe-images --repository-name "listora/$target" \
              --image-ids "imageTag=$LISTORA_IMAGE_TAG" >/dev/null 2>&1; then
              echo "$image already exists; reusing it"
              continue
            fi
            docker build --target "$target" --tag "$image" .
            docker push "$image"
          done
      # The deploy role cannot deploy deploy-access by convention only: through the CDK bootstrap
      # roles it can change anything the bootstrap's CloudFormation execution policy allows
      # (AdministratorAccess by default), its own trust policy included. What bounds a deploy
      # is this GitHub environment's protection rules plus that policy (infra/README.md).
      #
      # First every stack the schema migration task needs, and the task itself.
      - name: Deploy the state stacks and the migration task
        working-directory: infra
        run: |
          npx cdk deploy --require-approval never --no-notices \
            "listora-$LISTORA_ENV-network" \
            "listora-$LISTORA_ENV-secrets" \
            "listora-$LISTORA_ENV-registry" \
            "listora-$LISTORA_ENV-data" \
            "listora-$LISTORA_ENV-storage" \
            "listora-$LISTORA_ENV-email" \
            "listora-$LISTORA_ENV-migrate"
      # Migrations run while the previous release still serves, before any new task starts, so
      # every migration must work with the code already running (expand, then contract). The
      # deploy stops here unless the task exits 0 (scripts/run-migrations.sh, which
      # scripts/deploy-personal.sh runs too). Its logs: /listora/<env>/migrate.
      - name: Run schema migrations
        run: scripts/run-migrations.sh "$LISTORA_ENV" "deploy-$GITHUB_RUN_ID"
      - name: Deploy the services and alarms
        working-directory: infra
        run: |
          npx cdk deploy --require-approval never --no-notices \
            "listora-$LISTORA_ENV-compute" \
            "listora-$LISTORA_ENV-observability"
