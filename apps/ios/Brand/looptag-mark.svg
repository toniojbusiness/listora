<path id="string" d="M10 66 C20 60 32 48 41 34 C50 20 54 5 44 4 C33 3 27 18 27 36 C27 54 27 68 34 76 C42 83 51 80 57 73" fill="none" stroke="#17281E" stroke-width="9.5" stroke-linecap="round" stroke-linejoin="round"/>
