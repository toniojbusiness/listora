# The single source of the Xcode project. `make ios-generate` runs XcodeGen to write
# Listora.xcodeproj (gitignored); never edit the generated project by hand.
name: Listora

options:
  bundleIdPrefix: com.listora
  deploymentTarget:
    iOS: '18.0'
  developmentLanguage: en
  createIntermediateGroups: true
  groupSortPosition: top
  # Dev reaches the API on the developer's Mac over plain HTTP, so only the Dev Info.plists (the
  # app's and the Share Extension's) carry the ATS local-networking exception. They are derived
  # from the shared plists after generation.
  postGenCommand: >-
    plutil -insert NSAppTransportSecurity -json '{"NSAllowsLocalNetworking":true}'
    -o Generated/Listora-Dev-Info.plist Generated/Listora-Info.plist &&
    plutil -insert NSAppTransportSecurity -json '{"NSAllowsLocalNetworking":true}'
    -o Generated/ShareExtension-Dev-Info.plist Generated/ShareExtension-Info.plist

# One configuration per environment. The build type is part of the name because Xcode builds
# Swift packages with debug settings (testability, no optimization, active arch only) only for
# configurations whose name contains "Debug".
configs:
  Dev-Debug: debug
  Staging-Release: release
  Prod-Release: release

configFiles:
  Dev-Debug: Config/Dev.xcconfig
  Staging-Release: Config/Staging.xcconfig
  Prod-Release: Config/Prod.xcconfig

settings:
  base:
    SWIFT_VERSION: '6.0'
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
    GCC_TREAT_WARNINGS_AS_ERRORS: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    TARGETED_DEVICE_FAMILY: '1'
    CODE_SIGN_STYLE: Automatic
    DEAD_CODE_STRIPPING: YES

packages:
  Core:
    path: Packages/Core
  DesignSystem:
    path: Packages/DesignSystem
  APIClient:
    path: Packages/APIClient
  Features:
    path: Packages/Features

targets:
  Listora:
    type: application
    platform: iOS
    sources:
      - Listora
      # The Looptag icon (docs/features/design.md "Brand"), shared with the Share Extension.
      - Brand/AppIcon.xcassets
      # Settings > Privacy policy and Terms of service read the repository's own drafts
      # (LegalDocument in SettingsFeature), so the app and docs/legal never disagree.
      - path: ../../docs/legal/privacy-policy.md
        buildPhase: resources
      - path: ../../docs/legal/terms-of-service.md
        buildPhase: resources
    dependencies:
      - package: Core
      - package: Features
        product: AppFeature
      - target: ShareExtension
    entitlements:
      path: Generated/Listora.entitlements
      properties:
        com.apple.security.application-groups:
          - $(APP_GROUP_IDENTIFIER)
        # Push notifications (sale alerts that delist from this phone, docs/features/phone-execution.md):
        # `development` in Dev, `production` in Staging and Prod (APS_ENVIRONMENT). Personal device
        # builds sign with Config/PersonalTeam.entitlements, without them: a free team has no push.
        aps-environment: $(APS_ENVIRONMENT)
        com.apple.developer.usernotifications.time-sensitive: true
    info:
      path: Generated/Listora-Info.plist
      properties:
        CFBundleDisplayName: $(APP_DISPLAY_NAME)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ListoraEnvironment: $(LISTORA_ENVIRONMENT)
        ListoraAPIBaseURL: $(API_BASE_URL)
        ListoraAppGroup: $(APP_GROUP_IDENTIFIER)
        ListoraSessionKeychainGroup: $(SESSION_KEYCHAIN_GROUP)
        ListoraCognitoRegion: $(COGNITO_REGION)
        ListoraCognitoClientID: $(COGNITO_CLIENT_ID)
        ListoraSupportEmail: $(SUPPORT_EMAIL)
        ITSAppUsesNonExemptEncryption: false
        # Pack check reads shipping labels' and item stickers' barcodes, and takes the optional
        # package photo (docs/features/pack-check.md).
        NSCameraUsageDescription: Listora uses the camera to photograph the items you sell, and to scan shipping labels and item stickers when you pack an order.
        # Assisted tasks save an item's photos to the camera roll, in posting order, for the
        # marketplace's app to pick up (add-only access).
        NSPhotoLibraryAddUsageDescription: Listora saves your item's photos so you can post them in a marketplace's app.
        NSMicrophoneUsageDescription: Listora listens only while you hold the talk button on the review screen, so you can correct an item's details by voice.
        NSSpeechRecognitionUsageDescription: Listora turns what you say into text to fill in an item's details. Your voice recording is never sent to Listora.
        # The marketplace work that runs on this phone (docs/features/phone-execution.md): on a
        # push, on background app refresh, and overnight while the phone charges.
        UIBackgroundModes:
          - fetch
          - processing
          - remote-notification
        BGTaskSchedulerPermittedIdentifiers:
          - com.listora.phone-work.refresh
          - com.listora.phone-work.processing
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        # The app is iPhone-only and portrait. On iPad it runs as an iPhone app, which iPadOS 26
        # windows freely, so the iPad key lists every orientation (Xcode warns otherwise).
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BASE_BUNDLE_IDENTIFIER)$(BUNDLE_ID_SUFFIX)
        # Brand/AppIcon.xcassets, rendered from the SVGs in Brand/ by `make ios-app-icon`.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      configs:
        Dev-Debug:
          INFOPLIST_FILE: Generated/Listora-Dev-Info.plist

  # Links a marketplace listing shared from Safari or a marketplace app to an item. It shares
  # the signed-in session with the app through the App Group (see Base.xcconfig).
  ShareExtension:
    type: app-extension
    platform: iOS
    sources:
      - ShareExtension
      # The same icon as the app, so the extension's bundle names it too (the share sheet itself
      # shows the containing app's icon).
      - Brand/AppIcon.xcassets
    dependencies:
      - package: Core
      - package: DesignSystem
      - package: APIClient
      - package: Features
        product: ShareLinkFeature
    entitlements:
      path: Generated/ShareExtension.entitlements
      properties:
        com.apple.security.application-groups:
          - $(APP_GROUP_IDENTIFIER)
    info:
      path: Generated/ShareExtension-Info.plist
      properties:
        CFBundleDisplayName: $(APP_DISPLAY_NAME)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ListoraEnvironment: $(LISTORA_ENVIRONMENT)
        ListoraAPIBaseURL: $(API_BASE_URL)
        ListoraAppGroup: $(APP_GROUP_IDENTIFIER)
        ListoraSessionKeychainGroup: $(SESSION_KEYCHAIN_GROUP)
        ListoraCognitoRegion: $(COGNITO_REGION)
        ListoraCognitoClientID: $(COGNITO_CLIENT_ID)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            # A listing page from Safari, or a marketplace app's share, which may be a link
            # or text with a link in it.
            NSExtensionActivationRule:
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
              NSExtensionActivationSupportsText: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BASE_BUNDLE_IDENTIFIER)$(BUNDLE_ID_SUFFIX).share
        APPLICATION_EXTENSION_API_ONLY: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      configs:
        Dev-Debug:
          INFOPLIST_FILE: Generated/ShareExtension-Dev-Info.plist

  ListoraTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - ListoraTests
    # Only the host app links the packages; the test bundle imports their modules and resolves
    # symbols from the host, so there is a single copy of each package at run time.
    dependencies:
      - target: Listora
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: $(BASE_BUNDLE_IDENTIFIER).tests

  ListoraUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: ListoraUITests
        excludes:
          - Fixtures
          - BatchFixtures
          # The fake AI answers of the local stacks `make ios-test` and `make e2e-full` start;
          # read by the stack.
          - FakeAI
          - FullStack/FakeAI
      # Photos the UI tests import through the app's debug fixture import, kept as one folder.
      - path: ListoraUITests/Fixtures
        type: folder
        buildPhase: resources
      # A 3-item haul the batch UI test shoots with the fake camera (make ios-batch-fixtures).
      - path: ListoraUITests/BatchFixtures
        type: folder
        buildPhase: resources
    dependencies:
      - target: Listora
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: $(BASE_BUNDLE_IDENTIFIER).uitests

schemes:
  Listora:
    build:
      targets:
        Listora: all
    run:
      config: Dev-Debug
    test:
      config: Dev-Debug
      gatherCoverageData: true
      targets:
        - ListoraTests
        - ListoraUITests
        - package: Core/CoreTests
        - package: DesignSystem/DesignSystemTests
        - package: APIClient/APIClientTests
        - package: Features/AppFeatureTests
        - package: Features/TodayFeatureTests
        - package: Features/InventoryFeatureTests
        - package: Features/SalesFeatureTests
        - package: Features/AddItemFeatureTests
        - package: Features/ReviewFeatureTests
        - package: Features/TasksFeatureTests
        - package: Features/SettingsFeatureTests
        - package: Features/SignInFeatureTests
        - package: Features/MarketplacesFeatureTests
        - package: Features/TagReadingFeatureTests
        - package: Features/VoiceInputFeatureTests
        - package: Features/PhotoSignalsFeatureTests
        - package: Features/ShareLinkFeatureTests
        - package: Features/MarketplaceLinkingFeatureTests
        - package: Features/PhoneExecutionFeatureTests
        - package: Features/PackCheckFeatureTests
    profile:
      config: Prod-Release
    analyze:
      config: Dev-Debug
    archive:
      config: Prod-Release
