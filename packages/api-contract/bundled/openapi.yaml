openapi: 3.1.0
info:
  title: Listora API
  version: 1.0.0
  summary: The v1 contract between the Listora iPhone app and the Listora backend.
  description: |
    Single source of truth for the Listora HTTP API. The server's TypeScript types and the
    iOS Swift client are generated from this file (`npm run contract:generate`), and CI fails
    when the generated code is stale. Conventions are documented in
    `packages/api-contract/README.md`. The most important ones:

    - **Never false success.** Marketplace state is reported by the server through
      `statusDisplay` (a server-rendered label plus a tone) and `verification`. A listing or
      operation is shown as done only after an API read-back or an explicit user
      confirmation. Clients render these values; they never infer success themselves.
    - **Money** is always integer minor units (`amountCents`) plus a `currency`.
    - **Errors** always use `ErrorResponse`: a machine `code`, a user-readable `message`, and
      a `retryable` flag.
    - **Lists** use opaque cursor pagination (`cursor`, `limit`, `nextCursor`).
    - **Every POST** requires an `Idempotency-Key` header, so retries after a lost response
      never create a second item, listing, or marketplace action.
    - **Absent means no value.** The server omits a property instead of sending `null`.
    - **Open enums.** A response value that can grow (marketplaces, statuses, actions,
      capabilities) is a `Known*` value or any other string, so a new value never breaks an
      installed app. Clients handle values they do not know.
  contact:
    name: Listora engineering
servers:
  - url: http://127.0.0.1:3000
    description: Local development (`npm run dev:api`)
security:
  - bearerAuth: []
tags:
  - name: health
    description: Liveness and readiness probes for load balancers and containers.
  - name: account
    description: The signed-in person's Listora account.
  - name: items
    description: Master inventory items. Each physical item has one item and one SKU.
  - name: photos
    description: Upload sessions and item photos.
  - name: analysis
    description: AI analysis of an item's photos (run once per photo set).
  - name: batches
    description: Batches of items photographed in one session, and where each item is.
  - name: pricing
    description: Price suggestions with honest source labels.
  - name: listings
    description: Per-marketplace listings of an item and the actions on them.
  - name: operations
    description: Marketplace operations (every marketplace write) and their event history.
  - name: connections
    description: Marketplace account connections and their health.
  - name: sales
    description: Sales and the automatic delist run each sale starts.
  - name: profit
    description: The profit dashboard over the seller's sales and inventory.
  - name: tasks
    description: Assisted-mode tasks the user completes in a marketplace app.
  - name: usage
    description: How much of the plan's quotas the account has used this period.
  - name: today
    description: The Today screen (what needs the seller, and the money summary) and its morning summary.
paths:
  /health/live:
    get:
      tags:
        - health
      operationId: getLiveness
      summary: Liveness probe
      description: The process is up. Checks no dependencies.
      security: []
      responses:
        '200':
          description: The process is running.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthLive'
  /health/ready:
    get:
      tags:
        - health
      operationId: getReadiness
      summary: Readiness probe
      description: The process can serve traffic (the database answers). Never includes error details.
      security: []
      responses:
        '200':
          description: Ready.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthReady'
        '503':
          description: Not ready; at least one check is unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthReady'
  /v1/account:
    delete:
      tags:
        - account
      operationId: deleteAccount
      summary: Delete my account
      description: |
        In-app account deletion (App Store Review Guideline 5.1.1(v)). Deletes the signed-in
        person and, when they own their account, the account with all of its data: items,
        photos, listing records, sales, and history. Live listings themselves stay on the
        marketplaces.

        A success means the deletion is committed and final: the data is gone, and the bearer
        token stops working at once (any other token issued before the deletion too). Listora
        then finishes on its own, whether or not the app is still running: it deletes the
        person from the sign-in provider, so they cannot sign in to the deleted account again,
        and asks each connected marketplace to revoke its access, retrying for up to 7 days.
        Until the sign-in provider has deleted the person, signing in again is refused; after
        that, it creates a new, empty account.

        Any error, including a retryable `500` or `503`, means nothing was deleted; retry with
        the same token. A retry after a lost success response gets `401 unauthenticated`, which
        means the account is gone.

        `marketplaceAccess` reports each API marketplace connection honestly, by marketplace and
        the seller's name there: `revoked` is true only when the marketplace had confirmed it
        before the deletion. Every entry with `revoked: false` names a marketplace whose access
        the user must revoke manually: Listora keeps asking that marketplace (it keeps the
        encrypted tokens only for that, and deletes them once the marketplace confirms or after
        7 days), but the app cannot learn the outcome, so it lists these marketplaces and tells
        the user to remove Listora in each one's connected-apps settings.
      responses:
        '200':
          description: The account is deleted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountDeletion'
        '403':
          description: |
            The account has other members, so it cannot be deleted with this person
            (`forbidden`); they must leave first.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        default:
          $ref: '#/components/responses/DefaultError'
  /v1/items:
    get:
      tags:
        - items
      operationId: listItems
      summary: List items
      description: Newest first. Filters combine with AND.
      parameters:
        - name: status
          in: query
          description: Only items in one of these statuses.
          schema:
            type: array
            items:
              $ref: '#/components/schemas/KnownItemStatus'
          style: form
          explode: true
        - name: q
          in: query
          description: Free-text search over SKU, title, brand, and keywords.
          schema:
            type: string
            maxLength: 200
        - name: marketplace
          in: query
          description: |
            Only items with a listing on this marketplace that is not ended or sold (a draft
            listing, or one being published, counts).
          schema:
            $ref: '#/components/schemas/KnownMarketplace'
        - name: brand
          in: query
          description: Only items of this brand (exact, ignoring case).
          schema:
            type: string
            minLength: 1
            maxLength: 120
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: A page of items.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ItemPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        default:
          $ref: '#/components/responses/DefaultError'
    post:
      tags:
        - items
      operationId: createItem
      summary: Create an item
      description: |
        Creates a `draft` item and allocates its SKU (for example `AJ-000184`) in the same
        transaction. Every detail is optional so a draft can be created before analysis.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ItemCreate'
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Item'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        default:
          $ref: '#/components/responses/DefaultError'
  /v1/items/{itemId}:
    parameters:
      - $ref: '#/components/parameters/ItemId'
    get:
      tags:
        - items
      operationId: getItem
      summary: Get an item
      description: The item with its photos and per-marketplace listings.
      responses:
        '200':
          description: The item.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Item'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/DefaultError'
    put:
      tags:
        - items
      operationId: replaceItem
      summary: Replace an item's details
      description: |
        Full replacement of the user-editable `details`: a property left out is cleared.
        `expectedVersion` must equal the item's current `version`, otherwise the server
        answers `409 version_conflict` and the client refetches. Changing details never
        changes a live marketplace listing; use the listing actions for that.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ItemReplace'
      responses:
        '200':
          description: The updated item.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Item'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        default:
          $ref: '#/components/responses/DefaultError'
    delete:
      tags:
        - items
      operationId: deleteItem
      summary: Delete an item
      description: |
        Allowed only while no listing is live on a marketplace (every listing is `draft` or
        `ended`); otherwise `409 invalid_state_transition`. The SKU is never reused.
      responses:
        '204':
          description: Deleted.
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        default:
          $ref: '#/components/responses/DefaultError'
  /v1/skus/{sku}:
    parameters:
      - name: sku
        in: path
        required: true
        description: The item's SKU, for example `AJ-000184` (from a scanned label).
        schema:
          $ref: '#/components/schemas/Sku'
    get:
      tags:
        - items
      operationId: getItemBySku
      summary: Look up an item by SKU
      responses:
        '200':
          description: The item that owns this SKU.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Item'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/DefaultError'
  /v1/upload-sessions:
    post:
      tags:
        - photos
      operationId: createUploadSession
      summary: Start a photo upload session
      description: |
        Returns one pre-signed upload target per file. The client sends each file's bytes
        with the given method, URL, and headers (directly to object storage; background
        uploads are fine), then attaches each uploaded file to an item with `addItemPhoto`.
        Clients resize to at most 2048 px on the long edge, encode JPEG, and strip GPS before
        uploading. Upload targets expire after 15 minutes (`getUploadSession` returns fresh
        ones) and the session after 24 hours; files must be attached before it expires.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UploadSessionCreate'
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadSession'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        default:
          $ref: '#/components/responses/DefaultError'
  /v1/upload-sessions/{sessionId}:
    parameters:
      - $ref: '#/components/parameters/SessionId'
    get:
      tags:
        - photos
      operationId: getUploadSession
      summary: Get an upload session
      description: |
        Used to resume after an app relaunch: shows which files the server already has, and
        returns fresh upload targets for files still `pending`.
      responses:
        '200':
          description: The session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadSession'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/DefaultError'
  /v1/items/{itemId}/photos:
    parameters:
      - $ref: '#/components/parameters/ItemId'
    post:
      tags:
        - photos
      operationId: addItemPhoto
      summary: Attach an uploaded file to an item as a photo
      description: |
        The server checks that the file's bytes arrived and match the declared size and
        SHA-256 (`409 upload_incomplete` if not), then creates the photo in `processing`
        while it derives the thumbnail, AI, and listing images.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PhotoCreate'
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Photo'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        default:
          $ref: '#/components/responses/DefaultError'
  /v1/items/{itemId}/photo-order:
    parameters:
      - $ref: '#/components/parameters/ItemId'
    put:
      tags:
        - photos
      operationId: reorderItemPhotos
      summary: Reorder an item's photos
      description: '`photoIds` must list every photo of the item exactly once; the first is the cover.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PhotoOrder'
      responses:
        '200':
          description: The photos in their new order.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PhotoList'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        default:
          $ref: '#/components/responses/DefaultError'
  /v1/items/{itemId}/photos/{photoId}:
    parameters:
      - $ref: '#/components/parameters/ItemId'
      - $ref: '#/components/parameters/PhotoId'
    patch:
      tags:
        - photos
      operationId: updateItemPhoto
      summary: Change a photo's role
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PhotoUpdate'
      responses:
        '200':
          description: The updated photo.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Photo'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        default:
          $ref: '#/components/responses/DefaultError'
    delete:
      tags:
        - photos
      operationId: deleteItemPhoto
      summary: Remove a photo from an item
      responses:
        '204':
          description: Deleted.
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/DefaultError'
  /v1/items/{itemId}/analyses:
    parameters:
      - $ref: '#/components/parameters/ItemId'
    post:
      tags:
        - analysis
      operationId: startItemAnalysis
      summary: Analyze the item's current photos
      description: |
        Starts the default ("fast") analysis of the item's current photo set. Analysis runs
        once per item and photo set: when an analysis of the same photo-set hash exists, it is
        returned instead of running (and paying for) a new one; a `failed` one is queued again,
        since asking again is how a failure is retried. Poll `getAnalysis` until `status` is
        `completed` or `failed`. The photo set is every photo of the item, so all of them must
        be `ready`: `409 invalid_state_transition` when the item has no photos or one is still
        `processing` or `failed` (remove or replace it first). Refused before anything is
        queued: `402 quota_exceeded` when the plan's AI items for the month are used up,
        `429 ai_budget_exceeded` when the account's daily AI budget is used up, and
        `503 service_unavailable` while AI is switched off.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '202':
          description: The analysis for the current photo set (new or existing).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Analysis'
        '402':
          $ref: '#/components/responses/QuotaExceeded'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        default:
          $ref: '#/components/responses/DefaultError'
  /v1/analyses/{analysisId}:
    parameters:
      - $ref: '#/components/parameters/AnalysisId'
    get:
      tags:
        - analysis
      operationId: getAnalysis
      summary: Get an analysis
      responses:
        '200':
          description: The analysis.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Analysis'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/DefaultError'
  /v1/analyses/{analysisId}/escalate:
    parameters:
      - $ref: '#/components/parameters/AnalysisId'
    post:
      tags:
        - analysis
      operationId: escalateAnalysis
      summary: Identify harder (premium analysis)
      description: |
        Runs the premium identification on the same photos plus the first result. Counts
        against the plan's premium quota (`402 quota_exceeded` when used up). Repeating the
        request for the same analysis returns the existing premium analysis, or queues it
        again when it `failed`. The server also starts it on its own when a fast analysis
        needs it (`needsEscalation`) and the quota allows; the fast analysis then names it in
        `escalationAnalysisId`. `409 invalid_state_transition` until the analysis has
        `completed`, and for an analysis that is already `premium`. `429 ai_budget_exceeded`
        and `503 service_unavailable` as for `startItemAnalysis`.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '202':
          description: The premium analysis.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Analysis'
        '402':
          $ref: '#/components/responses/QuotaExceeded'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        default:
          $ref: '#/components/responses/DefaultError'
  /v1/analyses/{analysisId}/apply:
    parameters:
      - $ref: '#/components/parameters/AnalysisId'
    post:
      tags:
        - analysis
      operationId: applyAnalysis
      summary: Fill the item's details from an analysis
      description: |
        Copies the completed analysis's proposed details into its item and records it as the
        item's `acceptedAnalysisId`. Each copied detail takes the analysis's provenance (`ai`,
        `ocr`, or `barcode`) in `fieldProvenance`. Details the user entered or edited
        (provenance `user`) are never overwritten, and a detail the analysis did not find is
        left as it is. `expectedVersion` must equal the item's current `version`
        (`409 version_conflict` otherwise); `409 invalid_state_transition` until the analysis
        has `completed`. Never calls AI.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AnalysisApply'
      responses:
        '200':
          description: The updated item.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Item'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        default:
          $ref: '#/components/responses/DefaultError'
  /v1/item-batches:
    post:
      tags:
        - batches
      operationId: createItemBatch
      summary: Start a batch
      description: |
        Starts an empty batch: the items of one haul, photographed in one session. Add one item
        per physical item with `addItemBatchItem`, attach its photos as for any item, then
        `submitItemBatchItem`: the server starts its analysis once the photos are processed.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ItemBatch'
        default:
          $ref: '#/components/responses/DefaultError'
  /v1/item-batches/{batchId}:
    parameters:
      - $ref: '#/components/parameters/BatchId'
    get:
      tags:
        - batches
      operationId: getItemBatch
      summary: Get a batch
      description: |
        The batch's items in haul order, each with where it is (`state` and the server's
        `statusDisplay`), and how many are in each state. Poll it while items upload and
        analyze; every state comes from the items, photos, and analyses themselves.
      responses:
        '200':
          description: The batch.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ItemBatch'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/DefaultError'
  /v1/item-batches/{batchId}/items:
    parameters:
      - $ref: '#/components/parameters/BatchId'
    post:
      tags:
        - batches
      operationId: addItemBatchItem
      summary: Add an item to a batch
      description: |
        Creates a `draft` item (with its SKU) at `position` in the batch. A position the batch
        already has answers `200` with that item instead of creating another, so an app that
        submits its batch again, even after the Idempotency-Key has expired, never creates an
        item twice.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ItemBatchItemCreate'
      responses:
        '200':
          description: The item already at that position.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ItemBatchItem'
        '201':
          description: Created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ItemBatchItem'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        default:
          $ref: '#/components/responses/DefaultError'
  /v1/item-batches/{batchId}/items/{itemId}/submit:
    parameters:
      - $ref: '#/components/parameters/BatchId'
      - $ref: '#/components/parameters/ItemId'
    post:
      tags:
        - batches
      operationId: submitItemBatchItem
      summary: Analyze a batch item once its photos are ready
      description: |
        Says the app has attached all `photoCount` photos of the item. The server starts the
        item's analysis as soon as they are processed, under the same rules as
        `startItemAnalysis`: an existing analysis of the photo set is kept, a failed one is
        queued again, and the AI guards are checked first. A refusal (the daily AI budget, the
        plan's quota, AI switched off) shows on the item as a `failed` state with its reason
        instead of an error here. Submitting again is the item's Retry. `409
        invalid_state_transition` when the item does not have `photoCount` photos yet.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ItemBatchItemSubmit'
      responses:
        '202':
          description: The item, as it is now.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ItemBatchItem'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        default:
          $ref: '#/components/responses/DefaultError'
  /v1/item-batches/{batchId}/interaction:
    parameters:
      - $ref: '#/components/parameters/BatchId'
    put:
      tags:
        - batches
      operationId: replaceItemBatchInteraction
      summary: Record the seller's interaction with a batch
      description: |
        Replaces the interaction the app measured for the batch (from its first photo to its
        last saved item) and each item's share of it. An item left out has none. `422` when an
        `itemId` is not an item of the batch.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ItemBatchInteractionReplace'
      responses:
        '200':
          description: The batch.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ItemBatch'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        default:
          $ref: '#/components/responses/DefaultError'
  /v1/usage:
    get:
      tags:
        - usage
      operationId: getUsage
      summary: Get the plan's quota use
      description: |
        The account's use of each plan quota in the current period (the UTC calendar month
        until billing periods exist): AI items analyzed and premium identifications ("Identify
        harder"). A quota without `limit` is unlimited. Units are counted when a call succeeds,
        so a request that is still running is not counted yet.
      responses:
        '200':
          description: Quota use for the current period.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Usage'
        default:
          $ref: '#/components/responses/DefaultError'
  /v1/items/{itemId}/pricing:
    parameters:
      - $ref: '#/components/parameters/ItemId'
    get:
      tags:
        - pricing
      operationId: getItemPricing
      summary: Get price suggestions for an item
      description: |
        Every number carries its source. Without real sold data the response has no
        `soldComparables`, says so in `noSoldDataMessage`, and its tiers are based on the
        labeled AI estimate and the cost floor. Computing suggestions never calls AI; the
        estimate comes from the item's analysis. No eBay content is used to compute any price.
      parameters:
        - name: shippingCents
          in: query
          description: |
            What the seller expects to pay for shipping, in cents of the item's currency.
            Added to every floor. Defaults to 0 (the buyer pays shipping).
          schema:
            type: integer
            format: int64
            minimum: 0
            maximum: 10000000
        - name: minimumProfitCents
          in: query
          description: |
            The least profit the seller accepts on this item, in cents of the item's currency.
            Added to every floor. Defaults to 0 (break even).
          schema:
            type: integer
            format: int64
            minimum: 0
            maximum: 10000000
      responses:
        '200':
          description: Price suggestions.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PricingSuggestion'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/DefaultError'
  /v1/items/{itemId}/listings:
    parameters:
      - $ref: '#/components/parameters/ItemId'
    get:
      tags:
        - listings
      operationId: listItemListings
      summary: List an item's marketplace listings
      description: At most one listing per marketplace, so this list is not paginated.
      responses:
        '200':
          description: The item's listings.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListingList'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/DefaultError'
    post:
      tags:
        - listings
      operationId: createListing
      summary: Create a draft listing for a marketplace
      description: |
        Creates the marketplace-specific variant as a `draft`. Nothing is sent to the
        marketplace until `publishListing`. `409 already_exists` when the item already has a
        listing on that marketplace.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ListingCreate'
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Listing'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        default:
          $ref: '#/components/responses/DefaultError'
  /v1/items/{itemId}/listing-links:
    parameters:
      - $ref: '#/components/parameters/ItemId'
    post:
      tags:
        - listings
      operationId: linkItemListing
      summary: Link a listing the user already has on a marketplace
      description: |
        Records a listing the user created on a marketplace themselves, from the URL they
        shared from Safari or the marketplace app. The server reads the marketplace and the
        listing id from the URL (see `ListingLinkCreate`) and never fetches it. The listing is
        `assisted` and `active`, and its `verification` is `user_confirmation`: it is the
        user's word, never shown as confirmed by the marketplace. A `draft` or `ready` item
        becomes `listed`.

        `409 already_exists` when this listing is already linked to an item (the message
        names that item's SKU) or the item already has a live listing on that marketplace.
        `409 invalid_state_transition` when the item is sold, shipped, archived, or being
        delisted after a sale. `422 validation_failed` (field `url`) when the URL is not a
        listing on a supported marketplace.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ListingLinkCreate'
      responses:
        '201':
          description: Linked.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Listing'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        default:
          $ref: '#/components/responses/DefaultError'
  /v1/listing-imports:
    post:
      tags:
        - listings
      operationId: importSharedListing
      summary: Create an item for a shared listing and link the listing to it
      description: |
        For a listing the user shared that has no item in Listora yet. Creates an import
        placeholder item, with the account's next SKU and the given title as its only detail
        (the user adds the rest later), and links the listing to it exactly as
        `linkItemListing` does, in one transaction. The item is `listed`.

        `409 already_exists` when this listing is already linked to an item (the message
        names that item's SKU). `422 validation_failed` (field `url`) when the URL is not a
        listing on a supported marketplace.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SharedListingImport'
      responses:
        '201':
          description: Created and linked.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SharedListingImportResult'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        default:
          $ref: '#/components/responses/DefaultError'
  /v1/listings:
    get:
      tags:
        - listings
      operationId: listListings
      summary: List listings across items
      description: For views such as "everything that failed" or "everything on Depop". Newest first.
      parameters:
        - name: marketplace
          in: query
          schema:
            $ref: '#/components/schemas/KnownMarketplace'
        - name: status
          in: query
          schema:
            type: array
            items:
              $ref: '#/components/schemas/KnownListingStatus'
          style: form
          explode: true
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: A page of listings.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListingPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        default:
          $ref: '#/components/responses/DefaultError'
  /v1/listings/{listingId}:
    parameters:
      - $ref: '#/components/parameters/ListingId'
    get:
      tags:
        - listings
      operationId: getListing
      summary: Get a listing and its current status
      responses:
        '200':
          description: The listing.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Listing'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/DefaultError'
  /v1/listings/{listingId}/variant:
    parameters:
      - $ref: '#/components/parameters/ListingId'
    put:
      tags:
        - listings
      operationId: replaceListingDraft
      summary: Replace a draft listing's variant
      description: |
        Only for `draft` listings; it changes nothing on the marketplace. A live listing is
        changed with `reviseListing` or `changeListingPrice` (`409 invalid_state_transition`
        otherwise).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ListingVariantReplace'
      responses:
        '200':
          description: The updated listing.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Listing'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        default:
          $ref: '#/components/responses/DefaultError'
  /v1/listings/{listingId}/publish:
    parameters:
      - $ref: '#/components/parameters/ListingId'
    post:
      tags:
        - listings
      operationId: publishListing
      summary: Publish a draft listing to its marketplace
      description: |
        Queues a `create` operation. On an API marketplace the listing becomes `active` only
        after the marketplace confirms it on read-back. On an assisted marketplace it opens a
        `list_manually` task and the operation waits in `needs_user_action`.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '202':
          $ref: '#/components/responses/ListingOperationAccepted'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        default:
          $ref: '#/components/responses/DefaultError'
  /v1/listings/{listingId}/revise:
    parameters:
      - $ref: '#/components/parameters/ListingId'
    post:
      tags:
        - listings
      operationId: reviseListing
      summary: Change a live listing's details
      description: |
        Queues a `revise` operation with the new variant (title, description, aspects, price).
        Assisted marketplaces get an `edit_manually` task.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ListingVariantReplace'
      responses:
        '202':
          $ref: '#/components/responses/ListingOperationAccepted'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        default:
          $ref: '#/components/responses/DefaultError'
  /v1/listings/{listingId}/price:
    parameters:
      - $ref: '#/components/parameters/ListingId'
    post:
      tags:
        - listings
      operationId: changeListingPrice
      summary: Change a live listing's price
      description: |
        Queues a `price` operation. The listed price changes only once it is confirmed.
        Assisted marketplaces get an `edit_manually` task.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ListingPriceChange'
      responses:
        '202':
          $ref: '#/components/responses/ListingOperationAccepted'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        default:
          $ref: '#/components/responses/DefaultError'
  /v1/listings/{listingId}/end:
    parameters:
      - $ref: '#/components/parameters/ListingId'
    post:
      tags:
        - listings
      operationId: endListing
      summary: End (delist) a live listing
      description: Queues an `end` operation. Assisted marketplaces get a `delist_manually` task.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ListingEnd'
      responses:
        '202':
          $ref: '#/components/responses/ListingOperationAccepted'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        default:
          $ref: '#/components/responses/DefaultError'
  /v1/listings/{listingId}/relist:
    parameters:
      - $ref: '#/components/parameters/ListingId'
    post:
      tags:
        - listings
      operationId: relistListing
      summary: Relist an ended listing
      description: |
        Queues a `relist` operation. Some marketplaces relist as a new listing with new
        external ids (Depop gets a new external SKU); `externalListingId` changes when
        confirmed.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '202':
          $ref: '#/components/responses/ListingOperationAccepted'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        default:
          $ref: '#/components/responses/DefaultError'
  /v1/listings/{listingId}/verify:
    parameters:
      - $ref: '#/components/parameters/ListingId'
    post:
      tags:
        - listings
      operationId: verifyListing
      summary: Check the listing's real state on the marketplace again
      description: |
        Queues a `verify` operation (a read-back only; nothing is changed on the marketplace).
        Only for API listings; assisted listings answer `409 marketplace_action_unavailable`.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '202':
          $ref: '#/components/responses/ListingOperationAccepted'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        default:
          $ref: '#/components/responses/DefaultError'
  /v1/operations:
    get:
      tags:
        - operations
      operationId: listOperations
      summary: List marketplace operations
      description: Newest first. Filters combine with AND.
      parameters:
        - name: itemId
          in: query
          schema:
            $ref: '#/components/schemas/Id'
        - name: listingId
          in: query
          schema:
            $ref: '#/components/schemas/Id'
        - name: status
          in: query
          schema:
            type: array
            items:
              $ref: '#/components/schemas/KnownOperationStatus'
          style: form
          explode: true
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: A page of operations.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperationPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        default:
          $ref: '#/components/responses/DefaultError'
  /v1/operations/{operationId}:
    parameters:
      - $ref: '#/components/parameters/OperationId'
    get:
      tags:
        - operations
      operationId: getOperation
      summary: Get an operation
      responses:
        '200':
          description: The operation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Operation'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/DefaultError'
  /v1/operations/{operationId}/events:
    parameters:
      - $ref: '#/components/parameters/OperationId'
    get:
      tags:
        - operations
      operationId: listOperationEvents
      summary: List an operation's history
      description: Oldest first (by `sequence`). Events are append-only.
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: A page of events.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperationEventPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/DefaultError'
  /v1/operations/{operationId}/retry:
    parameters:
      - $ref: '#/components/parameters/OperationId'
    post:
      tags:
        - operations
      operationId: retryOperation
      summary: Retry a failed operation
      description: |
        Only for `failed` operations. Queues the same operation again with a fresh set of
        attempts; its history keeps the failure. Its first step reads the listing back before
        sending anything, because an earlier attempt may have been applied.
        `409 invalid_state_transition` when the operation has not failed, or when a newer
        operation on the listing exists (retrying would undo it).
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '202':
          description: The queued operation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Operation'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        default:
          $ref: '#/components/responses/DefaultError'
  /v1/operations/{operationId}/cancel:
    parameters:
      - $ref: '#/components/parameters/OperationId'
    post:
      tags:
        - operations
      operationId: cancelOperation
      summary: Cancel an operation that has not been sent
      description: |
        Only while `queued` or `retrying`. Once a request may have reached the marketplace
        the operation cannot be canceled (`409 invalid_state_transition`), because its outcome
        must still be verified.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: The canceled operation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Operation'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        default:
          $ref: '#/components/responses/DefaultError'
  /v1/connections:
    get:
      tags:
        - connections
      operationId: listConnections
      summary: List marketplace connections
      description: One entry per supported marketplace, including assisted ones, so not paginated.
      responses:
        '200':
          description: Every marketplace and its connection state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConnectionList'
        default:
          $ref: '#/components/responses/DefaultError'
  /v1/connections/{marketplace}:
    parameters:
      - $ref: '#/components/parameters/MarketplacePath'
    get:
      tags:
        - connections
      operationId: getConnection
      summary: Get one marketplace connection
      responses:
        '200':
          description: The connection.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Connection'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/DefaultError'
    delete:
      tags:
        - connections
      operationId: disconnectConnection
      summary: Disconnect a marketplace account
      description: |
        Revokes and deletes the stored tokens. Existing listings stay on the marketplace but
        Listora can no longer change or verify them until the account is connected again.
      responses:
        '200':
          description: The connection, now `not_connected`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Connection'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/DefaultError'
  /v1/connections/{marketplace}/authorizations:
    parameters:
      - $ref: '#/components/parameters/MarketplacePath'
    post:
      tags:
        - connections
      operationId: startConnectionAuthorization
      summary: Start connecting a marketplace account (OAuth)
      description: |
        Returns the marketplace's official authorization URL. The app opens it in
        `ASWebAuthenticationSession` with `callbackUrlScheme`. The marketplace redirects the
        browser to `handleConnectionCallback`, which exchanges the code on the server and
        redirects to the app. The app then reads the result with
        `getConnectionAuthorization`; it never trusts the redirect alone. Listora never asks
        for marketplace passwords. `409 marketplace_action_unavailable` for marketplaces
        without an authorized API connection.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConnectionAuthorization'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        default:
          $ref: '#/components/responses/DefaultError'
  /v1/connections/{marketplace}/authorizations/{authorizationId}:
    parameters:
      - $ref: '#/components/parameters/MarketplacePath'
      - $ref: '#/components/parameters/AuthorizationId'
    get:
      tags:
        - connections
      operationId: getConnectionAuthorization
      summary: Get the result of a connection attempt
      responses:
        '200':
          description: The authorization attempt.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConnectionAuthorization'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/DefaultError'
  /v1/connections/{marketplace}/callback:
    parameters:
      - $ref: '#/components/parameters/MarketplacePath'
    get:
      tags:
        - connections
      operationId: handleConnectionCallback
      summary: OAuth redirect target (called by the marketplace, not the app)
      description: |
        The marketplace redirects the user's browser here after consent. No bearer token: the
        single-use, short-lived `state` binds the request to the authorization attempt. The
        server exchanges the code and always answers with a redirect to the app
        (`listora://connections/{marketplace}?authorizationId=...`), also on failure; the
        app then calls `getConnectionAuthorization`. Query parameter names follow OAuth 2.0.
        A request whose `state` names no attempt (missing, unknown, or already used by another
        marketplace) changes nothing and redirects without `authorizationId`; the app then
        reads the attempt it started. A repeated callback with the same `state` only redirects
        again.
      security: []
      parameters:
        - name: state
          in: query
          description: |
            The attempt's `state`. Not marked required: a marketplace's "declined" redirect may
            come without it, and that still has to reach the app.
          schema:
            type: string
            maxLength: 512
        - name: code
          in: query
          description: Authorization code; absent when the user declined.
          schema:
            type: string
            maxLength: 4096
        - name: error
          in: query
          description: OAuth error code, for example `access_denied`.
          schema:
            type: string
            maxLength: 256
        - name: error_description
          in: query
          schema:
            type: string
            maxLength: 2048
      responses:
        '302':
          description: Redirect to the app.
          headers:
            Location:
              description: An app URL with the `listora` scheme.
              required: true
              schema:
                type: string
                format: uri
        default:
          $ref: '#/components/responses/DefaultError'
  /v1/connections/{marketplace}/checks:
    parameters:
      - $ref: '#/components/parameters/MarketplacePath'
    post:
      tags:
        - connections
      operationId: requestConnectionCheck
      summary: Check a marketplace connection now (Retry check)
      description: |
        Queues the same cheap read the daily health check makes, for this connection only. The
        answer is the connection with a `Checking` status; read it again (or
        `getConnectionHealth`) to see what the check found. Offered as the `check` action on a
        connection with a problem. `409 invalid_state_transition` for a connection a check
        cannot change (not connected, or waiting for the seller to reconnect);
        `409 marketplace_action_unavailable` when this server cannot check the marketplace.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '202':
          description: The check is queued.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Connection'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        default:
          $ref: '#/components/responses/DefaultError'
  /v1/connection-health:
    get:
      tags:
        - connections
      operationId: getConnectionHealth
      summary: The account's connection health summary
      description: |
        Every marketplace's connection (as `listConnections`), what needs the seller's
        attention (broken or failing connections and grants that end within 30 days), the
        banner the app shows while anything does, and sale email forwarding.
      responses:
        '200':
          description: The summary.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConnectionHealthSummary'
        default:
          $ref: '#/components/responses/DefaultError'
  /v1/marketplace-sessions:
    get:
      tags:
        - connections
      operationId: listMarketplaceSessions
      summary: List the marketplaces linked by signing in
      description: |
        One entry per marketplace whose connection is a browser session (`connect: session`):
        Poshmark, Mercari, and Depop. Each says whether it is linked, where the app opens the
        marketplace's sign-in page, and which cookies to hand over. Not paginated.
      responses:
        '200':
          description: Every marketplace linked by signing in, and its state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MarketplaceSessionList'
        default:
          $ref: '#/components/responses/DefaultError'
  /v1/marketplace-sessions/{marketplace}:
    parameters:
      - $ref: '#/components/parameters/MarketplacePath'
    get:
      tags:
        - connections
      operationId: getMarketplaceSession
      summary: Get one marketplace's sign-in link
      description: |
        The app polls this after `linkMarketplaceSession` until `status` is no longer
        `checking`. `404` for a marketplace that is not linked by signing in (eBay).
      responses:
        '200':
          description: The marketplace's state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MarketplaceSession'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/DefaultError'
    post:
      tags:
        - connections
      operationId: linkMarketplaceSession
      summary: Link a marketplace with the session the user signed into in the app
      description: |
        The user signed into the marketplace's own sign-in page (`login.url`) inside the app,
        in a web view with its own data store, including any two-step check. The app sends
        that site's cookies (only those on `login.cookieDomains`), never the password, which
        Listora never sees. The server stores them encrypted with the token key (KMS envelope
        encryption) on the account's automation connection for the marketplace, and asks the
        browser runner for one read-only check that the marketplace accepts them. The reply is
        `checking`; poll `getMarketplaceSession` for `linked` or `check_failed`. Relinking
        takes the same way and replaces the earlier session. Cookie values are never logged
        or returned.

        `404` for a marketplace that is not linked by signing in. `409
        marketplace_action_unavailable` when the marketplace is connected through its API.
        `422 validation_failed` (field `cookies`) when a cookie is on another site's domain,
        every cookie has expired, or there are none.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MarketplaceSessionLink'
      responses:
        '201':
          description: Stored; the session is being checked.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MarketplaceSession'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        default:
          $ref: '#/components/responses/DefaultError'
  /v1/sales:
    get:
      tags:
        - sales
      operationId: listSales
      summary: List sales
      description: The sales feed, newest first (by when Listora recorded them), each with its delist runs.
      parameters:
        - name: itemId
          in: query
          description: Only sales whose order contains this item.
          schema:
            $ref: '#/components/schemas/Id'
        - name: status
          in: query
          schema:
            type: array
            items:
              $ref: '#/components/schemas/KnownSaleStatus'
          style: form
          explode: true
        - name: delistStatus
          in: query
          description: |
            Only sales with a delist run in one of these statuses; for example
            `in_progress` and `needs_attention` for the home screen's banner.
          schema:
            type: array
            items:
              $ref: '#/components/schemas/DelistRunStatus'
          style: form
          explode: true
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: A page of sales.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SalePage'
        '400':
          $ref: '#/components/responses/BadRequest'
        default:
          $ref: '#/components/responses/DefaultError'
    post:
      tags:
        - sales
      operationId: createSale
      summary: Record a sale manually ("Mark sold")
      description: |
        For sales Listora did not detect itself. One sale is one order; a bundle lists several
        items. Starts the same automatic delist run as a detected sale: every other listing
        of every item in the order gets a delist operation or an urgent assisted task. A
        sale that contains an already-sold item is recorded with `isDoubleSale: true` and a
        double-sale incident for that item instead of a second delist run.
        `422 validation_failed` when an item appears twice or a `listingId` does not belong
        to its item on `marketplace`.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SaleCreate'
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Sale'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        default:
          $ref: '#/components/responses/DefaultError'
  /v1/sales/{saleId}:
    parameters:
      - $ref: '#/components/parameters/SaleId'
    get:
      tags:
        - sales
      operationId: getSale
      summary: Get a sale and its delist run
      responses:
        '200':
          description: The sale.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Sale'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/DefaultError'
  /v1/sales/{saleId}/confirm:
    parameters:
      - $ref: '#/components/parameters/SaleId'
    post:
      tags:
        - sales
      operationId: confirmSale
      summary: Confirm a sale
      description: |
        The seller confirms a `detected` sale. `409 invalid_state_transition` for any other
        status; `availableActions` lists what a sale allows.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: The sale, now `confirmed`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Sale'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        default:
          $ref: '#/components/responses/DefaultError'
  /v1/sales/{saleId}/ship:
    parameters:
      - $ref: '#/components/parameters/SaleId'
    post:
      tags:
        - sales
      operationId: markSaleShipped
      summary: Mark a sale shipped
      description: |
        A `detected` or `confirmed` sale is `shipped`, and its items too. `shippingCost`
        records what the label cost outside the payout, for the profit; send `{}` without one.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SaleShipment'
      responses:
        '200':
          description: The sale, now `shipped`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Sale'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        default:
          $ref: '#/components/responses/DefaultError'
  /v1/sales/{saleId}/cancel:
    parameters:
      - $ref: '#/components/parameters/SaleId'
    post:
      tags:
        - sales
      operationId: cancelSale
      summary: Record that a sale was canceled
      description: |
        For a `detected` or `confirmed` sale whose order was canceled. Delists of the sale that
        reached no marketplace yet are stopped; the rest finish and show what is true. Each
        item with no other sale that stands goes back to inventory, and Listora asks whether
        to relist it (`items[].relist`, decided with `decideSaleRelist`). Nothing is relisted
        until the seller chooses.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: The sale, now `canceled`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Sale'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        default:
          $ref: '#/components/responses/DefaultError'
  /v1/sales/{saleId}/return:
    parameters:
      - $ref: '#/components/parameters/SaleId'
    post:
      tags:
        - sales
      operationId: recordSaleReturn
      summary: Record that a sale was returned
      description: |
        For a `confirmed` or `shipped` sale the buyer returned. As with `cancelSale`, the
        items go back to inventory and Listora asks whether to relist them.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: The sale, now `returned`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Sale'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        default:
          $ref: '#/components/responses/DefaultError'
  /v1/sales/{saleId}/relist:
    parameters:
      - $ref: '#/components/parameters/SaleId'
    post:
      tags:
        - sales
      operationId: decideSaleRelist
      summary: Answer "Relist it?" after a cancel or return
      description: |
        For each item whose `relist.decision` is `pending`: relist it on the chosen listings
        (each one a `relist` operation on the engine, shown on the item's listings until the
        marketplace confirms it or the user does an assisted step), or, with no listings, don't
        relist it. `409 invalid_state_transition` when an item's decision is not pending;
        `422 validation_failed` when a listing is not one of the item's options that can be
        relisted now.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SaleRelistChoice'
      responses:
        '200':
          description: The sale with the decisions recorded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Sale'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        default:
          $ref: '#/components/responses/DefaultError'
  /v1/profit:
    get:
      tags:
        - profit
      operationId: getProfit
      summary: Get the profit dashboard for a period
      description: |
        The seller's results for the days `from` to `to` (inclusive) in `timeZone`: revenue,
        fees, shipping, cost of goods, net profit, ROI, the averages, sell-through, a series by
        day, week, or month, the seller's own totals per marketplace (in a fixed order, never
        ranked), the best and worst brands and categories, and dead stock today. Every amount is
        computed from the sales' fee lines and the items' costs exactly as each sale's own money
        is (`Sale`), so the dashboard and the sale screens agree to the cent. No AI is involved.
        `422 validation_failed` when `to` is before `from`, the period is longer than 3660 days,
        or `timeZone` is not an IANA time zone.
      parameters:
        - name: from
          in: query
          required: true
          description: The period's first day in `timeZone`.
          schema:
            type: string
            format: date
        - name: to
          in: query
          required: true
          description: The period's last day in `timeZone` (inclusive).
          schema:
            type: string
            format: date
        - name: timeZone
          in: query
          required: true
          description: The seller's IANA time zone, for example `America/New_York`.
          schema:
            type: string
            minLength: 1
            maxLength: 64
      responses:
        '200':
          description: The period's report.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfitReport'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        default:
          $ref: '#/components/responses/DefaultError'
  /v1/tasks:
    get:
      tags:
        - tasks
      operationId: listTasks
      summary: List assisted-mode tasks
      description: Urgent first, then oldest first.
      parameters:
        - name: status
          in: query
          schema:
            type: array
            items:
              $ref: '#/components/schemas/UserTaskStatus'
          style: form
          explode: true
        - name: itemId
          in: query
          schema:
            $ref: '#/components/schemas/Id'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: A page of tasks.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserTaskPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        default:
          $ref: '#/components/responses/DefaultError'
  /v1/tasks/{taskId}:
    parameters:
      - $ref: '#/components/parameters/TaskId'
    get:
      tags:
        - tasks
      operationId: getTask
      summary: Get a task
      responses:
        '200':
          description: The task.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserTask'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/DefaultError'
  /v1/tasks/{taskId}/complete:
    parameters:
      - $ref: '#/components/parameters/TaskId'
    post:
      tags:
        - tasks
      operationId: completeTask
      summary: Confirm that the user did the task
      description: |
        The explicit user confirmation that finishes an assisted operation. The linked
        listing then shows "Done (you confirmed)", never "confirmed by <marketplace>".
        `409 invalid_state_transition` when the task is not `open`.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserTaskCompletion'
      responses:
        '200':
          description: The completed task.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserTask'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        default:
          $ref: '#/components/responses/DefaultError'
  /v1/tasks/{taskId}/dismiss:
    parameters:
      - $ref: '#/components/parameters/TaskId'
    post:
      tags:
        - tasks
      operationId: dismissTask
      summary: Dismiss a task without doing it
      description: |
        Dismissing never counts as doing the work: a linked operation becomes `failed` (with
        a Retry action), not `succeeded`.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: The dismissed task.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserTask'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        default:
          $ref: '#/components/responses/DefaultError'
  /v1/today:
    get:
      tags:
        - today
      operationId: getToday
      summary: Get what needs the seller today
      description: |
        The Today screen: one card per thing that needs the seller (items to ship, delists that
        are not done, connections to reconnect, drafts to review, and old listings that could use
        a price drop or a relist), most urgent first, and the money summary. Computed from the
        account's own data on every request, with no AI and no marketplace call, so the app asks
        for it each time it opens. A card is gone once its work is done.
      responses:
        '200':
          description: The summary as of `generatedAt`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Today'
        default:
          $ref: '#/components/responses/DefaultError'
  /v1/today/settings:
    get:
      tags:
        - today
      operationId: getTodaySettings
      summary: Get the morning summary setting
      description: The account's morning summary notification setting (defaults until saved).
      responses:
        '200':
          description: The setting.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TodaySummarySettings'
        default:
          $ref: '#/components/responses/DefaultError'
    put:
      tags:
        - today
      operationId: replaceTodaySettings
      summary: Replace the morning summary setting
      description: |
        Turns the morning summary on or off and sets its time, in the device's time zone. A time
        zone the server does not know is `422 validation_failed`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TodaySummarySettingsReplace'
      responses:
        '200':
          description: The saved setting.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TodaySummarySettings'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        default:
          $ref: '#/components/responses/DefaultError'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        A token from the auth driver: in production a Cognito user pool access or ID token
        (the app sends the ID token, which carries the verified email the first sign-in names
        the account after); locally a dev OTP session token.
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: |
        A unique client-generated key (use a UUID v4) per logical action, reused unchanged on
        every retry of that action. The server stores the first successful response for at
        least 24 hours: a retry with the same key and body gets that response again without
        repeating the action; the same key with a different body gets
        `422 idempotency_key_reused`; a retry while the first request is still running gets
        `409 idempotency_key_in_progress`. A request that failed changed nothing and is not
        stored, so retrying it with the same key runs it again.
      schema:
        type: string
        minLength: 1
        maxLength: 255
    Cursor:
      name: cursor
      in: query
      description: Opaque cursor from a previous page's `nextCursor`. Omit for the first page.
      schema:
        type: string
        maxLength: 1024
    Limit:
      name: limit
      in: query
      description: Page size.
      schema:
        type: integer
        format: int32
        minimum: 1
        maximum: 100
        default: 25
    ItemId:
      name: itemId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Id'
    PhotoId:
      name: photoId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Id'
    SessionId:
      name: sessionId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Id'
    BatchId:
      name: batchId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Id'
    AnalysisId:
      name: analysisId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Id'
    ListingId:
      name: listingId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Id'
    OperationId:
      name: operationId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Id'
    AuthorizationId:
      name: authorizationId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Id'
    SaleId:
      name: saleId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Id'
    TaskId:
      name: taskId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Id'
    MarketplacePath:
      name: marketplace
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/KnownMarketplace'
  responses:
    DefaultError:
      description: Any error. See `KnownErrorCode` for the codes and their HTTP statuses.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    BadRequest:
      description: Malformed request, for example an invalid cursor (`invalid_request`).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: The resource does not exist in this account (`not_found`).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Conflict:
      description: |
        The request conflicts with the current state, for example `version_conflict`,
        `invalid_state_transition`, `already_exists`, or a marketplace that is not connected.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ValidationFailed:
      description: The body is well-formed but invalid (`validation_failed`, with `fieldErrors`).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    PayloadTooLarge:
      description: A declared file is larger than allowed (`payload_too_large`).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    QuotaExceeded:
      description: The plan's quota for this action is used up (`quota_exceeded`).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    RateLimited:
      description: Too many requests or the daily AI budget is reached; see `retryAfterSeconds`.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ServiceUnavailable:
      description: A service the request needs is switched off or down (`service_unavailable`).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ListingOperationAccepted:
      description: The operation was queued. Watch `operation.status` or the listing's `statusDisplay`.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ListingOperationAccepted'
  schemas:
    Id:
      type: string
      format: uuid
      description: Server-generated UUID.
    Timestamp:
      type: string
      format: date-time
      description: RFC 3339 timestamp in UTC.
    Sku:
      type: string
      description: Account prefix, a dash, and a zero-padded gapless number, for example `AJ-000184`.
      pattern: ^[A-Z0-9]{1,8}-[0-9]{6,}$
      maxLength: 32
    CurrencyCode:
      type: string
      description: ISO 4217 code. Listora launches US-only, so USD is the only currency for now.
      enum:
        - USD
    Money:
      type: object
      description: An amount in integer minor units (cents) plus a currency. Never a floating-point amount.
      required:
        - amountCents
        - currency
      properties:
        amountCents:
          type: integer
          format: int64
          minimum: -9007199254740991
          maximum: 9007199254740991
          description: Integer minor units, for example 3400 for $34.00.
        currency:
          $ref: '#/components/schemas/CurrencyCode'
    Marketplace:
      description: |
        A `KnownMarketplace`, or a marketplace added after this client was built. Clients show
        an unknown marketplace generically (its raw id and the server's `statusDisplay`).
      anyOf:
        - $ref: '#/components/schemas/KnownMarketplace'
        - type: string
          maxLength: 64
    KnownMarketplace:
      type: string
      enum:
        - ebay
        - depop
        - poshmark
        - mercari
    IntegrationMode:
      description: |
        A `KnownIntegrationMode`, or a mode added after this client was built. Clients offer
        nothing that depends on an unknown mode.
      anyOf:
        - $ref: '#/components/schemas/KnownIntegrationMode'
        - type: string
          maxLength: 64
    KnownIntegrationMode:
      type: string
      description: |
        `api`: Listora acts through the marketplace's official API and verifies by read-back.
        `automation`: Listora's browser runner acts in the seller's own marketplace session
        (where the marketplace permits it and has no API) and verifies by read-back through that
        session. `assisted`: Listora prepares the work and the user does the final step in the
        marketplace app, then confirms.
      enum:
        - api
        - automation
        - assisted
    StatusTone:
      description: |
        A `KnownStatusTone`, or a tone added after this client was built. Clients style an
        unknown tone like `neutral` and still show the `label`.
      anyOf:
        - $ref: '#/components/schemas/KnownStatusTone'
        - type: string
          maxLength: 64
    KnownStatusTone:
      type: string
      description: |
        How to style a status. `success` is used only for states verified by an API read-back
        or confirmed by the user.
      enum:
        - success
        - in_progress
        - checking
        - failed
        - action_needed
        - neutral
    StatusDisplay:
      type: object
      description: |
        Server-rendered honest status, for example `Active (confirmed by eBay)`,
        `Delisting... retry 2 of 6`, `Delist failed - Retry`, `Checking...`,
        `Action needed - delist on Poshmark`, or `Done (you confirmed)`. Clients show
        `label` as given and never compute success themselves.
      required:
        - tone
        - label
      properties:
        tone:
          $ref: '#/components/schemas/StatusTone'
        label:
          type: string
          maxLength: 120
        detail:
          type: string
          maxLength: 1000
          description: Extra context, for example the marketplace's error text.
    VerificationMethod:
      type: string
      description: '`marketplace_api`: confirmed by a read-back from the marketplace (its API, or the automated browser session). `user_confirmation`: the user confirmed an assisted task.'
      enum:
        - marketplace_api
        - user_confirmation
    Verification:
      type: object
      description: How and when the current state was established. Absent when it is not verified.
      required:
        - method
        - verifiedAt
      properties:
        method:
          $ref: '#/components/schemas/VerificationMethod'
        verifiedAt:
          $ref: '#/components/schemas/Timestamp'
    Provenance:
      description: |
        A `KnownProvenance`, or a source added after this client was built. Clients treat an
        unknown source as not entered by the user (highlight it for review).
      anyOf:
        - $ref: '#/components/schemas/KnownProvenance'
        - type: string
          maxLength: 64
    KnownProvenance:
      type: string
      description: Where a field value came from.
      enum:
        - ai
        - ocr
        - barcode
        - user
    ErrorResponse:
      type: object
      description: The body of every error response.
      required:
        - error
      properties:
        error:
          $ref: '#/components/schemas/ApiError'
    ApiError:
      type: object
      required:
        - code
        - message
        - retryable
        - requestId
      properties:
        code:
          $ref: '#/components/schemas/ErrorCode'
        message:
          type: string
          maxLength: 1000
          description: User-readable explanation, safe to show as is. Never contains secrets.
        retryable:
          type: boolean
          description: |
            True when the same request may succeed later without changes. Retry it with the
            same `Idempotency-Key`, after `retryAfterSeconds` when present.
        retryAfterSeconds:
          type: integer
          format: int32
          minimum: 0
        requestId:
          type: string
          maxLength: 128
          description: Correlates with server logs; show it in support views.
        fieldErrors:
          type: array
          description: Per-field problems for `validation_failed`.
          maxItems: 100
          items:
            $ref: '#/components/schemas/FieldError'
    FieldError:
      type: object
      required:
        - field
        - message
      properties:
        field:
          type: string
          maxLength: 200
          description: Dotted path into the request body, for example `details.title` or `variant.price`.
        message:
          type: string
          maxLength: 500
    ErrorCode:
      description: |
        A `KnownErrorCode`, or a code added after this client was built. Clients must handle
        unknown codes by using `message` and `retryable`, so new codes never break decoding.
      anyOf:
        - $ref: '#/components/schemas/KnownErrorCode'
        - type: string
          maxLength: 64
    KnownErrorCode:
      type: string
      description: |
        HTTP status per code: `invalid_request` 400; `unauthenticated` 401; `quota_exceeded`
        402; `forbidden` 403; `not_found` 404; `version_conflict`, `invalid_state_transition`,
        `already_exists`, `idempotency_key_in_progress`, `upload_incomplete`,
        `upload_expired`, `marketplace_not_connected`, `marketplace_reauth_required`,
        `marketplace_action_unavailable` 409; `payload_too_large` 413; `validation_failed`,
        `idempotency_key_reused` 422; `rate_limited`, `ai_budget_exceeded` 429;
        `internal_error` 500; `service_unavailable` 503. `marketplace_authorization_denied`
        and `marketplace_authorization_failed` appear only inside a failed
        `ConnectionAuthorization`.
      enum:
        - invalid_request
        - unauthenticated
        - quota_exceeded
        - forbidden
        - not_found
        - version_conflict
        - invalid_state_transition
        - already_exists
        - idempotency_key_in_progress
        - upload_incomplete
        - upload_expired
        - marketplace_not_connected
        - marketplace_reauth_required
        - marketplace_action_unavailable
        - payload_too_large
        - validation_failed
        - idempotency_key_reused
        - rate_limited
        - ai_budget_exceeded
        - internal_error
        - service_unavailable
        - marketplace_authorization_denied
        - marketplace_authorization_failed
    AccountDeletion:
      type: object
      required:
        - deletedAt
        - marketplaceAccess
      properties:
        deletedAt:
          $ref: '#/components/schemas/Timestamp'
        marketplaceAccess:
          type: array
          maxItems: 100
          description: One entry per API marketplace connection the account had; assisted connections hold no access.
          items:
            $ref: '#/components/schemas/MarketplaceAccessRevocation'
    MarketplaceAccessRevocation:
      type: object
      required:
        - marketplace
        - revoked
      properties:
        marketplace:
          $ref: '#/components/schemas/Marketplace'
        displayName:
          type: string
          maxLength: 200
          description: The seller's name on the marketplace.
        revoked:
          type: boolean
          description: |
            True only when the marketplace had confirmed, before the deletion, that Listora's
            access is revoked. False means it is not confirmed, so the user must revoke it
            manually in the marketplace's settings (Listora also keeps asking the marketplace
            for up to 7 days when it still holds the connection's tokens).
    HealthCheckStatus:
      type: string
      enum:
        - ok
        - unavailable
    HealthLive:
      type: object
      required:
        - status
      properties:
        status:
          $ref: '#/components/schemas/HealthCheckStatus'
    HealthReady:
      type: object
      required:
        - status
        - checks
      properties:
        status:
          $ref: '#/components/schemas/HealthCheckStatus'
        checks:
          type: object
          required:
            - database
          properties:
            database:
              $ref: '#/components/schemas/HealthCheckStatus'
    ItemStatus:
      description: |
        A `KnownItemStatus`, or a status added after this client was built. Clients show an
        unknown status generically and offer no status-specific action for it.
      anyOf:
        - $ref: '#/components/schemas/KnownItemStatus'
        - type: string
          maxLength: 64
    KnownItemStatus:
      type: string
      description: |
        `draft` and `ready` are set by the user; `archived` by the user for an item with no
        live listing. `listed`, `sold_pending_delist`, `sold`, and `shipped` are set by the
        server from listings and sales. An archived item can be set back to either `draft` or
        `ready` only if it was `draft` or `ready` when it was archived and has never been sold;
        otherwise the server answers `409 invalid_state_transition` and the item stays
        archived.
      enum:
        - draft
        - ready
        - listed
        - sold_pending_delist
        - sold
        - shipped
        - archived
    UserSettableItemStatus:
      type: string
      description: The item statuses a client may set directly.
      enum:
        - draft
        - ready
        - archived
    ItemCondition:
      type: string
      description: Canonical condition; each marketplace adapter maps it to that marketplace's values.
      enum:
        - new_with_tags
        - new_without_tags
        - new_with_defects
        - pre_owned_excellent
        - pre_owned_good
        - pre_owned_fair
    MeasurementUnit:
      type: string
      enum:
        - in
        - cm
    Measurement:
      type: object
      required:
        - name
        - value
        - unit
      properties:
        name:
          type: string
          maxLength: 64
          description: Canonical name, for example `pit_to_pit`, `length`, `inseam`.
        value:
          type: number
          minimum: 0
          maximum: 10000
        unit:
          $ref: '#/components/schemas/MeasurementUnit'
    ItemDetails:
      type: object
      description: |
        Every user-editable property of an item. All are optional: a property that is absent
        has no value. `replaceItem` replaces this object as a whole.
      properties:
        title:
          type: string
          maxLength: 200
        description:
          type: string
          maxLength: 10000
        brand:
          type: string
          maxLength: 120
        productName:
          type: string
          maxLength: 200
        styleNumber:
          type: string
          maxLength: 64
        rnNumber:
          type: string
          maxLength: 16
          description: Registered identification number from the care tag.
        upc:
          type: string
          maxLength: 14
          description: UPC or EAN digits, checksum-validated by the server.
        department:
          type: string
          maxLength: 64
          description: Canonical department, for example `women`, `men`, `kids`, `unisex`.
        category:
          type: string
          maxLength: 200
          description: |
            Canonical taxonomy path `<category>/<subcategory>`, for example
            `clothing/tops/t_shirts` (`CATEGORY_TREE` in @listora/analysis).
        sizeLabel:
          type: string
          maxLength: 32
          description: The size as printed, for example `M` or `32x30`.
        sizeSystem:
          type: string
          maxLength: 16
          description: |
            How to read `sizeLabel`: `letter` (XS to XXXL), `numeric`, `waist_inseam`
            (`32x30`), `us`, `uk`, or `eu` (labeled on the tag), or `one_size`.
        colors:
          type: array
          maxItems: 10
          items:
            type: string
            maxLength: 32
        pattern:
          type: string
          maxLength: 64
        materials:
          type: array
          maxItems: 10
          items:
            type: string
            maxLength: 64
        condition:
          $ref: '#/components/schemas/ItemCondition'
        conditionNotes:
          type: string
          maxLength: 2000
        flaws:
          type: array
          maxItems: 20
          items:
            type: string
            maxLength: 200
        keywords:
          type: array
          maxItems: 30
          items:
            type: string
            maxLength: 64
        measurements:
          type: array
          maxItems: 20
          items:
            $ref: '#/components/schemas/Measurement'
        listPrice:
          $ref: '#/components/schemas/Money'
        floorPrice:
          $ref: '#/components/schemas/Money'
        cost:
          $ref: '#/components/schemas/Money'
        purchaseDate:
          type: string
          format: date
        purchaseSource:
          type: string
          maxLength: 200
        quantity:
          type: integer
          format: int32
          minimum: 1
          maximum: 10000
          default: 1
        storageLocationId:
          $ref: '#/components/schemas/Id'
          description: The storage location where the item is kept (for example a bin or shelf).
        acceptedAnalysisId:
          $ref: '#/components/schemas/Id'
          description: The analysis whose proposals the user accepted; see `Item.fieldProvenance`.
    ItemCreate:
      type: object
      properties:
        details:
          $ref: '#/components/schemas/ItemDetails'
    ItemReplace:
      type: object
      required:
        - expectedVersion
        - details
      properties:
        expectedVersion:
          type: integer
          format: int64
          minimum: 1
          description: The `version` the client last read (optimistic lock).
        status:
          $ref: '#/components/schemas/UserSettableItemStatus'
        details:
          $ref: '#/components/schemas/ItemDetails'
    Item:
      type: object
      required:
        - id
        - sku
        - status
        - version
        - details
        - photos
        - listings
        - createdAt
        - updatedAt
      properties:
        id:
          $ref: '#/components/schemas/Id'
        sku:
          $ref: '#/components/schemas/Sku'
        status:
          $ref: '#/components/schemas/ItemStatus'
        version:
          type: integer
          format: int64
          minimum: 1
          description: Increases on every change; send it back as `expectedVersion`.
        details:
          $ref: '#/components/schemas/ItemDetails'
        fieldProvenance:
          type: object
          description: |
            Read-only: where each detail came from, keyed by property name, for example
            `{"brand": "ocr"}`. The server owns it and clients never send it. A detail whose
            value equals the accepted analysis's value keeps that analysis's source; any other
            detail written through the API is `user`.
          additionalProperties:
            $ref: '#/components/schemas/Provenance'
        storageLocation:
          $ref: '#/components/schemas/StorageLocationSummary'
          description: Read-only; the location `details.storageLocationId` refers to.
        photos:
          type: array
          description: In display order; the first is the cover.
          items:
            $ref: '#/components/schemas/Photo'
        listings:
          type: array
          items:
            $ref: '#/components/schemas/Listing'
        saleSummary:
          $ref: '#/components/schemas/ItemSaleSummary'
        delistRun:
          $ref: '#/components/schemas/DelistRun'
          description: |
            The delist run of the item's latest sale (the "Sold" banner and the delist results),
            once the item has sold. Absent for an item that never sold.
        doubleSale:
          $ref: '#/components/schemas/DoubleSale'
          description: The item's newest double sale that is still open; absent when there is none.
        relistPrompt:
          $ref: '#/components/schemas/ItemRelistPrompt'
        createdAt:
          $ref: '#/components/schemas/Timestamp'
        updatedAt:
          $ref: '#/components/schemas/Timestamp'
    StorageLocationSummary:
      type: object
      description: Where an item is kept.
      required:
        - id
        - code
        - label
      properties:
        id:
          $ref: '#/components/schemas/Id'
        code:
          type: string
          maxLength: 32
          description: The short code printed on the bin or shelf, for example `B-12`.
        label:
          type: string
          maxLength: 120
          description: For example "Garage shelf 3, bin 12".
    ItemRelistPrompt:
      type: object
      description: |
        The item's sale was canceled or returned and the seller has not decided whether to
        relist it. The app asks, with the options in the sale's `items[].relist`.
      required:
        - saleId
        - saleStatus
        - soldOn
      properties:
        saleId:
          $ref: '#/components/schemas/Id'
        saleStatus:
          $ref: '#/components/schemas/SaleStatus'
          description: '`canceled` or `returned`.'
        soldOn:
          $ref: '#/components/schemas/Marketplace'
    ItemSaleSummary:
      type: object
      description: |
        Read-only result of the item's sale. Present only when the item has sold (status
        `sold_pending_delist`, `sold`, or `shipped`). For an item sold in a bundle, the
        order's fees and shipping cost are split across its items in proportion to each
        item's `salePrice`. A value is absent until it is known.
      required:
        - saleId
        - soldAt
        - salePrice
      properties:
        saleId:
          $ref: '#/components/schemas/Id'
        soldOn:
          $ref: '#/components/schemas/Marketplace'
        saleStatus:
          $ref: '#/components/schemas/SaleStatus'
        feesEstimated:
          type: boolean
          description: True while any of the sale's fees is an estimate; `netProceeds` and `profit` are estimates then.
        soldAt:
          $ref: '#/components/schemas/Timestamp'
        salePrice:
          $ref: '#/components/schemas/Money'
        netProceeds:
          $ref: '#/components/schemas/Money'
          description: This item's share of the sale's `netProceeds`.
        profit:
          $ref: '#/components/schemas/Money'
          description: This item's share of `netProceeds`, minus its share of `shippingCost`, minus its `cost`.
        roiBasisPoints:
          type: integer
          format: int64
          description: |
            Return on investment, `profit` divided by the item's `cost`, in basis points
            (12550 is 125.5%). Absent when `profit` is absent or the cost is zero.
    ItemSummary:
      type: object
      description: The item as shown in inventory lists.
      required:
        - id
        - sku
        - status
        - listings
        - createdAt
        - updatedAt
      properties:
        id:
          $ref: '#/components/schemas/Id'
        sku:
          $ref: '#/components/schemas/Sku'
        status:
          $ref: '#/components/schemas/ItemStatus'
        title:
          type: string
          maxLength: 200
        brand:
          type: string
          maxLength: 120
        sizeLabel:
          type: string
          maxLength: 32
        listPrice:
          $ref: '#/components/schemas/Money'
        coverPhoto:
          $ref: '#/components/schemas/Photo'
        listings:
          type: array
          items:
            $ref: '#/components/schemas/ListingStatusSummary'
        createdAt:
          $ref: '#/components/schemas/Timestamp'
        updatedAt:
          $ref: '#/components/schemas/Timestamp'
    ItemPage:
      type: object
      required:
        - data
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/ItemSummary'
        nextCursor:
          type: string
          description: Present when there are more results.
    PhotoRole:
      type: string
      enum:
        - front
        - back
        - tag
        - flaw
        - detail
    PhotoStatus:
      type: string
      description: '`processing` until the derived images exist; `failed` when the file is not a usable image.'
      enum:
        - processing
        - ready
        - failed
    ImageContentType:
      type: string
      description: |
        JPEG only: the server's image pipeline cannot decode HEIC, so clients convert photos to
        JPEG when they resize them.
      enum:
        - image/jpeg
    OcrLine:
      type: object
      description: A text line recognized on the device (Vision).
      required:
        - text
        - confidence
      properties:
        text:
          type: string
          maxLength: 500
        confidence:
          type: number
          minimum: 0
          maximum: 1
    Barcode:
      type: object
      description: A barcode detected on the device.
      required:
        - symbology
        - payload
      properties:
        symbology:
          type: string
          maxLength: 32
          description: For example `ean13`, `upce`, `qr`.
        payload:
          type: string
          maxLength: 2048
    PhotoUrls:
      type: object
      description: Unguessable URLs of the derived images; present only when the photo is `ready`.
      required:
        - thumbnail
        - listing
      properties:
        thumbnail:
          type: string
          format: uri
          description: 400 px long edge.
        listing:
          type: string
          format: uri
          description: 1600 px long edge; what marketplaces fetch.
    Photo:
      type: object
      required:
        - id
        - itemId
        - position
        - role
        - status
        - width
        - height
        - sha256
        - ocrLines
        - barcodes
        - createdAt
      properties:
        id:
          $ref: '#/components/schemas/Id'
        itemId:
          $ref: '#/components/schemas/Id'
        position:
          type: integer
          format: int32
          minimum: 0
        role:
          $ref: '#/components/schemas/PhotoRole'
        status:
          $ref: '#/components/schemas/PhotoStatus'
        width:
          type: integer
          format: int32
          minimum: 1
        height:
          type: integer
          format: int32
          minimum: 1
        sha256:
          $ref: '#/components/schemas/Sha256'
        urls:
          $ref: '#/components/schemas/PhotoUrls'
        failureReason:
          type: string
          maxLength: 500
          description: Why the file is not a usable image, for the user; present only when `status` is `failed`.
        ocrLines:
          type: array
          items:
            $ref: '#/components/schemas/OcrLine'
        barcodes:
          type: array
          items:
            $ref: '#/components/schemas/Barcode'
        createdAt:
          $ref: '#/components/schemas/Timestamp'
    PhotoList:
      type: object
      required:
        - data
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Photo'
    PhotoCreate:
      type: object
      required:
        - uploadFileId
        - role
      properties:
        uploadFileId:
          $ref: '#/components/schemas/Id'
        role:
          $ref: '#/components/schemas/PhotoRole'
        position:
          type: integer
          format: int32
          minimum: 0
          description: Insert position; appended when absent.
        width:
          type: integer
          format: int32
          minimum: 1
        height:
          type: integer
          format: int32
          minimum: 1
        ocrLines:
          type: array
          maxItems: 500
          items:
            $ref: '#/components/schemas/OcrLine'
        barcodes:
          type: array
          maxItems: 50
          items:
            $ref: '#/components/schemas/Barcode'
    PhotoUpdate:
      type: object
      required:
        - role
      properties:
        role:
          $ref: '#/components/schemas/PhotoRole'
    PhotoOrder:
      type: object
      required:
        - photoIds
      properties:
        photoIds:
          type: array
          minItems: 1
          maxItems: 24
          items:
            $ref: '#/components/schemas/Id'
    Sha256:
      type: string
      description: Lowercase hex SHA-256 of the file bytes.
      pattern: ^[0-9a-f]{64}$
    UploadFileCreate:
      type: object
      required:
        - contentType
        - byteSize
        - sha256
      properties:
        contentType:
          $ref: '#/components/schemas/ImageContentType'
        byteSize:
          type: integer
          format: int64
          minimum: 1
          maximum: 20971520
          description: At most 20 MiB.
        sha256:
          $ref: '#/components/schemas/Sha256'
    UploadSessionCreate:
      type: object
      required:
        - files
      properties:
        files:
          type: array
          minItems: 1
          maxItems: 24
          items:
            $ref: '#/components/schemas/UploadFileCreate'
    UploadFileStatus:
      type: string
      description: '`pending`: bytes not received yet. `uploaded`: bytes received and verified. `attached`: used by a photo.'
      enum:
        - pending
        - uploaded
        - attached
    HttpHeader:
      type: object
      required:
        - name
        - value
      properties:
        name:
          type: string
          maxLength: 256
        value:
          type: string
          maxLength: 4096
    UploadTarget:
      type: object
      description: Where and how to send one file's bytes. Send exactly these headers.
      required:
        - method
        - url
        - headers
        - expiresAt
      properties:
        method:
          type: string
          enum:
            - PUT
        url:
          type: string
          format: uri
        headers:
          type: array
          items:
            $ref: '#/components/schemas/HttpHeader'
        expiresAt:
          $ref: '#/components/schemas/Timestamp'
    UploadFile:
      type: object
      required:
        - id
        - status
        - contentType
        - byteSize
        - sha256
      properties:
        id:
          $ref: '#/components/schemas/Id'
        status:
          $ref: '#/components/schemas/UploadFileStatus'
        contentType:
          $ref: '#/components/schemas/ImageContentType'
        byteSize:
          type: integer
          format: int64
          minimum: 1
        sha256:
          $ref: '#/components/schemas/Sha256'
        upload:
          $ref: '#/components/schemas/UploadTarget'
    UploadSession:
      type: object
      required:
        - id
        - expiresAt
        - files
        - createdAt
      properties:
        id:
          $ref: '#/components/schemas/Id'
        expiresAt:
          $ref: '#/components/schemas/Timestamp'
        files:
          type: array
          description: In the order of the request's `files`. `upload` is present only for `pending` files.
          items:
            $ref: '#/components/schemas/UploadFile'
        createdAt:
          $ref: '#/components/schemas/Timestamp'
    AnalysisTier:
      type: string
      description: '`fast`: the default low-cost model. `premium`: "Identify harder", counted against the plan quota.'
      enum:
        - fast
        - premium
    AnalysisStatus:
      type: string
      enum:
        - queued
        - running
        - completed
        - failed
    AnalysisProvenance:
      description: |
        A `KnownAnalysisProvenance`, or a source added after this client was built. Clients
        treat an unknown source like `ai`.
      anyOf:
        - $ref: '#/components/schemas/KnownAnalysisProvenance'
        - type: string
          maxLength: 64
    KnownAnalysisProvenance:
      type: string
      description: Where an analyzed value came from (users are not a source inside an analysis).
      enum:
        - ai
        - ocr
        - barcode
    Confidence:
      type: number
      minimum: 0
      maximum: 1
      description: 0 to 1. Clients highlight low-confidence fields for review.
    AnalyzedText:
      type: object
      required:
        - value
        - confidence
        - provenance
      properties:
        value:
          type: string
          maxLength: 10000
        confidence:
          $ref: '#/components/schemas/Confidence'
        provenance:
          $ref: '#/components/schemas/AnalysisProvenance'
    AnalyzedTextList:
      type: object
      required:
        - values
        - confidence
        - provenance
      properties:
        values:
          type: array
          items:
            type: string
            maxLength: 200
        confidence:
          $ref: '#/components/schemas/Confidence'
        provenance:
          $ref: '#/components/schemas/AnalysisProvenance'
    AnalyzedCondition:
      type: object
      required:
        - value
        - confidence
        - provenance
      properties:
        value:
          $ref: '#/components/schemas/ItemCondition'
        confidence:
          $ref: '#/components/schemas/Confidence'
        provenance:
          $ref: '#/components/schemas/AnalysisProvenance'
    AnalyzedDetails:
      type: object
      description: Proposed item details; a property is absent when the analysis found nothing.
      properties:
        title:
          $ref: '#/components/schemas/AnalyzedText'
        description:
          $ref: '#/components/schemas/AnalyzedText'
        brand:
          $ref: '#/components/schemas/AnalyzedText'
        productName:
          $ref: '#/components/schemas/AnalyzedText'
        styleNumber:
          $ref: '#/components/schemas/AnalyzedText'
        rnNumber:
          $ref: '#/components/schemas/AnalyzedText'
        upc:
          $ref: '#/components/schemas/AnalyzedText'
        department:
          $ref: '#/components/schemas/AnalyzedText'
        category:
          $ref: '#/components/schemas/AnalyzedText'
        sizeLabel:
          $ref: '#/components/schemas/AnalyzedText'
        sizeSystem:
          $ref: '#/components/schemas/AnalyzedText'
        colors:
          $ref: '#/components/schemas/AnalyzedTextList'
        pattern:
          $ref: '#/components/schemas/AnalyzedText'
        materials:
          $ref: '#/components/schemas/AnalyzedTextList'
        condition:
          $ref: '#/components/schemas/AnalyzedCondition'
        conditionNotes:
          $ref: '#/components/schemas/AnalyzedText'
        flaws:
          $ref: '#/components/schemas/AnalyzedTextList'
        keywords:
          $ref: '#/components/schemas/AnalyzedTextList'
    VariantSuggestion:
      type: object
      description: |
        Marketplace-specific copy written by the analysis, within that marketplace's limits:
        eBay and Poshmark titles up to 80 characters, a Poshmark description up to 1,500, and
        a Mercari title and description up to 80 and 1,000. Depop has no title (this one is a
        short headline); its `description` and `hashtags` (up to 5, without the `#`) together
        fit Depop's 1,000 characters once the hashtags are appended on their own line.
      required:
        - marketplace
        - title
        - description
      properties:
        marketplace:
          $ref: '#/components/schemas/Marketplace'
        title:
          type: string
          maxLength: 200
        description:
          type: string
          maxLength: 10000
        hashtags:
          type: array
          maxItems: 10
          items:
            type: string
            maxLength: 64
    AnalysisResult:
      type: object
      required:
        - details
        - variants
        - needsEscalation
      properties:
        details:
          $ref: '#/components/schemas/AnalyzedDetails'
        variants:
          type: array
          items:
            $ref: '#/components/schemas/VariantSuggestion'
        priceEstimate:
          $ref: '#/components/schemas/AiPriceEstimate'
        needsEscalation:
          type: boolean
          description: |
            True when a fast analysis suggests "Identify harder": its brand or product is
            uncertain, the item looks designer or vintage, or the model asked for it. Always
            false for a premium analysis.
        escalationReason:
          type: string
          maxLength: 500
    AnalysisFailure:
      type: object
      description: |
        Why the analysis failed. Starting or escalating it again queues it again; `retryable`
        says whether that may succeed without changing anything (for example after a
        provider outage), as opposed to needing other photos or a plan change.
      required:
        - code
        - message
        - retryable
      properties:
        code:
          type: string
          maxLength: 64
          description: |
            Stable snake_case, for example `invalid_output` (the AI's answer broke the schema
            twice), `rate_limited`, `ai_budget_exceeded`, `quota_exceeded`, `photo_set_changed`.
        message:
          type: string
          maxLength: 1000
          description: Safe to show to the user.
        retryable:
          type: boolean
    Analysis:
      type: object
      required:
        - id
        - itemId
        - photoSetHash
        - tier
        - status
        - createdAt
      properties:
        id:
          $ref: '#/components/schemas/Id'
        itemId:
          $ref: '#/components/schemas/Id'
        photoSetHash:
          $ref: '#/components/schemas/Sha256'
        tier:
          $ref: '#/components/schemas/AnalysisTier'
        status:
          $ref: '#/components/schemas/AnalysisStatus'
        result:
          $ref: '#/components/schemas/AnalysisResult'
        failure:
          $ref: '#/components/schemas/AnalysisFailure'
        escalatedFromAnalysisId:
          $ref: '#/components/schemas/Id'
          description: For a `premium` analysis, the fast analysis it escalates.
        escalationAnalysisId:
          $ref: '#/components/schemas/Id'
          description: For a fast analysis, the premium analysis that escalates it, once started.
        createdAt:
          $ref: '#/components/schemas/Timestamp'
        completedAt:
          $ref: '#/components/schemas/Timestamp'
          description: When the analysis completed or failed.
    AnalysisApply:
      type: object
      required:
        - expectedVersion
      properties:
        expectedVersion:
          type: integer
          format: int64
          minimum: 1
          description: The item `version` the client last read (optimistic lock).
    ItemBatchItemState:
      description: |
        A `KnownItemBatchItemState`, or a state added after this client was built. Clients show
        an unknown state's `statusDisplay` as given and never treat it as saved.
      anyOf:
        - $ref: '#/components/schemas/KnownItemBatchItemState'
        - type: string
          maxLength: 64
    KnownItemBatchItemState:
      type: string
      description: |
        Where a batch item is: `uploading` (the app has not submitted it yet), `preparing_photos`
        (the server is processing its photos), `analyzing`, `ready_for_review` (analyzed, waiting
        for the seller), `saved` (the seller saved it; its status is no longer `draft`), or
        `failed` (see `problem`).
      enum:
        - uploading
        - preparing_photos
        - analyzing
        - ready_for_review
        - saved
        - failed
    ItemBatchItemProblem:
      type: object
      description: |
        Why a batch item stopped. `retryable` says whether submitting it again may help as it is.
      required:
        - code
        - message
        - retryable
      properties:
        code:
          type: string
          maxLength: 100
          description: |
            Stable snake_case, for example `photo_failed`, `photos_not_ready`, `no_photos`,
            `ai_budget_exceeded`, `quota_exceeded`, or an analysis failure's code.
        message:
          type: string
          maxLength: 1000
          description: Safe to show to the user.
        retryable:
          type: boolean
    InteractionTotals:
      type: object
      description: |
        The seller's interaction as the app measured it: time a screen of the flow was in front of
        them with nothing to wait for (`activeMs`), the time spent waiting on Listora meanwhile
        (`waitingMs`), and taps.
      required:
        - activeMs
        - waitingMs
        - taps
      properties:
        activeMs:
          type: integer
          format: int64
          minimum: 0
          maximum: 604800000
        waitingMs:
          type: integer
          format: int64
          minimum: 0
          maximum: 604800000
        taps:
          type: integer
          format: int32
          minimum: 0
          maximum: 1000000
    ItemBatchPhotoProgress:
      type: object
      description: How many of the item's photos the server has, and how many are processed.
      required:
        - total
        - ready
      properties:
        total:
          type: integer
          format: int32
          minimum: 0
        ready:
          type: integer
          format: int32
          minimum: 0
    ItemBatchItem:
      type: object
      required:
        - position
        - item
        - state
        - statusDisplay
        - photos
      properties:
        position:
          type: integer
          format: int32
          minimum: 0
          maximum: 999
          description: The item's place in the haul, 0 first.
        item:
          $ref: '#/components/schemas/ItemSummary'
        state:
          $ref: '#/components/schemas/ItemBatchItemState'
        statusDisplay:
          $ref: '#/components/schemas/StatusDisplay'
        photos:
          $ref: '#/components/schemas/ItemBatchPhotoProgress'
        problem:
          $ref: '#/components/schemas/ItemBatchItemProblem'
          description: Present exactly when `state` is `failed`.
        interaction:
          $ref: '#/components/schemas/InteractionTotals'
          description: This item's share of the batch's interaction, once the app reported it.
    ItemBatchProgress:
      type: object
      description: How many of the batch's items are in each state.
      required:
        - total
        - uploading
        - preparingPhotos
        - analyzing
        - readyForReview
        - saved
        - failed
      properties:
        total:
          type: integer
          format: int32
          minimum: 0
        uploading:
          type: integer
          format: int32
          minimum: 0
        preparingPhotos:
          type: integer
          format: int32
          minimum: 0
        analyzing:
          type: integer
          format: int32
          minimum: 0
        readyForReview:
          type: integer
          format: int32
          minimum: 0
        saved:
          type: integer
          format: int32
          minimum: 0
        failed:
          type: integer
          format: int32
          minimum: 0
    ItemBatch:
      type: object
      description: The items of one haul, photographed in one session, in haul order.
      required:
        - id
        - items
        - progress
        - createdAt
        - updatedAt
      properties:
        id:
          $ref: '#/components/schemas/Id'
        items:
          type: array
          maxItems: 1000
          items:
            $ref: '#/components/schemas/ItemBatchItem'
        progress:
          $ref: '#/components/schemas/ItemBatchProgress'
        interaction:
          $ref: '#/components/schemas/InteractionTotals'
          description: The batch's interaction from its first photo, once the app reported it.
        createdAt:
          $ref: '#/components/schemas/Timestamp'
        updatedAt:
          $ref: '#/components/schemas/Timestamp'
    ItemBatchItemCreate:
      type: object
      required:
        - position
      properties:
        position:
          type: integer
          format: int32
          minimum: 0
          maximum: 999
          description: The item's place in the haul, 0 first.
    ItemBatchItemSubmit:
      type: object
      required:
        - photoCount
      properties:
        photoCount:
          type: integer
          format: int32
          minimum: 1
          maximum: 24
          description: How many photos the app attached; the item must have exactly these many.
    ItemBatchItemInteraction:
      type: object
      required:
        - itemId
        - interaction
      properties:
        itemId:
          $ref: '#/components/schemas/Id'
        interaction:
          $ref: '#/components/schemas/InteractionTotals'
    ItemBatchInteractionReplace:
      type: object
      required:
        - batch
        - items
      properties:
        batch:
          $ref: '#/components/schemas/InteractionTotals'
        items:
          type: array
          maxItems: 1000
          items:
            $ref: '#/components/schemas/ItemBatchItemInteraction'
    AiPriceEstimate:
      type: object
      description: |
        A model's guess, not market data. `label` is always
        "AI estimate - not based on sold listings"; clients show it next to the numbers.
      required:
        - label
        - low
        - mid
        - high
        - confidence
      properties:
        label:
          type: string
          maxLength: 120
        low:
          $ref: '#/components/schemas/Money'
        mid:
          $ref: '#/components/schemas/Money'
        high:
          $ref: '#/components/schemas/Money'
        confidence:
          $ref: '#/components/schemas/Confidence'
    SoldDataSource:
      description: |
        A `KnownSoldDataSource`, or a source of real sold data added after this client was
        built. Clients show the comparables' `label` for an unknown source.
      anyOf:
        - $ref: '#/components/schemas/KnownSoldDataSource'
        - type: string
          maxLength: 64
    KnownSoldDataSource:
      type: string
      description: |
        Sources of real sold data. `ai_estimate` and `cost_floor` are deliberately not in this
        list: the words "comps" and "sold" are only ever shown next to real sold data.
      enum:
        - depop_inspiration
        - ebay_mi
        - own_history
    SoldComparables:
      type: object
      description: Real sold data. Absent from a suggestion when none is available.
      required:
        - source
        - label
        - sampleSize
        - low
        - median
        - high
        - fetchedAt
      properties:
        source:
          $ref: '#/components/schemas/SoldDataSource'
        marketplace:
          $ref: '#/components/schemas/Marketplace'
          description: Set when the data may be shown only in that marketplace's listing context.
        label:
          type: string
          maxLength: 120
          description: For example "Sold on Depop (last 90 days)".
        sampleSize:
          type: integer
          format: int32
          minimum: 1
        low:
          $ref: '#/components/schemas/Money'
        median:
          $ref: '#/components/schemas/Money'
        high:
          $ref: '#/components/schemas/Money'
        fetchedAt:
          $ref: '#/components/schemas/Timestamp'
    PriceTierName:
      type: string
      enum:
        - quick_sale
        - recommended
        - higher_profit
    PriceBasis:
      description: |
        A `KnownPriceBasis`, or a basis added after this client was built. Clients show the
        tier's `label` for an unknown basis and never present it as sold data.
      anyOf:
        - $ref: '#/components/schemas/KnownPriceBasis'
        - type: string
          maxLength: 64
    KnownPriceBasis:
      type: string
      description: What a suggested price is derived from.
      enum:
        - sold_data
        - ai_estimate
        - cost_floor
    PriceTier:
      type: object
      required:
        - tier
        - price
        - basis
        - label
      properties:
        tier:
          $ref: '#/components/schemas/PriceTierName'
        price:
          $ref: '#/components/schemas/Money'
        basis:
          $ref: '#/components/schemas/PriceBasis'
        label:
          type: string
          maxLength: 120
          description: For example "Recommended (AI estimate)".
    FloorBreakdown:
      type: object
      required:
        - cost
        - estimatedFees
        - shipping
        - minimumProfit
      properties:
        cost:
          $ref: '#/components/schemas/Money'
        estimatedFees:
          $ref: '#/components/schemas/Money'
        shipping:
          $ref: '#/components/schemas/Money'
        minimumProfit:
          $ref: '#/components/schemas/Money'
    MarketplaceFloor:
      type: object
      description: '"Don''t sell below": cost + estimated marketplace fees + shipping + the user''s minimum profit.'
      required:
        - marketplace
        - floorPrice
        - breakdown
        - feeTableVersion
      properties:
        marketplace:
          $ref: '#/components/schemas/Marketplace'
        floorPrice:
          $ref: '#/components/schemas/Money'
        breakdown:
          $ref: '#/components/schemas/FloorBreakdown'
        feeTableVersion:
          type: string
          maxLength: 64
          description: The versioned fee table the estimated fees come from.
        feeSource:
          $ref: '#/components/schemas/FeeEstimateSource'
    FeeEstimateSource:
      description: |
        A `KnownFeeEstimateSource`, or a source added after this client was built. Every
        source is an estimate.
      anyOf:
        - $ref: '#/components/schemas/KnownFeeEstimateSource'
        - type: string
          maxLength: 64
    KnownFeeEstimateSource:
      type: string
      description: |
        `fee_table` is the marketplace's published fee schedule. `actual_fees` is that schedule
        scaled to the fees the marketplace actually charged on the account's recent sales.
      enum:
        - fee_table
        - actual_fees
    ResearchLink:
      type: object
      description: A page the user opens in their own browser. Listora does not fetch or scrape it.
      required:
        - label
        - url
      properties:
        label:
          type: string
          maxLength: 120
        url:
          type: string
          format: uri
    PricingSuggestion:
      type: object
      required:
        - itemId
        - tiers
        - floors
        - researchLinks
        - generatedAt
      properties:
        itemId:
          $ref: '#/components/schemas/Id'
        soldComparables:
          type: array
          description: Absent or empty when there is no real sold data for this item.
          items:
            $ref: '#/components/schemas/SoldComparables'
        noSoldDataMessage:
          type: string
          maxLength: 120
          description: |
            "No sold data available for this item". Present exactly when there are no
            `soldComparables`; clients show it in place of sold data.
        aiEstimate:
          $ref: '#/components/schemas/AiPriceEstimate'
        tiers:
          type: array
          description: |
            Quick sale, recommended, and higher profit, in that order, each labeled with its
            basis. Never below the highest of `floors`. Empty when there is no estimate.
          items:
            $ref: '#/components/schemas/PriceTier'
        floors:
          type: array
          description: One per marketplace the item is or may be listed on. Empty when the item has no cost.
          items:
            $ref: '#/components/schemas/MarketplaceFloor'
        researchLinks:
          type: array
          items:
            $ref: '#/components/schemas/ResearchLink'
        generatedAt:
          $ref: '#/components/schemas/Timestamp'
    UsageMetric:
      description: |
        A `KnownUsageMetric`, or a quota added after this client was built. Clients show an
        unknown metric generically or not at all.
      anyOf:
        - $ref: '#/components/schemas/KnownUsageMetric'
        - type: string
          maxLength: 64
    KnownUsageMetric:
      type: string
      description: |
        Plan quotas in reseller units. `ai_items`: items analyzed (one per fast analysis).
        `premium_identifications`: premium analyses ("Identify harder").
      enum:
        - ai_items
        - premium_identifications
    QuotaUsage:
      type: object
      required:
        - metric
        - used
      properties:
        metric:
          $ref: '#/components/schemas/UsageMetric'
        used:
          type: integer
          format: int32
          minimum: 0
          description: Units used in the period.
        limit:
          type: integer
          format: int32
          minimum: 0
          description: The plan's limit for the period. Absent means unlimited.
    Usage:
      type: object
      required:
        - periodStart
        - periodEnd
        - quotas
      properties:
        periodStart:
          type: string
          format: date
          description: First day of the period (UTC).
        periodEnd:
          type: string
          format: date
          description: The day after the period's last day (UTC); quotas reset then.
        quotas:
          type: array
          description: One per `KnownUsageMetric`, in that order.
          items:
            $ref: '#/components/schemas/QuotaUsage'
    ListingStatus:
      description: |
        A `KnownListingStatus`, or a status added after this client was built. Clients show
        the listing's `statusDisplay` for an unknown status and never treat it as success.
      anyOf:
        - $ref: '#/components/schemas/KnownListingStatus'
        - type: string
          maxLength: 64
    KnownListingStatus:
      type: string
      description: |
        Lifecycle of one listing. `active` and `ended` are set only after verification
        (see `verification`); `unknown` means an outcome is being checked.
      enum:
        - draft
        - queued
        - publishing
        - active
        - ending
        - ended
        - sold
        - error
        - unknown
        - needs_user_action
    ListingAction:
      description: |
        A `KnownListingAction`, or an action added after this client was built. Clients hide
        actions they do not know.
      anyOf:
        - $ref: '#/components/schemas/KnownListingAction'
        - type: string
          maxLength: 64
    KnownListingAction:
      type: string
      enum:
        - publish
        - revise
        - change_price
        - end
        - relist
        - verify
    ListingActionAvailability:
      type: object
      description: An action the user can take now, and whether Listora or the user performs it.
      required:
        - action
        - mode
      properties:
        action:
          $ref: '#/components/schemas/ListingAction'
        mode:
          $ref: '#/components/schemas/IntegrationMode'
    ListingAspect:
      type: object
      description: 'A marketplace item specific, for example `{"name": "Sleeve Length", "values": ["Short Sleeve"]}`.'
      required:
        - name
        - values
      properties:
        name:
          type: string
          maxLength: 120
        values:
          type: array
          minItems: 1
          maxItems: 30
          items:
            type: string
            maxLength: 200
    ListingVariant:
      type: object
      description: The marketplace-specific version of the item.
      required:
        - title
        - description
        - price
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
          description: Marketplace limits (for example 80 characters on eBay) are checked at publish.
        description:
          type: string
          maxLength: 10000
        price:
          $ref: '#/components/schemas/Money'
        categoryRef:
          type: string
          maxLength: 64
          description: The marketplace's category id.
        condition:
          $ref: '#/components/schemas/ItemCondition'
        aspects:
          type: array
          maxItems: 60
          items:
            $ref: '#/components/schemas/ListingAspect'
        hashtags:
          type: array
          maxItems: 10
          items:
            type: string
            maxLength: 64
    ListingCreate:
      type: object
      required:
        - marketplace
        - variant
      properties:
        marketplace:
          $ref: '#/components/schemas/KnownMarketplace'
        variant:
          $ref: '#/components/schemas/ListingVariant'
    SharedListingUrl:
      type: string
      minLength: 1
      maxLength: 2048
      description: |
        A marketplace listing URL as the user shared it. Accepted: listing pages on
        `ebay.com` (`/itm/<item id>`), `poshmark.com` (`/listing/<title>-<id>`),
        `mercari.com` (`/us/item/<id>/`), and `depop.com` (`/products/<slug>/`), and the
        marketplaces' share short links (`ebay.us`, `posh.mk`, `merc.li`, `depop.app.link`).
        The server keeps the canonical form (https, no query or fragment) as the listing's
        `externalUrl`, and the listing id as `externalListingId`; a short link has no
        listing id, because only the marketplace can resolve it and Listora never fetches it.
    ListingLinkCreate:
      type: object
      required:
        - url
      properties:
        url:
          $ref: '#/components/schemas/SharedListingUrl'
    SharedListingImport:
      type: object
      required:
        - url
        - title
      properties:
        url:
          $ref: '#/components/schemas/SharedListingUrl'
        title:
          type: string
          minLength: 1
          maxLength: 200
          description: The new item's title, entered or confirmed by the user.
    SharedListingImportResult:
      type: object
      required:
        - item
        - listing
      properties:
        item:
          $ref: '#/components/schemas/Item'
        listing:
          $ref: '#/components/schemas/Listing'
    ListingVariantReplace:
      type: object
      required:
        - variant
      properties:
        variant:
          $ref: '#/components/schemas/ListingVariant'
    ListingPriceChange:
      type: object
      required:
        - price
      properties:
        price:
          $ref: '#/components/schemas/Money'
    ListingEndReason:
      type: string
      enum:
        - sold_elsewhere
        - not_available
        - other
    ListingEnd:
      type: object
      required:
        - reason
      properties:
        reason:
          $ref: '#/components/schemas/ListingEndReason'
    Listing:
      type: object
      description: |
        One item's listing on one marketplace. `variant` is Listora's version of the listing;
        it is absent for a listing the user linked from a share (`linkItemListing`), because
        Listora never read that listing's title or price.
      required:
        - id
        - itemId
        - marketplace
        - mode
        - status
        - statusDisplay
        - availableActions
        - createdAt
        - updatedAt
      properties:
        id:
          $ref: '#/components/schemas/Id'
        itemId:
          $ref: '#/components/schemas/Id'
        marketplace:
          $ref: '#/components/schemas/Marketplace'
        mode:
          $ref: '#/components/schemas/IntegrationMode'
        status:
          $ref: '#/components/schemas/ListingStatus'
        statusDisplay:
          $ref: '#/components/schemas/StatusDisplay'
        verification:
          $ref: '#/components/schemas/Verification'
        externalListingId:
          type: string
          maxLength: 128
        externalSku:
          type: string
          maxLength: 64
        externalUrl:
          type: string
          format: uri
        variant:
          $ref: '#/components/schemas/ListingVariant'
        latestOperation:
          $ref: '#/components/schemas/Operation'
        availableActions:
          type: array
          items:
            $ref: '#/components/schemas/ListingActionAvailability'
        listedAt:
          $ref: '#/components/schemas/Timestamp'
        endedAt:
          $ref: '#/components/schemas/Timestamp'
        lastVerifiedAt:
          $ref: '#/components/schemas/Timestamp'
        createdAt:
          $ref: '#/components/schemas/Timestamp'
        updatedAt:
          $ref: '#/components/schemas/Timestamp'
    ListingStatusSummary:
      type: object
      required:
        - listingId
        - marketplace
        - mode
        - status
        - statusDisplay
      properties:
        listingId:
          $ref: '#/components/schemas/Id'
        marketplace:
          $ref: '#/components/schemas/Marketplace'
        mode:
          $ref: '#/components/schemas/IntegrationMode'
        status:
          $ref: '#/components/schemas/ListingStatus'
        statusDisplay:
          $ref: '#/components/schemas/StatusDisplay'
    ListingList:
      type: object
      required:
        - data
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Listing'
    ListingPage:
      type: object
      required:
        - data
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Listing'
        nextCursor:
          type: string
          description: Present when there are more results.
    ListingOperationAccepted:
      type: object
      required:
        - listing
        - operation
      properties:
        listing:
          $ref: '#/components/schemas/Listing'
        operation:
          $ref: '#/components/schemas/Operation'
    OperationKind:
      description: |
        A `KnownOperationKind`, or a kind added after this client was built. Clients describe
        an unknown kind generically using the operation's `statusDisplay`.
      anyOf:
        - $ref: '#/components/schemas/KnownOperationKind'
        - type: string
          maxLength: 64
    KnownOperationKind:
      type: string
      enum:
        - create
        - revise
        - price
        - end
        - relist
        - mark_sold
        - verify
    OperationStatus:
      description: |
        A `KnownOperationStatus`, or a status added after this client was built. Clients show
        the operation's `statusDisplay` for an unknown status and never treat it as success.
      anyOf:
        - $ref: '#/components/schemas/KnownOperationStatus'
        - type: string
          maxLength: 64
    KnownOperationStatus:
      type: string
      description: |
        `succeeded` only after an API read-back confirms the desired state or the user
        confirms an assisted task. `verifying`: the outcome is unknown (for example a timeout
        after sending) and is being checked by read-back; the request is never re-sent
        blindly. `retrying`: a transient failure, retried with backoff.
      enum:
        - queued
        - running
        - retrying
        - verifying
        - succeeded
        - failed
        - needs_user_action
        - canceled
    OperationOriginType:
      description: |
        A `KnownOperationOriginType`, or an origin added after this client was built. Clients
        show an unknown origin generically.
      anyOf:
        - $ref: '#/components/schemas/KnownOperationOriginType'
        - type: string
          maxLength: 64
    KnownOperationOriginType:
      type: string
      enum:
        - user
        - auto_delist
        - reprice_rule
    OperationOrigin:
      type: object
      required:
        - type
      properties:
        type:
          $ref: '#/components/schemas/OperationOriginType'
        saleId:
          $ref: '#/components/schemas/Id'
          description: Set for `auto_delist`.
        repriceRuleId:
          $ref: '#/components/schemas/Id'
          description: Set for `reprice_rule`.
    OperationError:
      type: object
      required:
        - code
        - message
        - retryable
      properties:
        code:
          type: string
          maxLength: 64
          description: Listora's normalized error code, for example `marketplace_validation`.
        message:
          type: string
          maxLength: 1000
          description: User-readable reason.
        fixHint:
          type: string
          maxLength: 1000
          description: What the user can do about it.
        retryable:
          type: boolean
        marketplaceErrorCode:
          type: string
          maxLength: 64
          description: The marketplace's own error code, for support.
    Operation:
      type: object
      required:
        - id
        - listingId
        - itemId
        - marketplace
        - kind
        - status
        - statusDisplay
        - attempt
        - maxAttempts
        - origin
        - createdAt
        - updatedAt
      properties:
        id:
          $ref: '#/components/schemas/Id'
        listingId:
          $ref: '#/components/schemas/Id'
        itemId:
          $ref: '#/components/schemas/Id'
        marketplace:
          $ref: '#/components/schemas/Marketplace'
        kind:
          $ref: '#/components/schemas/OperationKind'
        status:
          $ref: '#/components/schemas/OperationStatus'
        statusDisplay:
          $ref: '#/components/schemas/StatusDisplay'
        attempt:
          type: integer
          format: int32
          minimum: 0
          description: Attempts made so far (shown as "retry 2 of 6").
        maxAttempts:
          type: integer
          format: int32
          minimum: 1
        nextAttemptAt:
          $ref: '#/components/schemas/Timestamp'
        origin:
          $ref: '#/components/schemas/OperationOrigin'
        error:
          $ref: '#/components/schemas/OperationError'
        verification:
          $ref: '#/components/schemas/Verification'
        userTaskId:
          $ref: '#/components/schemas/Id'
          description: The assisted task this operation waits for.
        retryOfOperationId:
          $ref: '#/components/schemas/Id'
        createdAt:
          $ref: '#/components/schemas/Timestamp'
        updatedAt:
          $ref: '#/components/schemas/Timestamp'
        completedAt:
          $ref: '#/components/schemas/Timestamp'
    OperationPage:
      type: object
      required:
        - data
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Operation'
        nextCursor:
          type: string
          description: Present when there are more results.
    OperationEvent:
      type: object
      description: One state transition. Append-only.
      required:
        - id
        - operationId
        - sequence
        - toStatus
        - attempt
        - occurredAt
      properties:
        id:
          $ref: '#/components/schemas/Id'
        operationId:
          $ref: '#/components/schemas/Id'
        sequence:
          type: integer
          format: int64
          minimum: 1
        fromStatus:
          $ref: '#/components/schemas/OperationStatus'
          description: Absent for the first event.
        toStatus:
          $ref: '#/components/schemas/OperationStatus'
        attempt:
          type: integer
          format: int32
          minimum: 0
        message:
          type: string
          maxLength: 1000
          description: User-readable summary, for example "eBay confirmed the new price".
        error:
          $ref: '#/components/schemas/OperationError'
        detail:
          type: object
          description: Redacted request/response excerpt for support views. Never contains tokens.
          additionalProperties: true
        occurredAt:
          $ref: '#/components/schemas/Timestamp'
    OperationEventPage:
      type: object
      required:
        - data
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/OperationEvent'
        nextCursor:
          type: string
          description: Present when there are more results.
    ConnectionStatus:
      description: |
        A `KnownConnectionStatus`, or a status added after this client was built. Clients
        show the connection's `statusDisplay` for an unknown status.
      anyOf:
        - $ref: '#/components/schemas/KnownConnectionStatus'
        - type: string
          maxLength: 64
    KnownConnectionStatus:
      type: string
      description: |
        State of the API connection. Assisted marketplaces (`mode: assisted`) have no account
        connection and report `not_connected`; their `statusDisplay` says so.
      enum:
        - not_connected
        - connected
        - degraded
        - reauth_required
        - revoked
    CapabilityMode:
      description: |
        A `KnownCapabilityMode`, or a mode added after this client was built. Clients treat
        an unknown mode like `none` (the capability is not offered).
      anyOf:
        - $ref: '#/components/schemas/KnownCapabilityMode'
        - type: string
          maxLength: 64
    KnownCapabilityMode:
      type: string
      description: |
        `api`: through the marketplace's API. `automation`: by Listora's browser runner in the
        seller's session. `assisted`: by the user. `bulk_file`: by a file the seller uploads.
        `none`: not offered.
      enum:
        - api
        - automation
        - assisted
        - bulk_file
        - none
    MarkSoldMode:
      description: |
        A `KnownMarkSoldMode`, or a mode added after this client was built. Clients treat an
        unknown mode like `none`.
      anyOf:
        - $ref: '#/components/schemas/KnownMarkSoldMode'
        - type: string
          maxLength: 64
    KnownMarkSoldMode:
      type: string
      enum:
        - api
        - automation
        - assisted
        - bulk_file
        - none
        - not_needed
    ConnectMethod:
      description: |
        A `KnownConnectMethod`, or a method added after this client was built. Clients treat
        an unknown method like `none` (no connect button).
      anyOf:
        - $ref: '#/components/schemas/KnownConnectMethod'
        - type: string
          maxLength: 64
    KnownConnectMethod:
      type: string
      description: |
        `oauth`: the seller authorizes Listora on the marketplace. `session`: the seller logs into
        the marketplace in the app, and Listora keeps the session's cookies (never the password)
        for its browser runner. `none`: nothing to connect.
      enum:
        - oauth
        - session
        - none
    VerifyReadMode:
      description: |
        A `KnownVerifyReadMode`, or a mode added after this client was built. Clients offer no
        "check again" action for an unknown mode.
      anyOf:
        - $ref: '#/components/schemas/KnownVerifyReadMode'
        - type: string
          maxLength: 64
    KnownVerifyReadMode:
      type: string
      description: |
        How success is established: a read-back through the API, a read-back through the
        automated browser session, or the user's confirmation.
      enum:
        - api
        - automation
        - user_confirm
    ImportListingsMode:
      description: |
        A `KnownImportListingsMode`, or a mode added after this client was built. Clients
        treat an unknown mode like `none`.
      anyOf:
        - $ref: '#/components/schemas/KnownImportListingsMode'
        - type: string
          maxLength: 64
    KnownImportListingsMode:
      type: string
      enum:
        - api
        - share_sheet
        - bulk_file
        - none
    ImageTransportMode:
      description: |
        A `KnownImageTransportMode`, or a mode added after this client was built. Clients
        treat an unknown mode like `user_saves_photos`.
      anyOf:
        - $ref: '#/components/schemas/KnownImageTransportMode'
        - type: string
          maxLength: 64
    KnownImageTransportMode:
      type: string
      enum:
        - url_fetch
        - upload
        - user_saves_photos
    MarketplaceCapabilities:
      type: object
      description: |
        What Listora can do on this marketplace for this account. Clients branch on these
        flags, never on the marketplace name; they can change when access is granted.
      required:
        - connect
        - create
        - updatePrice
        - updateDetails
        - delist
        - relist
        - markSold
        - verifyRead
        - importListings
        - saleDetection
        - imageTransport
      properties:
        connect:
          $ref: '#/components/schemas/ConnectMethod'
        create:
          $ref: '#/components/schemas/CapabilityMode'
        updatePrice:
          $ref: '#/components/schemas/CapabilityMode'
        updateDetails:
          $ref: '#/components/schemas/CapabilityMode'
        delist:
          $ref: '#/components/schemas/CapabilityMode'
        relist:
          $ref: '#/components/schemas/CapabilityMode'
        markSold:
          $ref: '#/components/schemas/MarkSoldMode'
        verifyRead:
          $ref: '#/components/schemas/VerifyReadMode'
        importListings:
          $ref: '#/components/schemas/ImportListingsMode'
        saleDetection:
          type: array
          items:
            $ref: '#/components/schemas/SaleDetectionSource'
        imageTransport:
          $ref: '#/components/schemas/ImageTransportMode'
    ConnectionIssue:
      type: object
      required:
        - code
        - message
        - occurredAt
      properties:
        code:
          type: string
          maxLength: 64
        message:
          type: string
          maxLength: 1000
        occurredAt:
          $ref: '#/components/schemas/Timestamp'
    ConnectionAction:
      description: |
        A `KnownConnectionAction`, or an action added after this client was built. Clients hide
        actions they do not know.
      anyOf:
        - $ref: '#/components/schemas/KnownConnectionAction'
        - type: string
          maxLength: 64
    KnownConnectionAction:
      type: string
      description: |
        `connect`: start `startConnectionAuthorization` for a marketplace not connected yet.
        `reconnect`: the same, for a connection that needs the seller's consent again (its grant
        was revoked, expires within 30 days, or fails); it renews the existing connection.
        `check`: `requestConnectionCheck` (Retry check), for a connection with a problem
        Listora may have cleared since.
      enum:
        - connect
        - reconnect
        - check
    Connection:
      type: object
      required:
        - marketplace
        - mode
        - status
        - statusDisplay
        - capabilities
        - availableActions
      properties:
        marketplace:
          $ref: '#/components/schemas/Marketplace'
        mode:
          $ref: '#/components/schemas/IntegrationMode'
        status:
          $ref: '#/components/schemas/ConnectionStatus'
        statusDisplay:
          $ref: '#/components/schemas/StatusDisplay'
        capabilities:
          $ref: '#/components/schemas/MarketplaceCapabilities'
        availableActions:
          type: array
          maxItems: 10
          description: What the user can do about the connection now; empty when nothing.
          items:
            $ref: '#/components/schemas/ConnectionAction'
        displayName:
          type: string
          maxLength: 200
          description: The seller's name on the marketplace.
        connectedAt:
          $ref: '#/components/schemas/Timestamp'
        grantExpiresAt:
          $ref: '#/components/schemas/Timestamp'
          description: When the user must reconnect (Depop grants last one year; eBay refresh tokens about 18 months).
        lastOkAt:
          $ref: '#/components/schemas/Timestamp'
          description: When the marketplace last accepted Listora's access (the last successful check).
        lastCheckedAt:
          $ref: '#/components/schemas/Timestamp'
          description: When Listora last checked the connection, whatever it found.
        lastIssue:
          $ref: '#/components/schemas/ConnectionIssue'
    ConnectionList:
      type: object
      required:
        - data
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Connection'
    ConnectionAuthorizationStatus:
      type: string
      enum:
        - pending
        - completed
        - failed
        - expired
    ConnectionAuthorization:
      type: object
      required:
        - id
        - marketplace
        - status
        - callbackUrlScheme
        - expiresAt
        - createdAt
      properties:
        id:
          $ref: '#/components/schemas/Id'
        marketplace:
          $ref: '#/components/schemas/Marketplace'
        status:
          $ref: '#/components/schemas/ConnectionAuthorizationStatus'
        authorizationUrl:
          type: string
          format: uri
          description: |
            The marketplace's own consent page. Only in the `startConnectionAuthorization`
            response (and its replays): it carries the attempt's single-use `state`, which
            Listora keeps only as a hash.
        callbackUrlScheme:
          type: string
          maxLength: 32
          description: The URL scheme `ASWebAuthenticationSession` waits for (`listora`).
        expiresAt:
          $ref: '#/components/schemas/Timestamp'
        failure:
          $ref: '#/components/schemas/ApiError'
          description: Present when `status` is `failed`.
        connection:
          $ref: '#/components/schemas/Connection'
          description: Present when `status` is `completed`.
        createdAt:
          $ref: '#/components/schemas/Timestamp'
        completedAt:
          $ref: '#/components/schemas/Timestamp'
    ConnectionAttentionReason:
      description: |
        A `KnownConnectionAttentionReason`, or a reason added after this client was built.
        Clients show the entry's `statusDisplay` for an unknown reason.
      anyOf:
        - $ref: '#/components/schemas/KnownConnectionAttentionReason'
        - type: string
          maxLength: 64
    KnownConnectionAttentionReason:
      type: string
      description: |
        `reconnect`: the marketplace no longer accepts Listora's access (`reauth_required`).
        `access_removed`: the access was revoked (`revoked`). `connection_problem`: Listora
        cannot reach the marketplace now and keeps checking (`degraded`). `expiring`: the grant
        ends within 30 days.
      enum:
        - reconnect
        - access_removed
        - connection_problem
        - expiring
    ConnectionAttention:
      type: object
      description: One connection that needs the seller's attention.
      required:
        - marketplace
        - reason
        - statusDisplay
      properties:
        marketplace:
          $ref: '#/components/schemas/Marketplace'
        reason:
          $ref: '#/components/schemas/ConnectionAttentionReason'
        statusDisplay:
          $ref: '#/components/schemas/StatusDisplay'
          description: The connection's own status, as in `Connection.statusDisplay`.
    SaleForwardingStatus:
      description: |
        A `KnownSaleForwardingStatus`, or a status added after this client was built. Clients
        show the `statusDisplay`.
      anyOf:
        - $ref: '#/components/schemas/KnownSaleForwardingStatus'
        - type: string
          maxLength: 64
    KnownSaleForwardingStatus:
      type: string
      description: |
        `needs_domain`: forwarding marketplace sale emails to Listora needs Listora's inbound
        email domain, which this deployment does not have yet.
      enum:
        - needs_domain
    SaleForwarding:
      type: object
      description: Forwarding marketplace sale emails to Listora, which detects sales sooner.
      required:
        - status
        - statusDisplay
      properties:
        status:
          $ref: '#/components/schemas/SaleForwardingStatus'
        statusDisplay:
          $ref: '#/components/schemas/StatusDisplay'
    ConnectionHealthSummary:
      type: object
      required:
        - needsAttention
        - attention
        - connections
        - saleForwarding
      properties:
        needsAttention:
          type: boolean
          description: True while any connection is in `attention`; the app shows `banner` then.
        banner:
          $ref: '#/components/schemas/StatusDisplay'
          description: Present exactly when `needsAttention`.
        attention:
          type: array
          maxItems: 20
          description: The connections that need attention, those only the seller can fix first.
          items:
            $ref: '#/components/schemas/ConnectionAttention'
        connections:
          type: array
          description: Every marketplace and its connection, as `listConnections` returns them.
          items:
            $ref: '#/components/schemas/Connection'
        saleForwarding:
          $ref: '#/components/schemas/SaleForwarding'
        lastCheckedAt:
          $ref: '#/components/schemas/Timestamp'
          description: The latest check of any connection; absent before the first.
    MarketplaceSessionStatus:
      description: |
        A `KnownMarketplaceSessionStatus`, or a status added after this client was built.
        Clients show `statusDisplay` for an unknown status and offer to link again.
      anyOf:
        - $ref: '#/components/schemas/KnownMarketplaceSessionStatus'
        - type: string
          maxLength: 64
    KnownMarketplaceSessionStatus:
      type: string
      description: |
        `not_linked`: no session. `checking`: a session was just linked and the browser runner
        is checking it. `linked`: the check passed, and Listora automates the marketplace in
        that session. `needs_relink`: the marketplace rejected the session, or showed a check
        automation must not pass; the user signs in again. `check_failed`: Listora could not
        confirm the session works (see `issue`); linking again checks again. `api_connected`:
        the marketplace is connected through its API, so there is nothing to sign in to.
      enum:
        - not_linked
        - checking
        - linked
        - needs_relink
        - check_failed
        - api_connected
    MarketplaceSessionLogin:
      type: object
      description: Where the app signs the user in, and which of that site's cookies it hands over.
      required:
        - url
        - cookieDomains
      properties:
        url:
          type: string
          format: uri
          maxLength: 2048
          description: The marketplace's own sign-in page.
        cookieDomains:
          type: array
          description: |
            The marketplace's own domains (`poshmark.com`). The app sends only cookies whose
            domain is one of these or a subdomain of one; the server refuses any other.
          minItems: 1
          maxItems: 10
          items:
            type: string
            maxLength: 253
    MarketplaceSession:
      type: object
      description: |
        A marketplace linked by signing in (`connect: session`). It is shown as linked only
        after the browser runner confirmed the marketplace accepts the session.
      required:
        - marketplace
        - status
        - statusDisplay
        - login
      properties:
        marketplace:
          $ref: '#/components/schemas/Marketplace'
        status:
          $ref: '#/components/schemas/MarketplaceSessionStatus'
        statusDisplay:
          $ref: '#/components/schemas/StatusDisplay'
        login:
          $ref: '#/components/schemas/MarketplaceSessionLogin'
        displayName:
          type: string
          maxLength: 200
          description: The seller's name on the marketplace, when the app or the check knows it.
        linkedAt:
          $ref: '#/components/schemas/Timestamp'
          description: When the current session was linked.
        checkedAt:
          $ref: '#/components/schemas/Timestamp'
          description: When the current session's check finished.
        issue:
          $ref: '#/components/schemas/ConnectionIssue'
          description: Why the session needs relinking, or why its check failed.
    MarketplaceSessionList:
      type: object
      required:
        - data
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/MarketplaceSession'
    SessionCookie:
      type: object
      description: |
        One cookie as the app's web view holds it (`HTTPCookie`), in the browser runner's
        terms. A name plus value of at most 4096 bytes, as browsers allow.
      additionalProperties: false
      required:
        - name
        - value
        - domain
        - path
        - expires
        - httpOnly
        - secure
        - sameSite
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 4096
        value:
          type: string
          maxLength: 4096
        domain:
          type: string
          description: A host (`www.poshmark.com`) or a domain cookie (`.poshmark.com`).
          minLength: 1
          maxLength: 253
          pattern: ^\.?[A-Za-z0-9.-]+$
        path:
          type: string
          minLength: 1
          maxLength: 1024
          pattern: ^/
        expires:
          type: integer
          format: int64
          description: Unix time in whole seconds; `-1` for a cookie that lasts as long as the browser session.
          minimum: -1
        httpOnly:
          type: boolean
        secure:
          type: boolean
        sameSite:
          type: string
          description: '`lax` when the site set none.'
          enum:
            - strict
            - lax
            - none
    MarketplaceSessionLink:
      type: object
      additionalProperties: false
      required:
        - cookies
      properties:
        cookies:
          type: array
          description: The marketplace's cookies after the user signed in, and no other site's.
          minItems: 1
          maxItems: 200
          items:
            $ref: '#/components/schemas/SessionCookie'
        displayName:
          type: string
          minLength: 1
          maxLength: 200
          description: The seller's name on the marketplace, when the app knows it.
    SaleStatus:
      description: |
        A `KnownSaleStatus`, or a status added after this client was built. Clients show an
        unknown status generically.
      anyOf:
        - $ref: '#/components/schemas/KnownSaleStatus'
        - type: string
          maxLength: 64
    KnownSaleStatus:
      type: string
      description: |
        `detected`: Listora recorded the sale (from the marketplace, or "Mark sold").
        `confirmed`: the seller confirmed it. `shipped`: the seller shipped it. `canceled` and
        `returned`: the sale no longer stands; Listora asks whether to relist (`SaleItem.relist`).
      enum:
        - detected
        - confirmed
        - shipped
        - canceled
        - returned
    SaleDetectionSource:
      description: |
        A `KnownSaleDetectionSource`, or a source added after this client was built. Clients
        show an unknown source generically.
      anyOf:
        - $ref: '#/components/schemas/KnownSaleDetectionSource'
        - type: string
          maxLength: 64
    KnownSaleDetectionSource:
      type: string
      enum:
        - webhook
        - poll
        - email
        - manual
    DelistRunStatus:
      type: string
      description: |
        `completed`: every other listing is delisted (confirmed by the marketplace's read-back)
        or done (the user confirmed). `needs_attention`: a delist failed, waits for the user, or
        was canceled. `in_progress`: Listora is still delisting or checking.
      enum:
        - in_progress
        - completed
        - needs_attention
    DelistResultState:
      description: |
        A `KnownDelistResultState`, or a state added after this client was built. Clients
        show the result's `statusDisplay` for an unknown state and never treat it as delisted.
      anyOf:
        - $ref: '#/components/schemas/KnownDelistResultState'
        - type: string
          maxLength: 64
    KnownDelistResultState:
      type: string
      description: |
        `delisted`: a read-back of the marketplace confirmed it. `user_confirmed`: the user
        confirmed an assisted delist. Only these two count as done. `pending`: delisting or
        waiting to retry. `verifying`: the outcome is unknown and is being read back.
        `needs_user_action`: the user has to delist it in the marketplace's app. `failed`: shows
        the reason and a Retry. `canceled`: Listora stopped delisting it (the listing may still
        be live).
      enum:
        - pending
        - verifying
        - delisted
        - user_confirmed
        - needs_user_action
        - failed
        - canceled
    DelistResult:
      type: object
      description: One listing of the sold item on another marketplace, and its delist.
      required:
        - listingId
        - marketplace
        - mode
        - state
        - statusDisplay
        - operationId
        - attempt
        - maxAttempts
        - updatedAt
      properties:
        listingId:
          $ref: '#/components/schemas/Id'
        marketplace:
          $ref: '#/components/schemas/Marketplace'
        mode:
          $ref: '#/components/schemas/IntegrationMode'
        state:
          $ref: '#/components/schemas/DelistResultState'
        statusDisplay:
          $ref: '#/components/schemas/StatusDisplay'
          description: For example `Delisted (confirmed by eBay)`, `Delisting... retry 2 of 6`, or `Done (you confirmed)`.
        operationId:
          $ref: '#/components/schemas/Id'
          description: The delist operation; Retry a `failed` one with `retryOperation`.
        attempt:
          type: integer
          format: int32
          minimum: 0
          description: Attempts made so far (shown as "retry 2 of 6").
        maxAttempts:
          type: integer
          format: int32
          minimum: 1
        userTaskId:
          $ref: '#/components/schemas/Id'
          description: The assisted delist's task, which the user completes once they delisted it.
        updatedAt:
          $ref: '#/components/schemas/Timestamp'
    DelistRun:
      type: object
      description: |
        The automatic delist of one sold item's other listings after a sale (a bundle starts one
        run per item). `results` has one entry per listing on another marketplace that may have
        been live; a listing that was already ended, sold, or never published needs none.
      required:
        - id
        - saleId
        - itemId
        - soldOn
        - status
        - statusDisplay
        - results
        - escalated
        - startedAt
      properties:
        id:
          $ref: '#/components/schemas/Id'
        saleId:
          $ref: '#/components/schemas/Id'
        itemId:
          $ref: '#/components/schemas/Id'
        soldOn:
          $ref: '#/components/schemas/Marketplace'
          description: The marketplace the item sold on.
        status:
          $ref: '#/components/schemas/DelistRunStatus'
        statusDisplay:
          $ref: '#/components/schemas/StatusDisplay'
          description: The run in one line, for example `Delisted everywhere` or `Action needed - delist on Poshmark`.
        results:
          type: array
          items:
            $ref: '#/components/schemas/DelistResult'
        escalated:
          type: boolean
          description: |
            True while the run is not completed 30 minutes after the sale. The app shows a
            banner on the home screen until it completes.
        startedAt:
          $ref: '#/components/schemas/Timestamp'
        realertedAt:
          $ref: '#/components/schemas/Timestamp'
          description: When the user was alerted again because a listing was still not delisted or confirmed 10 minutes after the sale.
        escalatedAt:
          $ref: '#/components/schemas/Timestamp'
          description: When the alert escalated, 30 minutes after the sale.
        completedAt:
          $ref: '#/components/schemas/Timestamp'
    DoubleSale:
      type: object
      description: |
        A double sale: an item that had already sold sold again in this order. Listora cannot
        cancel an order, so the user cancels one of them on its marketplace (`steps`, starting at
        `cancelUrl`) and then completes the task (`taskId`).
      required:
        - taskId
        - saleId
        - itemId
        - marketplace
        - earlierSaleId
        - earlierMarketplace
        - title
        - steps
        - cancelUrl
        - status
        - createdAt
      properties:
        taskId:
          $ref: '#/components/schemas/Id'
        saleId:
          $ref: '#/components/schemas/Id'
          description: The later sale, whose order the steps cancel.
        itemId:
          $ref: '#/components/schemas/Id'
        marketplace:
          $ref: '#/components/schemas/Marketplace'
          description: The later sale's marketplace.
        earlierSaleId:
          $ref: '#/components/schemas/Id'
        earlierMarketplace:
          $ref: '#/components/schemas/Marketplace'
        title:
          type: string
          maxLength: 200
          description: For example "Cancel the order on Depop".
        steps:
          type: array
          items:
            type: string
            maxLength: 500
        cancelUrl:
          type: string
          format: uri
          description: Where the marketplace shows the seller's orders.
        status:
          $ref: '#/components/schemas/UserTaskStatus'
        createdAt:
          $ref: '#/components/schemas/Timestamp'
        resolvedAt:
          $ref: '#/components/schemas/Timestamp'
    SaleItem:
      type: object
      description: |
        One item of an order. For a bundle, the order's shipping, order-level fees, and
        shipping cost are split across its items in proportion to each item's `salePrice`.
      required:
        - itemId
        - sku
        - salePrice
      properties:
        itemId:
          $ref: '#/components/schemas/Id'
        sku:
          type: string
          maxLength: 32
        title:
          type: string
          maxLength: 200
        listingId:
          $ref: '#/components/schemas/Id'
          description: The listing the item sold through, when known. Absent for a sale recorded without one.
        salePrice:
          $ref: '#/components/schemas/Money'
          description: This item's part of the order's sale price (for a bundle, its share of the bundle price).
        cost:
          $ref: '#/components/schemas/Money'
          description: What the item cost the seller. Absent when they never entered it.
        fees:
          $ref: '#/components/schemas/Money'
          description: This item's share of the sale's fees. Absent until the sale has fee lines.
        netProceeds:
          $ref: '#/components/schemas/Money'
          description: This item's share of the payout.
        profit:
          $ref: '#/components/schemas/Money'
          description: This item's share of the payout minus its share of `shippingCost` minus its `cost`.
        roiBasisPoints:
          type: integer
          format: int64
          description: '`profit` over `cost` in basis points (12550 is 125.5%). Absent without a profit or for a zero cost.'
        relist:
          $ref: '#/components/schemas/SaleRelist'
    SaleCreateItem:
      type: object
      description: One item of a sale recorded by hand.
      required:
        - itemId
        - salePrice
      properties:
        itemId:
          $ref: '#/components/schemas/Id'
        listingId:
          $ref: '#/components/schemas/Id'
          description: The item's listing on the sale's marketplace; defaults to its newest one there.
        salePrice:
          $ref: '#/components/schemas/Money'
          description: What this item sold for, before shipping.
    SaleAction:
      description: |
        A `KnownSaleAction`, or an action added after this client was built. Clients hide
        actions they do not know.
      anyOf:
        - $ref: '#/components/schemas/KnownSaleAction'
        - type: string
          maxLength: 64
    KnownSaleAction:
      type: string
      description: |
        `confirm` (`confirmSale`), `mark_shipped` (`markSaleShipped`), `cancel` (`cancelSale`),
        `record_return` (`recordSaleReturn`).
      enum:
        - confirm
        - mark_shipped
        - cancel
        - record_return
    RelistDecision:
      description: |
        A `KnownRelistDecision`, or a decision added after this client was built.
      anyOf:
        - $ref: '#/components/schemas/KnownRelistDecision'
        - type: string
          maxLength: 64
    KnownRelistDecision:
      type: string
      description: |
        `pending`: the sale was canceled or returned and the seller has not decided yet whether
        to relist the item. `relisted`: the seller chose marketplaces to relist on (each relist
        is an operation; see the item's listings). `declined`: the seller chose not to relist.
      enum:
        - pending
        - relisted
        - declined
    RelistOption:
      type: object
      description: One of the item's listings, and whether Listora can relist it now.
      required:
        - listingId
        - marketplace
        - mode
        - statusDisplay
        - canRelist
      properties:
        listingId:
          $ref: '#/components/schemas/Id'
        marketplace:
          $ref: '#/components/schemas/Marketplace'
        mode:
          $ref: '#/components/schemas/IntegrationMode'
          description: '`api`: Listora relists it. `assisted`: the user relists it in the marketplace''s app.'
        statusDisplay:
          $ref: '#/components/schemas/StatusDisplay'
          description: The listing's status now, for example `Delisted (confirmed by eBay)` or `Active (confirmed by Depop)`.
        canRelist:
          type: boolean
          description: |
            False while the listing is still live or a change on it is still running; the
            seller can relist it from the item later.
    SaleRelist:
      type: object
      description: |
        Present once the sale was canceled or returned and the item has no other sale that
        stands. Listora never relists by itself: it asks, and relists only where the user
        chooses (`decideSaleRelist`).
      required:
        - decision
        - options
      properties:
        decision:
          $ref: '#/components/schemas/RelistDecision'
        options:
          type: array
          description: The item's newest listing on each marketplace.
          items:
            $ref: '#/components/schemas/RelistOption'
        decidedAt:
          $ref: '#/components/schemas/Timestamp'
    SaleShipment:
      type: object
      properties:
        shippingCost:
          $ref: '#/components/schemas/Money'
          description: What the seller paid for the label outside the payout, when known.
    SaleRelistChoice:
      type: object
      required:
        - items
      properties:
        items:
          type: array
          description: One entry per item to decide for.
          minItems: 1
          maxItems: 100
          items:
            $ref: '#/components/schemas/SaleRelistItemChoice'
    SaleRelistItemChoice:
      type: object
      description: One item's answer; an empty `listingIds` means "don't relist".
      required:
        - itemId
        - listingIds
      properties:
        itemId:
          $ref: '#/components/schemas/Id'
        listingIds:
          type: array
          description: The listings to relist, from the item's `relist.options` with `canRelist`.
          maxItems: 10
          items:
            $ref: '#/components/schemas/Id'
    KnownFeeType:
      type: string
      enum:
        - marketplace
        - payment
        - shipping_label
        - promotion
        - tax
        - other
    FeeType:
      description: |
        A `KnownFeeType`, or a type added after this client was built. Clients show an unknown
        type like `other`.
      anyOf:
        - $ref: '#/components/schemas/KnownFeeType'
        - type: string
          maxLength: 64
    FeeSource:
      type: string
      description: '`actual`: reported by the marketplace. `estimated`: from Listora''s fee table until the marketplace reports the actual fee.'
      enum:
        - actual
        - estimated
    FeeLine:
      type: object
      description: One fee deducted from the sale.
      required:
        - type
        - amount
        - source
      properties:
        type:
          $ref: '#/components/schemas/FeeType'
        amount:
          $ref: '#/components/schemas/Money'
          description: A positive amount the seller pays.
        source:
          $ref: '#/components/schemas/FeeSource'
        description:
          type: string
          maxLength: 200
          description: What the marketplace or Listora's fee table calls it, for example "Final value fee".
        feeTableVersion:
          type: string
          maxLength: 100
          description: For an estimated fee, the fee table it was computed with (for example `ebay-us-2026-10-24`).
    SaleCreate:
      type: object
      required:
        - marketplace
        - items
      properties:
        marketplace:
          $ref: '#/components/schemas/KnownMarketplace'
        items:
          type: array
          description: The items of the order, each at most once; more than one for a bundle.
          minItems: 1
          maxItems: 100
          items:
            $ref: '#/components/schemas/SaleCreateItem'
        shippingCharged:
          $ref: '#/components/schemas/Money'
        soldAt:
          $ref: '#/components/schemas/Timestamp'
          description: Defaults to now.
        externalOrderId:
          type: string
          maxLength: 128
    Sale:
      type: object
      description: |
        One marketplace order. It has one or more items (a bundle has several). Money values
        that depend on fees are absent until they are known.
      required:
        - id
        - marketplace
        - items
        - soldAt
        - salePrice
        - detectionSource
        - status
        - availableActions
        - isDoubleSale
        - delistRuns
        - doubleSales
        - createdAt
        - updatedAt
      properties:
        id:
          $ref: '#/components/schemas/Id'
        marketplace:
          $ref: '#/components/schemas/Marketplace'
        externalOrderId:
          type: string
          maxLength: 128
        items:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/SaleItem'
        soldAt:
          $ref: '#/components/schemas/Timestamp'
        salePrice:
          $ref: '#/components/schemas/Money'
          description: The order's sale price before fees, the sum of `items[].salePrice`.
        shippingCharged:
          $ref: '#/components/schemas/Money'
          description: What the buyer paid for shipping.
        fees:
          type: array
          description: |
            Every fee deducted from the payout. Estimated from Listora's fee table when the sale
            is recorded, and replaced by the marketplace's actual fees once it reports them.
            Absent for a sale without fee lines.
          items:
            $ref: '#/components/schemas/FeeLine'
        feesEstimated:
          type: boolean
          description: True while any fee is an estimate; `netProceeds` and `profit` are estimates then too.
        shippingCost:
          $ref: '#/components/schemas/Money'
          description: |
            What the seller paid to ship outside the payout, for example a label bought
            separately. A label the marketplace deducts is a `shipping_label` fee instead.
        netProceeds:
          $ref: '#/components/schemas/Money'
          description: The payout, `salePrice` plus `shippingCharged` minus `fees`. Absent until the fees are known.
        profit:
          $ref: '#/components/schemas/Money'
          description: |
            `netProceeds` minus `shippingCost` minus the items' `cost`. Absent until
            `netProceeds` is known and every item has a cost.
        cost:
          $ref: '#/components/schemas/Money'
          description: The items' total cost. Absent when an item has none.
        roiBasisPoints:
          type: integer
          format: int64
          description: '`profit` over `cost` in basis points. Absent without a profit or for a zero cost.'
        detectionSource:
          $ref: '#/components/schemas/SaleDetectionSource'
        status:
          $ref: '#/components/schemas/SaleStatus'
        shipBy:
          $ref: '#/components/schemas/Timestamp'
        availableActions:
          type: array
          description: What the seller can do with the sale now, in display order.
          items:
            $ref: '#/components/schemas/SaleAction'
        confirmedAt:
          $ref: '#/components/schemas/Timestamp'
        shippedAt:
          $ref: '#/components/schemas/Timestamp'
        canceledAt:
          $ref: '#/components/schemas/Timestamp'
        returnedAt:
          $ref: '#/components/schemas/Timestamp'
        isDoubleSale:
          type: boolean
          description: True when an item of the order had already sold; the user must cancel one sale (`doubleSales`).
        delistRuns:
          type: array
          description: One per item of the order that this sale started a delist for; none for an item that had already sold.
          items:
            $ref: '#/components/schemas/DelistRun'
        doubleSales:
          type: array
          description: One per item of the order that had already sold.
          items:
            $ref: '#/components/schemas/DoubleSale'
        createdAt:
          $ref: '#/components/schemas/Timestamp'
        updatedAt:
          $ref: '#/components/schemas/Timestamp'
    SalePage:
      type: object
      required:
        - data
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Sale'
        nextCursor:
          type: string
          description: Present when there are more results.
    ProfitGranularity:
      description: |
        A `KnownProfitGranularity`, or a bucket size added after this client was built. Clients
        label an unknown granularity's buckets by their `start` date.
      anyOf:
        - $ref: '#/components/schemas/KnownProfitGranularity'
        - type: string
          maxLength: 64
    KnownProfitGranularity:
      type: string
      description: |
        The size of each `series` bucket, chosen by the server from the period's length: `day` up
        to 31 days, `week` (Monday to Sunday) up to 184 days, `month` beyond.
      enum:
        - day
        - week
        - month
    ProfitPeriod:
      type: object
      description: The period the report covers, in the seller's time zone.
      required:
        - from
        - to
        - timeZone
        - granularity
      properties:
        from:
          type: string
          format: date
          description: The period's first day.
        to:
          type: string
          format: date
          description: The period's last day (inclusive).
        timeZone:
          type: string
          maxLength: 64
          description: The IANA time zone the days are counted in, for example `America/New_York`.
        granularity:
          $ref: '#/components/schemas/ProfitGranularity'
    ProfitSummary:
      type: object
      description: |
        The period's totals over its sales that stand (detected, confirmed, or shipped; a canceled
        or returned sale counts nowhere). `netProfit` is `revenue` minus `fees`, `shipping`, and
        `costOfGoods`, so the lines always add up. An item sold without a cost counts as zero cost
        (`missingCostCount` says how many, and the profit is overstated by their cost).
      required:
        - revenue
        - fees
        - shipping
        - costOfGoods
        - netProfit
        - salesCount
        - itemsSold
        - missingCostCount
        - feesEstimated
      properties:
        revenue:
          $ref: '#/components/schemas/Money'
          description: 'What buyers paid: the sale prices plus the shipping they paid.'
        fees:
          $ref: '#/components/schemas/Money'
          description: Every fee line except shipping labels (marketplace, payment, promotion, tax, other).
        shipping:
          $ref: '#/components/schemas/Money'
          description: |
            What the seller paid to ship: labels the marketplace deducted (`shipping_label` fee
            lines) plus labels bought outside the payout (`Sale.shippingCost`).
        costOfGoods:
          $ref: '#/components/schemas/Money'
          description: The sold items' costs (an item without a cost adds nothing).
        netProfit:
          $ref: '#/components/schemas/Money'
        roiBasisPoints:
          type: integer
          format: int64
          description: '`netProfit` over `costOfGoods` in basis points (12550 is 125.5%). Absent for a zero cost of goods.'
        salesCount:
          type: integer
          format: int32
          minimum: 0
          description: Orders (a bundle is one).
        itemsSold:
          type: integer
          format: int32
          minimum: 0
        missingCostCount:
          type: integer
          format: int32
          minimum: 0
          description: Sold items with no cost entered; their cost counts as zero.
        averageSalePrice:
          $ref: '#/components/schemas/Money'
          description: The sale prices over `itemsSold`. Absent when nothing sold.
        averageProfitPerItem:
          $ref: '#/components/schemas/Money'
          description: '`netProfit` over `itemsSold`. Absent when nothing sold.'
        averageDaysToSell:
          type: integer
          format: int32
          minimum: 0
          description: |
            Whole days from an item's first listing (or, never listed through Listora, from when it
            was added) to its sale, averaged over the items sold. Absent when nothing sold.
        sellThroughBasisPoints:
          type: integer
          format: int32
          minimum: 0
          maximum: 10000
          description: |
            `itemsSold` over `itemsSold` plus the items listed now that were added by the period's
            end, in basis points. Absent when both are zero.
        feesEstimated:
          type: boolean
          description: True while any of the period's fee lines is an estimate; the profit is then an estimate too.
    ProfitBucket:
      type: object
      description: One bucket of the period's series (see `ProfitPeriod.granularity`).
      required:
        - start
        - revenue
        - netProfit
        - itemsSold
      properties:
        start:
          type: string
          format: date
          description: The bucket's first day (the period's first day for a partial first bucket).
        revenue:
          $ref: '#/components/schemas/Money'
        netProfit:
          $ref: '#/components/schemas/Money'
        itemsSold:
          type: integer
          format: int32
          minimum: 0
    MarketplaceProfit:
      type: object
      description: |
        The seller's own totals on one marketplace. Only totals: no ranking, share, or speed, so
        no marketplace's performance is presented relative to another's (eBay's API License
        Agreement restricts that without eBay's consent).
      required:
        - marketplace
        - salesCount
        - itemsSold
        - revenue
        - fees
        - shipping
        - costOfGoods
        - netProfit
      properties:
        marketplace:
          $ref: '#/components/schemas/Marketplace'
        salesCount:
          type: integer
          format: int32
          minimum: 0
        itemsSold:
          type: integer
          format: int32
          minimum: 0
        revenue:
          $ref: '#/components/schemas/Money'
        fees:
          $ref: '#/components/schemas/Money'
        shipping:
          $ref: '#/components/schemas/Money'
        costOfGoods:
          $ref: '#/components/schemas/Money'
        netProfit:
          $ref: '#/components/schemas/Money'
    ProfitGroup:
      type: object
      description: The period's sold items of one brand or one category.
      required:
        - key
        - itemsSold
        - revenue
        - netProfit
      properties:
        key:
          type: string
          maxLength: 200
          description: The brand as entered, or the category path (`ItemDetails.category`).
        itemsSold:
          type: integer
          format: int32
          minimum: 1
        revenue:
          $ref: '#/components/schemas/Money'
        netProfit:
          $ref: '#/components/schemas/Money'
        roiBasisPoints:
          type: integer
          format: int64
          description: '`netProfit` over the items'' cost in basis points. Absent for a zero cost.'
        averageDaysToSell:
          type: integer
          format: int32
          minimum: 0
    ProfitRanking:
      type: object
      description: |
        Groups ranked by net profit: up to five `best` (highest first) and up to five `worst`
        (lowest first), never the same group in both. Items without a brand or category are left
        out.
      required:
        - best
        - worst
      properties:
        best:
          type: array
          maxItems: 5
          items:
            $ref: '#/components/schemas/ProfitGroup'
        worst:
          type: array
          maxItems: 5
          items:
            $ref: '#/components/schemas/ProfitGroup'
    DeadStockBucket:
      type: object
      description: Unsold items in inventory longer than the bucket's age, and the money tied up in them.
      required:
        - itemCount
        - cost
        - missingCostCount
      properties:
        itemCount:
          type: integer
          format: int32
          minimum: 0
        cost:
          $ref: '#/components/schemas/Money'
          description: The items' total cost (an item without a cost adds nothing).
        missingCostCount:
          type: integer
          format: int32
          minimum: 0
    DeadStockItem:
      type: object
      required:
        - itemId
        - sku
        - ageDays
        - status
      properties:
        itemId:
          $ref: '#/components/schemas/Id'
        sku:
          $ref: '#/components/schemas/Sku'
        title:
          type: string
          maxLength: 500
        ageDays:
          type: integer
          format: int32
          minimum: 0
          description: Whole days since the item was bought (its purchase date) or, without one, added.
        cost:
          $ref: '#/components/schemas/Money'
        status:
          $ref: '#/components/schemas/ItemStatus'
    DeadStock:
      type: object
      description: |
        Active inventory (draft, ready, or listed) that has not sold, by age today, whatever the
        report's period.
      required:
        - over60Days
        - over90Days
        - oldest
      properties:
        over60Days:
          $ref: '#/components/schemas/DeadStockBucket'
        over90Days:
          $ref: '#/components/schemas/DeadStockBucket'
        oldest:
          type: array
          maxItems: 5
          description: The oldest items over 60 days, oldest first.
          items:
            $ref: '#/components/schemas/DeadStockItem'
    ProfitReport:
      type: object
      required:
        - period
        - summary
        - series
        - marketplaces
        - brands
        - categories
        - deadStock
      properties:
        period:
          $ref: '#/components/schemas/ProfitPeriod'
        summary:
          $ref: '#/components/schemas/ProfitSummary'
        series:
          type: array
          description: One bucket per day, week, or month of the period, in order, including empty ones.
          maxItems: 400
          items:
            $ref: '#/components/schemas/ProfitBucket'
        marketplaces:
          type: array
          description: The marketplaces with a sale in the period, in the fixed `KnownMarketplace` order (never ranked).
          maxItems: 64
          items:
            $ref: '#/components/schemas/MarketplaceProfit'
        brands:
          $ref: '#/components/schemas/ProfitRanking'
        categories:
          $ref: '#/components/schemas/ProfitRanking'
        deadStock:
          $ref: '#/components/schemas/DeadStock'
    UserTaskKind:
      description: |
        A `KnownUserTaskKind`, or a kind added after this client was built. Clients show an
        unknown task's `title`, `instructions`, and `deepLink`, and ask the user to update
        the app to complete it.
      anyOf:
        - $ref: '#/components/schemas/KnownUserTaskKind'
        - type: string
          maxLength: 64
    KnownUserTaskKind:
      type: string
      description: |
        `resolve_double_sale`: an item sold twice; the user cancels one of the orders (the
        task's sale is the later one) and completes the task.
      enum:
        - list_manually
        - delist_manually
        - edit_manually
        - confirm_sale
        - reconnect
        - review_match
        - resolve_double_sale
    UserTaskStatus:
      type: string
      enum:
        - open
        - completed
        - dismissed
    UserTaskUrgency:
      type: string
      description: '`urgent` for delists after a sale (pushed, and re-alerted until done).'
      enum:
        - normal
        - urgent
    CopyField:
      type: object
      description: One value the user copies into the marketplace app with one tap.
      required:
        - label
        - value
      properties:
        label:
          type: string
          maxLength: 64
        value:
          type: string
          maxLength: 10000
    CopyAssist:
      type: object
      description: Everything the user needs to do the task by hand.
      required:
        - fields
        - photos
      properties:
        fields:
          type: array
          items:
            $ref: '#/components/schemas/CopyField'
        photos:
          type: array
          description: Photos to save to the camera roll, in posting order.
          items:
            $ref: '#/components/schemas/Photo'
    UserTask:
      type: object
      required:
        - id
        - kind
        - status
        - urgency
        - title
        - createdAt
      properties:
        id:
          $ref: '#/components/schemas/Id'
        kind:
          $ref: '#/components/schemas/UserTaskKind'
        status:
          $ref: '#/components/schemas/UserTaskStatus'
        urgency:
          $ref: '#/components/schemas/UserTaskUrgency'
        title:
          type: string
          maxLength: 200
          description: For example "Sold on Depop - delist on Poshmark".
        instructions:
          type: string
          maxLength: 2000
        marketplace:
          $ref: '#/components/schemas/Marketplace'
        itemId:
          $ref: '#/components/schemas/Id'
        item:
          $ref: '#/components/schemas/UserTaskItem'
        listingId:
          $ref: '#/components/schemas/Id'
        operationId:
          $ref: '#/components/schemas/Id'
        saleId:
          $ref: '#/components/schemas/Id'
          description: For `confirm_sale`, the sale to confirm; for `resolve_double_sale`, the later sale.
        deepLink:
          type: string
          format: uri
          description: Opens the right screen in the marketplace app or site.
        copyAssist:
          $ref: '#/components/schemas/CopyAssist'
        dueAt:
          $ref: '#/components/schemas/Timestamp'
        createdAt:
          $ref: '#/components/schemas/Timestamp'
        completedAt:
          $ref: '#/components/schemas/Timestamp'
    UserTaskItem:
      type: object
      description: The item a task is about, enough to show it in the task inbox.
      required:
        - id
        - sku
      properties:
        id:
          $ref: '#/components/schemas/Id'
        sku:
          $ref: '#/components/schemas/Sku'
        title:
          type: string
          maxLength: 200
        coverPhoto:
          $ref: '#/components/schemas/Photo'
    UserTaskCompletion:
      type: object
      description: |
        The user's confirmation and, for some kinds, their decision. Which properties apply
        depends on the task's `kind`; a property that does not apply is
        `422 validation_failed`.

        - `list_manually`: optional `externalUrl`, the new listing's URL on the task's
          marketplace (links the listing, so later tasks open it); `422 validation_failed` when
          it is not a listing on that marketplace, and `409 already_exists` when another listing
          already has it.
        - `review_match`: the user's choice, `matchedItemId` and/or `matchedListingId`, or
          `rejectMatch: true` when nothing matches. Exactly one of the two is required.
        - `confirm_sale`: optional `saleCorrection` when the detected details are wrong.
        - `delist_manually`, `edit_manually`, `reconnect`, `resolve_double_sale`: nothing besides
          `note`.
        - Every kind: optional `note`.
      properties:
        externalUrl:
          type: string
          format: uri
        matchedItemId:
          $ref: '#/components/schemas/Id'
        matchedListingId:
          $ref: '#/components/schemas/Id'
        rejectMatch:
          type: boolean
        saleCorrection:
          $ref: '#/components/schemas/SaleCorrection'
        note:
          type: string
          maxLength: 1000
    SaleCorrection:
      type: object
      description: Corrected sale details; a property that is absent keeps the detected value.
      properties:
        salePrice:
          $ref: '#/components/schemas/Money'
          description: The order's sale price; for a bundle it is split across the items in proportion.
        soldAt:
          $ref: '#/components/schemas/Timestamp'
        externalOrderId:
          type: string
          maxLength: 128
    UserTaskPage:
      type: object
      required:
        - data
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/UserTask'
        nextCursor:
          type: string
          description: Present when there are more results.
    TodayCardKind:
      description: |
        A `KnownTodayCardKind`, or a card added after this client was built. Clients show an
        unknown card's `title`, `detail`, and action generically.
      anyOf:
        - $ref: '#/components/schemas/KnownTodayCardKind'
        - type: string
          maxLength: 64
    KnownTodayCardKind:
      type: string
      description: |
        `delist`: an item sold and is not delisted (or confirmed) everywhere else yet.
        `ship`: a sold item that is not shipped. `reconnect`: a marketplace connection only the
        seller can fix (`reauth_required` or `revoked`). `review_drafts`: items still in `draft`.
        `stale_listing`: a listing live a long time with no changes, with a price drop (never below
        the item's floor) or a relist suggested.
      enum:
        - delist
        - ship
        - reconnect
        - review_drafts
        - stale_listing
    TodayUrgency:
      description: |
        A `KnownTodayUrgency`, or a level added after this client was built, which clients show
        like `normal`.
      anyOf:
        - $ref: '#/components/schemas/KnownTodayUrgency'
        - type: string
          maxLength: 64
    KnownTodayUrgency:
      type: string
      description: |
        `urgent`: needs the seller now (a delist that is stuck or waiting for them, a ship-by date
        within a day or past). `high`: soon. `normal`: when the seller has a moment.
      enum:
        - urgent
        - high
        - normal
    TodayDestination:
      description: |
        A `KnownTodayDestination`, or a screen added after this client was built. Clients that do
        not know it open the item when the action names one, and otherwise offer no action.
      anyOf:
        - $ref: '#/components/schemas/KnownTodayDestination'
        - type: string
          maxLength: 64
    KnownTodayDestination:
      type: string
      description: |
        `item`: the item screen (`itemId`). `sale`: the sale's screen (`saleId`; `itemId` names the
        item too). `marketplaces`: the marketplace connections screen (`connectionId` names the
        connection). `drafts`: the drafts waiting for review.
      enum:
        - item
        - sale
        - marketplaces
        - drafts
    TodayAction:
      type: object
      description: The card's one primary action and the screen it opens.
      required:
        - label
        - destination
      properties:
        label:
          type: string
          maxLength: 60
          description: The button's title, for example `Open sale` or `Lower to $40`.
        destination:
          $ref: '#/components/schemas/TodayDestination'
        itemId:
          $ref: '#/components/schemas/Id'
        saleId:
          $ref: '#/components/schemas/Id'
        connectionId:
          $ref: '#/components/schemas/Id'
    TodayItem:
      type: object
      description: The item a card is about.
      required:
        - id
        - sku
      properties:
        id:
          $ref: '#/components/schemas/Id'
        sku:
          $ref: '#/components/schemas/Sku'
        title:
          type: string
          maxLength: 200
        thumbnailUrl:
          type: string
          format: uri
          description: The item's cover photo, small; absent until a photo is processed.
    TodayShipment:
      type: object
      description: A `ship` card's sale and where the item is kept.
      required:
        - saleId
        - marketplace
        - soldAt
      properties:
        saleId:
          $ref: '#/components/schemas/Id'
        marketplace:
          $ref: '#/components/schemas/Marketplace'
        soldAt:
          $ref: '#/components/schemas/Timestamp'
        shipBy:
          $ref: '#/components/schemas/Timestamp'
          description: The marketplace's ship-by date, when it gives one.
        location:
          $ref: '#/components/schemas/TodayLocation'
    TodayLocation:
      type: object
      description: Where the item is kept, for example bin `B-12`.
      required:
        - code
      properties:
        code:
          type: string
          maxLength: 32
        label:
          type: string
          maxLength: 120
    TodayDelist:
      type: object
      description: A `delist` card's delist run, with its honest summary.
      required:
        - saleId
        - delistRunId
        - soldOn
        - statusDisplay
        - remaining
      properties:
        saleId:
          $ref: '#/components/schemas/Id'
        delistRunId:
          $ref: '#/components/schemas/Id'
        soldOn:
          $ref: '#/components/schemas/Marketplace'
        statusDisplay:
          $ref: '#/components/schemas/StatusDisplay'
        remaining:
          type: array
          description: The marketplaces where it is not delisted or confirmed yet.
          items:
            $ref: '#/components/schemas/Marketplace'
    TodayConnection:
      type: object
      description: A `reconnect` card's connection.
      required:
        - connectionId
        - marketplace
        - status
      properties:
        connectionId:
          $ref: '#/components/schemas/Id'
        marketplace:
          $ref: '#/components/schemas/Marketplace'
        displayName:
          type: string
          maxLength: 200
        status:
          $ref: '#/components/schemas/ConnectionStatus'
    TodayStaleSuggestion:
      description: |
        A `KnownTodayStaleSuggestion`, or a suggestion added after this client was built, which
        clients show through the card's `detail` and action.
      anyOf:
        - $ref: '#/components/schemas/KnownTodayStaleSuggestion'
        - type: string
          maxLength: 64
    KnownTodayStaleSuggestion:
      type: string
      description: |
        `price_drop`: lower the price to `suggestedPrice`, which is never below the item's floor.
        `relist`: no price drop is possible (the price is at its floor, or no floor is known).
      enum:
        - price_drop
        - relist
    TodayStaleListing:
      type: object
      description: A `stale_listing` card's listing facts and suggestion.
      required:
        - listedAt
        - daysListed
        - price
        - suggestion
        - marketplaces
      properties:
        listedAt:
          $ref: '#/components/schemas/Timestamp'
          description: When its oldest live listing went live.
        daysListed:
          type: integer
          format: int32
          minimum: 0
        price:
          $ref: '#/components/schemas/Money'
        floor:
          $ref: '#/components/schemas/Money'
        suggestion:
          $ref: '#/components/schemas/TodayStaleSuggestion'
        suggestedPrice:
          $ref: '#/components/schemas/Money'
          description: Present with `price_drop`.
        marketplaces:
          type: array
          description: Where it is live.
          items:
            $ref: '#/components/schemas/Marketplace'
    TodayDrafts:
      type: object
      description: A `review_drafts` card's drafts.
      required:
        - count
        - oldestCreatedAt
      properties:
        count:
          type: integer
          format: int32
          minimum: 1
        oldestCreatedAt:
          $ref: '#/components/schemas/Timestamp'
    TodayCard:
      type: object
      description: |
        One thing that needs the seller. A card exists only while its work is not done, so it is
        gone from the next summary once the work is finished. The kind's own property (`shipment`,
        `delist`, `connection`, `staleListing`, or `drafts`) carries its facts.
      required:
        - id
        - kind
        - urgency
        - title
        - action
      properties:
        id:
          type: string
          maxLength: 120
          description: Stable while the card's work is the same, for example `ship:<saleItemId>`.
        kind:
          $ref: '#/components/schemas/TodayCardKind'
        urgency:
          $ref: '#/components/schemas/TodayUrgency'
        title:
          type: string
          maxLength: 200
        detail:
          type: string
          maxLength: 500
        action:
          $ref: '#/components/schemas/TodayAction'
        item:
          $ref: '#/components/schemas/TodayItem'
        shipment:
          $ref: '#/components/schemas/TodayShipment'
        delist:
          $ref: '#/components/schemas/TodayDelist'
        connection:
          $ref: '#/components/schemas/TodayConnection'
        staleListing:
          $ref: '#/components/schemas/TodayStaleListing'
        drafts:
          $ref: '#/components/schemas/TodayDrafts'
    TodayMoneyPeriod:
      type: object
      description: |
        Sales in a 7-day period. Canceled and returned sales count for nothing. `profit` is the sum
        over the sales whose profit is known (price plus shipping charged, minus fees and the items'
        costs); a sale without recorded fees or with an item without a cost is counted in
        `profitPendingSales` instead. `profit` is absent when no sale's profit is known.
      required:
        - start
        - end
        - sales
        - itemsSold
        - salesTotal
        - profitPendingSales
      properties:
        start:
          $ref: '#/components/schemas/Timestamp'
        end:
          $ref: '#/components/schemas/Timestamp'
        sales:
          type: integer
          format: int32
          minimum: 0
          description: Orders.
        itemsSold:
          type: integer
          format: int32
          minimum: 0
        salesTotal:
          $ref: '#/components/schemas/Money'
          description: What the items sold for, before shipping, fees, and costs.
        profit:
          $ref: '#/components/schemas/Money'
        profitPendingSales:
          type: integer
          format: int32
          minimum: 0
    TodayMoney:
      type: object
      description: The last 7 days (`thisWeek`, ending now) next to the 7 days before (`lastWeek`).
      required:
        - thisWeek
        - lastWeek
      properties:
        thisWeek:
          $ref: '#/components/schemas/TodayMoneyPeriod'
        lastWeek:
          $ref: '#/components/schemas/TodayMoneyPeriod'
    Today:
      type: object
      required:
        - generatedAt
        - cards
        - money
      properties:
        generatedAt:
          $ref: '#/components/schemas/Timestamp'
        cards:
          type: array
          description: Most urgent first. Empty when the seller is all caught up.
          items:
            $ref: '#/components/schemas/TodayCard'
        money:
          $ref: '#/components/schemas/TodayMoney'
    TodaySummarySettings:
      type: object
      description: |
        The morning summary notification: once a day at `time` in `timeZone`, a push that sums up
        the Today screen (nothing is sent on a day with nothing to do). Until the app saves a time
        zone, `timeZone` is absent and no summary is sent.
      required:
        - enabled
        - time
      properties:
        enabled:
          type: boolean
        time:
          type: string
          pattern: ^([01][0-9]|2[0-3]):[0-5][0-9]$
          description: Wall-clock `HH:MM`, 24-hour.
        timeZone:
          type: string
          maxLength: 64
          description: An IANA time zone name, for example `America/New_York`.
    TodaySummarySettingsReplace:
      type: object
      required:
        - enabled
        - time
        - timeZone
      properties:
        enabled:
          type: boolean
        time:
          type: string
          pattern: ^([01][0-9]|2[0-3]):[0-5][0-9]$
          description: Wall-clock `HH:MM`, 24-hour.
        timeZone:
          type: string
          minLength: 1
          maxLength: 64
          description: An IANA time zone name, for example `America/New_York` (the device's own).
