ConnectionStatus:
  description: |
    A `KnownConnectionStatus`, or a status added after this client was built. Clients
    show the connection's `statusDisplay` for an unknown status.
  anyOf:
    - $ref: '#/KnownConnectionStatus'
    - type: string
      maxLength: 64
KnownConnectionStatus:
  type: string
  description: |
    State of the API connection. Assisted marketplaces (`mode: assisted`) have no account
    connection and report `not_connected`; their `statusDisplay` says so.
  enum: [not_connected, connected, degraded, reauth_required, revoked]
CapabilityMode:
  description: |
    A `KnownCapabilityMode`, or a mode added after this client was built. Clients treat
    an unknown mode like `none` (the capability is not offered).
  anyOf:
    - $ref: '#/KnownCapabilityMode'
    - type: string
      maxLength: 64
KnownCapabilityMode:
  type: string
  description: |
    `api`: through the marketplace's API. `automation`: by Listora's browser runner or the
    seller's iPhone, in the seller's session. `assisted`: by the user. `bulk_file`: by a file the seller uploads.
    `none`: not offered.
  enum: [api, automation, assisted, bulk_file, none]
MarkSoldMode:
  description: |
    A `KnownMarkSoldMode`, or a mode added after this client was built. Clients treat an
    unknown mode like `none`.
  anyOf:
    - $ref: '#/KnownMarkSoldMode'
    - type: string
      maxLength: 64
KnownMarkSoldMode:
  type: string
  enum: [api, automation, assisted, bulk_file, none, not_needed]
ConnectMethod:
  description: |
    A `KnownConnectMethod`, or a method added after this client was built. Clients treat
    an unknown method like `none` (no connect button).
  anyOf:
    - $ref: '#/KnownConnectMethod'
    - type: string
      maxLength: 64
KnownConnectMethod:
  type: string
  description: |
    `oauth`: the seller authorizes Listora on the marketplace. `session`: the seller logs into
    the marketplace in the app, and Listora keeps the session's cookies (never the password)
    for its browser runner. `none`: nothing to connect.
  enum: [oauth, session, none]
VerifyReadMode:
  description: |
    A `KnownVerifyReadMode`, or a mode added after this client was built. Clients offer no
    "check again" action for an unknown mode.
  anyOf:
    - $ref: '#/KnownVerifyReadMode'
    - type: string
      maxLength: 64
KnownVerifyReadMode:
  type: string
  description: |
    How success is established: a read-back through the API, a read-back through the
    automated browser session, or the user's confirmation.
  enum: [api, automation, user_confirm]
ImportListingsMode:
  description: |
    A `KnownImportListingsMode`, or a mode added after this client was built. Clients
    treat an unknown mode like `none`.
  anyOf:
    - $ref: '#/KnownImportListingsMode'
    - type: string
      maxLength: 64
KnownImportListingsMode:
  type: string
  enum: [api, share_sheet, bulk_file, none]
ImageTransportMode:
  description: |
    A `KnownImageTransportMode`, or a mode added after this client was built. Clients
    treat an unknown mode like `user_saves_photos`.
  anyOf:
    - $ref: '#/KnownImageTransportMode'
    - type: string
      maxLength: 64
KnownImageTransportMode:
  type: string
  enum: [url_fetch, upload, user_saves_photos]
MarketplaceCapabilities:
  type: object
  description: |
    What Listora can do on this marketplace for this account. Clients branch on these
    flags, never on the marketplace name; they can change when access is granted.
  required:
    [
      connect,
      create,
      updatePrice,
      updateDetails,
      delist,
      relist,
      markSold,
      verifyRead,
      importListings,
      saleDetection,
      imageTransport,
    ]
  properties:
    connect:
      $ref: '#/ConnectMethod'
    create:
      $ref: '#/CapabilityMode'
    updatePrice:
      $ref: '#/CapabilityMode'
    updateDetails:
      $ref: '#/CapabilityMode'
    delist:
      $ref: '#/CapabilityMode'
    relist:
      $ref: '#/CapabilityMode'
    markSold:
      $ref: '#/MarkSoldMode'
    verifyRead:
      $ref: '#/VerifyReadMode'
    importListings:
      $ref: '#/ImportListingsMode'
    saleDetection:
      type: array
      items:
        $ref: './sales.yaml#/SaleDetectionSource'
    imageTransport:
      $ref: '#/ImageTransportMode'
ConnectionIssue:
  type: object
  required: [code, message, occurredAt]
  properties:
    code:
      type: string
      maxLength: 64
    message:
      type: string
      maxLength: 1000
    occurredAt:
      $ref: './common.yaml#/Timestamp'
ConnectionAction:
  description: |
    A `KnownConnectionAction`, or an action added after this client was built. Clients hide
    actions they do not know.
  anyOf:
    - $ref: '#/KnownConnectionAction'
    - type: string
      maxLength: 64
KnownConnectionAction:
  type: string
  description: |
    `connect`: start `startConnectionAuthorization` for a marketplace not connected yet.
    `reconnect`: the same, for a connection that needs the seller's consent again (its grant
    was revoked, expires within 30 days, or fails); it renews the existing connection.
    `check`: `requestConnectionCheck` (Retry check), for a connection with a problem
    Listora may have cleared since, or an automation connection whose sign-in is not
    confirmed.
  enum: [connect, reconnect, check]
Connection:
  type: object
  required: [marketplace, mode, status, statusDisplay, capabilities, availableActions]
  properties:
    marketplace:
      $ref: './common.yaml#/Marketplace'
    mode:
      $ref: './common.yaml#/IntegrationMode'
    status:
      $ref: '#/ConnectionStatus'
    statusDisplay:
      $ref: './common.yaml#/StatusDisplay'
    capabilities:
      $ref: '#/MarketplaceCapabilities'
    availableActions:
      type: array
      maxItems: 10
      description: What the user can do about the connection now; empty when nothing.
      items:
        $ref: '#/ConnectionAction'
    displayName:
      type: string
      maxLength: 200
      description: The seller's name on the marketplace.
    connectedAt:
      $ref: './common.yaml#/Timestamp'
    grantExpiresAt:
      $ref: './common.yaml#/Timestamp'
      description: When the user must reconnect (Depop grants last one year; eBay refresh tokens about 18 months).
    lastOkAt:
      $ref: './common.yaml#/Timestamp'
      description: When the marketplace last accepted Listora's access (the last successful check).
    lastCheckedAt:
      $ref: './common.yaml#/Timestamp'
      description: When Listora last checked the connection, whatever it found.
    lastIssue:
      $ref: '#/ConnectionIssue'
    execution:
      $ref: './phone.yaml#/ConnectionExecution'
    saleChecks:
      $ref: './activity.yaml#/ConnectionSaleChecks'
ConnectionList:
  type: object
  required: [data]
  properties:
    data:
      type: array
      items:
        $ref: '#/Connection'
ConnectionAuthorizationStatus:
  type: string
  enum: [pending, completed, failed, expired]
ConnectionAuthorization:
  type: object
  required: [id, marketplace, status, callbackUrlScheme, expiresAt, createdAt]
  properties:
    id:
      $ref: './common.yaml#/Id'
    marketplace:
      $ref: './common.yaml#/Marketplace'
    status:
      $ref: '#/ConnectionAuthorizationStatus'
    authorizationUrl:
      type: string
      format: uri
      description: |
        The marketplace's own consent page. Only in the `startConnectionAuthorization`
        response (and its replays): it carries the attempt's single-use `state`, which
        Listora keeps only as a hash.
    callbackUrlScheme:
      type: string
      maxLength: 32
      description: The URL scheme `ASWebAuthenticationSession` waits for (`listora`).
    expiresAt:
      $ref: './common.yaml#/Timestamp'
    failure:
      $ref: './errors.yaml#/ApiError'
      description: Present when `status` is `failed`.
    connection:
      $ref: '#/Connection'
      description: Present when `status` is `completed`.
    createdAt:
      $ref: './common.yaml#/Timestamp'
    completedAt:
      $ref: './common.yaml#/Timestamp'
ConnectionAttentionReason:
  description: |
    A `KnownConnectionAttentionReason`, or a reason added after this client was built.
    Clients show the entry's `statusDisplay` for an unknown reason.
  anyOf:
    - $ref: '#/KnownConnectionAttentionReason'
    - type: string
      maxLength: 64
KnownConnectionAttentionReason:
  type: string
  description: |
    `reconnect`: the marketplace no longer accepts Listora's access (`reauth_required`).
    `access_removed`: the access was revoked (`revoked`). `connection_problem`: Listora
    cannot reach the marketplace now and keeps checking (`degraded`). `expiring`: the grant
    ends within 30 days. `not_confirmed`: Listora could not confirm that the marketplace
    accepts the sign-in linked for automation (its check failed or did not finish); the
    `check` action checks it again.
  enum: [reconnect, access_removed, connection_problem, expiring, not_confirmed]
ConnectionAttention:
  type: object
  description: One connection that needs the seller's attention.
  required: [marketplace, reason, statusDisplay]
  properties:
    marketplace:
      $ref: './common.yaml#/Marketplace'
    reason:
      $ref: '#/ConnectionAttentionReason'
    statusDisplay:
      $ref: './common.yaml#/StatusDisplay'
      description: The connection's own status, as in `Connection.statusDisplay`.
SaleForwardingStatus:
  description: |
    A `KnownSaleForwardingStatus`, or a status added after this client was built. Clients
    show the `statusDisplay`.
  anyOf:
    - $ref: '#/KnownSaleForwardingStatus'
    - type: string
      maxLength: 64
KnownSaleForwardingStatus:
  type: string
  description: |
    - `needs_domain`: forwarding marketplace sale emails to Listora needs Listora's inbound
      email domain, which this deployment does not have yet.
    - `not_set_up`, `confirming`, `working`: as `KnownSaleEmailStatus` (`getSaleEmails`, which
      has the address and the setup steps).
  enum: [needs_domain, not_set_up, confirming, working]
SaleForwarding:
  type: object
  description: Forwarding marketplace sale emails to Listora, which detects sales sooner.
  required: [status, statusDisplay]
  properties:
    status:
      $ref: '#/SaleForwardingStatus'
    statusDisplay:
      $ref: './common.yaml#/StatusDisplay'
ConnectionHealthSummary:
  type: object
  required: [needsAttention, attention, connections, saleForwarding]
  properties:
    needsAttention:
      type: boolean
      description: True while any connection is in `attention`; the app shows `banner` then.
    banner:
      $ref: './common.yaml#/StatusDisplay'
      description: Present exactly when `needsAttention`.
    attention:
      type: array
      maxItems: 20
      description: The connections that need attention, those only the seller can fix first.
      items:
        $ref: '#/ConnectionAttention'
    connections:
      type: array
      description: Every marketplace and its connection, as `listConnections` returns them.
      items:
        $ref: '#/Connection'
    saleForwarding:
      $ref: '#/SaleForwarding'
    lastCheckedAt:
      $ref: './common.yaml#/Timestamp'
      description: The latest check of any connection; absent before the first.
