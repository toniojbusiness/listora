InviteStatus:
  description: |
    A `KnownInviteStatus`, or a status added after this client was built. Clients show
    `statusDisplay` as given.
  anyOf:
    - $ref: '#/KnownInviteStatus'
    - type: string
      maxLength: 64
KnownInviteStatus:
  type: string
  description: |
    - `open`: nobody has redeemed it yet.
    - `expired`: nobody redeemed it before `expiresAt`.
    - `redeemed`: the invitee entered the code and their `email`, and has not signed in yet.
    - `active`: the invitee signed in; their own account exists.
    - `revoked`: revoked by the account (`revokedAt`); with an `email`, that person can no
      longer sign in.
  enum: [open, expired, redeemed, active, revoked]
InviteAction:
  description: A `KnownInviteAction`, or an action added after this client was built (hide it).
  anyOf:
    - $ref: '#/KnownInviteAction'
    - type: string
      maxLength: 64
KnownInviteAction:
  type: string
  description: |
    - `revoke`: `revokeInvite`.
    - `restore`: `restoreInvite`.
  enum: [revoke, restore]
Invite:
  type: object
  description: |
    One invite of the account, and the person who joined through it. The code itself is never
    shown again after `createInvite`; `codeHint` (its last four characters) tells invites apart.
  required: [id, codeHint, status, statusDisplay, availableActions, createdAt]
  properties:
    id:
      $ref: './common.yaml#/Id'
    label:
      type: string
      maxLength: 100
      description: Who it is for, as the inviter wrote it, for example "Maria".
    codeHint:
      type: string
      pattern: '^[0-9A-Z]{4}$'
      description: The code's last four characters.
    status:
      $ref: '#/InviteStatus'
    statusDisplay:
      $ref: './common.yaml#/StatusDisplay'
    email:
      type: string
      maxLength: 320
      description: The invitee's email, once they redeemed it.
    expiresAt:
      $ref: './common.yaml#/Timestamp'
    redeemedAt:
      $ref: './common.yaml#/Timestamp'
    joinedAt:
      $ref: './common.yaml#/Timestamp'
    revokedAt:
      $ref: './common.yaml#/Timestamp'
    availableActions:
      type: array
      maxItems: 2
      items:
        $ref: '#/InviteAction'
    createdAt:
      $ref: './common.yaml#/Timestamp'
InviteList:
  type: object
  required: [canInvite, data]
  properties:
    canInvite:
      type: boolean
      description: Whether this account may create invites.
    data:
      type: array
      maxItems: 100
      items:
        $ref: '#/Invite'
InviteCreate:
  type: object
  additionalProperties: false
  properties:
    label:
      type: string
      minLength: 1
      maxLength: 100
      description: Who it is for, to tell invites apart.
    expiresInDays:
      type: integer
      format: int32
      minimum: 1
      maximum: 90
      description: Days until an unredeemed invite stops working; absent means it never expires.
CreatedInvite:
  type: object
  required: [invite, code, link, message]
  properties:
    invite:
      $ref: '#/Invite'
    code:
      type: string
      maxLength: 32
      description: |
        The one-time code, for example `K7QD-3M9P-XW2T-H8RA`, shown only in this answer.
        Anyone with it can redeem the invite until it is used, so share it with that person only.
    link:
      type: string
      format: uri
      maxLength: 256
      description: Opens the app's sign-up with the code filled in (`listora://invite/<code>`).
    message:
      type: string
      maxLength: 1000
      description: A message to share with the invitee, with the code and how to use it.
InviteRedeem:
  type: object
  additionalProperties: false
  required: [code, email]
  properties:
    code:
      type: string
      minLength: 1
      maxLength: 64
      description: The code as typed; case, spaces, and dashes do not matter.
    email:
      type: string
      format: email
      maxLength: 320
      description: The invitee's own email, which they sign in with.
InviteRedemptionStatus:
  description: |
    A `KnownInviteRedemptionStatus`, or one added after this client was built (show `message`
    and let the person redeem again).
  anyOf:
    - $ref: '#/KnownInviteRedemptionStatus'
    - type: string
      maxLength: 64
KnownInviteRedemptionStatus:
  type: string
  description: |
    - `ready`: sign in with `email` now; the one-time code is emailed there.
    - `email_verification_sent`: the sign-in codes cannot reach `email` yet. A verification
      email from Amazon Web Services was sent there: open its link, then redeem again.
  enum: [ready, email_verification_sent]
InviteRedemption:
  type: object
  required: [email, status, message]
  properties:
    email:
      type: string
      maxLength: 320
      description: The email the invite now belongs to, lowercase; sign in with it.
    status:
      $ref: '#/InviteRedemptionStatus'
    message:
      type: string
      maxLength: 500
      description: What to do next, in words to show as is.
