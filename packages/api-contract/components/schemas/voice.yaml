VoiceCorrectionRequest:
  type: object
  required: [transcript]
  properties:
    transcript:
      type: string
      minLength: 1
      maxLength: 500
      description: |
        The phrases of the seller's spoken correction that the app's own parser could not
        map, as text (on-device speech recognition). Never audio.
VoiceCorrection:
  type: object
  required: [changes]
  properties:
    changes:
      type: array
      maxItems: 20
      description: The proposed changes in the order they were said; empty when nothing mapped.
      items:
        $ref: '#/VoiceCorrectionChange'
VoiceCorrectionChange:
  type: object
  description: |
    One proposed change. `cost` (what the seller paid) and `listPrice` carry `amount`; every
    other field carries `value`: a canonical value for category (`<category>/<subcategory>`),
    department, sizeSystem, colors, pattern, materials, and condition, otherwise text. A list
    detail gets one change per entry: the colors (or materials) of one answer together
    replace the item's, and each keyword or flaw is added to the item's.
  required: [field]
  properties:
    field:
      $ref: '#/VoiceCorrectionField'
    value:
      type: string
      minLength: 1
      maxLength: 200
    amount:
      $ref: './common.yaml#/Money'
VoiceCorrectionField:
  description: |
    A `KnownVoiceCorrectionField`, or a field added after this client was built. Clients
    ignore a change to a field they do not know.
  anyOf:
    - $ref: '#/KnownVoiceCorrectionField'
    - type: string
      maxLength: 64
KnownVoiceCorrectionField:
  type: string
  description: |
    The item detail a change is for, named like `ItemDetails`; `cost` is what the seller paid
    and `purchaseSource` where they bought it.
  enum:
    - title
    - brand
    - productName
    - category
    - department
    - sizeLabel
    - sizeSystem
    - colors
    - pattern
    - materials
    - keywords
    - styleNumber
    - condition
    - conditionNotes
    - flaws
    - cost
    - purchaseSource
    - listPrice
