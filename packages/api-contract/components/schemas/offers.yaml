OfferAction:
  description: An `KnownOfferAction`, or one added after this client was built.
  anyOf:
    - $ref: '#/KnownOfferAction'
    - type: string
      maxLength: 64
KnownOfferAction:
  type: string
  description: |
    The seller's answer to an offer. `accept`: on Poshmark it sells the listing at once (the
    buyer paid when they offered); on Depop the buyer then buys at that price.
    `decline`: the offer ends. `counter`: the seller asks for another price (more than the
    offer, less than the listing's price), and the offer waits on the buyer.
  enum: [accept, decline, counter]
OfferQuote:
  type: object
  description: What the seller gets for a price on the offer's marketplace, after its fees (an estimate from Listora's fee tables).
  required: [price, fees, net]
  properties:
    price:
      $ref: './common.yaml#/Money'
    fees:
      $ref: './common.yaml#/Money'
    net:
      $ref: './common.yaml#/Money'
OfferResponseStatus:
  description: A `KnownOfferResponseStatus`, or one added after this client was built.
  anyOf:
    - $ref: '#/KnownOfferResponseStatus'
    - type: string
      maxLength: 64
KnownOfferResponseStatus:
  type: string
  description: |
    `queued`: waiting for the seller's iPhone. `running`: the iPhone is answering it.
    `verifying`: it may have reached the marketplace, and Listora reads the offer to confirm.
    `succeeded`: a read of the offer shows the answer. `failed`: see `error`.
  enum: [queued, running, verifying, succeeded, failed]
OfferResponse:
  type: object
  description: |
    The seller's answer to an offer. It is sent once, from the seller's iPhone, and is
    `succeeded` only when a read of the offer on the marketplace shows it; it is never sent
    again once it may have reached the marketplace.
  required: [id, action, status, statusText, offerAmount, net, createdAt]
  properties:
    id:
      $ref: './common.yaml#/Id'
    action:
      $ref: '#/OfferAction'
    status:
      $ref: '#/OfferResponseStatus'
    statusText:
      type: string
      maxLength: 300
      description: For example "Accepting on your iPhone..." or "Accepted (confirmed by Poshmark)".
    offerAmount:
      $ref: './common.yaml#/Money'
    counter:
      $ref: './common.yaml#/Money'
    net:
      $ref: './common.yaml#/Money'
      description: What the confirmation showed the seller would get after fees (zero for a decline).
    error:
      $ref: '#/OfferResponseError'
    createdAt:
      $ref: './common.yaml#/Timestamp'
    finishedAt:
      $ref: './common.yaml#/Timestamp'
OfferResponseError:
  type: object
  required: [code, message, retryable]
  properties:
    code:
      type: string
      maxLength: 100
    message:
      type: string
      maxLength: 500
    retryable:
      type: boolean
      description: Whether answering again from Listora can help (it never can once the answer may have reached the marketplace).
Offer:
  type: object
  description: An offer a buyer made on one of the seller's listings, as the seller's own session last read it.
  required: [id, marketplace, status, amount, actions, acceptNote, accept, firstSeenAt, lastSeenAt]
  properties:
    id:
      $ref: './common.yaml#/Id'
    marketplace:
      $ref: './common.yaml#/Marketplace'
    status:
      type: string
      maxLength: 64
      description: '`pending` (waits on the seller), `accepted`, `declined`, `countered`, or `closed` (no longer shown waiting on the seller).'
    amount:
      $ref: './common.yaml#/Money'
      description: The buyer's offer (after a confirmed counter, the seller's price).
    listPrice:
      $ref: './common.yaml#/Money'
    listingTitle:
      type: string
      maxLength: 200
    buyerName:
      type: string
      maxLength: 100
      description: The buyer's public username on the marketplace, as the offer shows it.
    listingCount:
      type: integer
      minimum: 1
      description: How many listings the offer covers (a bundle), when more than one.
    shipping:
      $ref: './common.yaml#/Money'
      description: What the buyer pays for shipping under the offer, when it says.
    madeAt:
      $ref: './common.yaml#/Timestamp'
    expiresAt:
      $ref: './common.yaml#/Timestamp'
    url:
      type: string
      format: uri
      description: The offer's page on the marketplace (Open in Poshmark).
    actions:
      type: array
      description: The answers Listora can send now; empty while one is under way or once the offer no longer waits on the seller.
      items:
        $ref: '#/OfferAction'
    acceptNote:
      type: string
      maxLength: 300
      description: What accepting does on this marketplace, in the seller's words.
    accept:
      $ref: '#/OfferQuote'
      description: What accepting gives the seller after fees.
    counterRange:
      $ref: '#/OfferCounterRange'
    response:
      $ref: '#/OfferResponse'
      description: The newest answer from Listora, if any.
    firstSeenAt:
      $ref: './common.yaml#/Timestamp'
    lastSeenAt:
      $ref: './common.yaml#/Timestamp'
OfferCounterRange:
  type: object
  description: A counteroffer is more than `above` and, when `below` is present, less than it.
  required: [above]
  properties:
    above:
      $ref: './common.yaml#/Money'
    below:
      $ref: './common.yaml#/Money'
OfferAnswer:
  type: object
  additionalProperties: false
  description: |
    The seller's confirmed answer. `offerAmount` is the offer's amount the confirmation showed:
    an offer the buyer changed since is `422 validation_failed`. `counter` is required for a
    counter and refused otherwise.
  required: [action, offerAmount]
  properties:
    action:
      $ref: '#/KnownOfferAction'
    offerAmount:
      $ref: './common.yaml#/Money'
    counter:
      $ref: './common.yaml#/Money'
OfferCheck:
  type: object
  description: |
    When Listora last read the seller's offers on one marketplace, and how that went. Only
    marketplaces whose offer reads passed live are listed (docs/features/verified-features.md).
    A read that failed carries no error for the seller: it goes to the owner's alerts
    (docs/features/read-health.md).
  required: [marketplace, status]
  properties:
    marketplace:
      $ref: './common.yaml#/Marketplace'
    status:
      type: string
      maxLength: 64
      description: '`waiting` (a read waits for the iPhone), `ok`, or `failed` (the last read did not get through).'
    checkedAt:
      $ref: './common.yaml#/Timestamp'
      description: When a read last succeeded.
OfferCheckList:
  type: object
  required: [data]
  properties:
    data:
      type: array
      items:
        $ref: '#/OfferCheck'
