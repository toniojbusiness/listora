openapi: 3.1.0
info:
  title: Listora API
  version: 1.0.0
  summary: The v1 contract between the Listora iPhone app and the Listora backend.
  description: |
    Single source of truth for the Listora HTTP API. The server's TypeScript types and the
    iOS Swift client are generated from this file (`npm run contract:generate`), and CI fails
    when the generated code is stale. Conventions are documented in
    `packages/api-contract/README.md`. The most important ones:

    - **Never false success.** Marketplace state is reported by the server through
      `statusDisplay` (a server-rendered label plus a tone) and `verification`. A listing or
      operation is shown as done only after an API read-back or an explicit user
      confirmation. Clients render these values; they never infer success themselves.
    - **Money** is always integer minor units (`amountCents`) plus a `currency`.
    - **Errors** always use `ErrorResponse`: a machine `code`, a user-readable `message`, and
      a `retryable` flag.
    - **Lists** use opaque cursor pagination (`cursor`, `limit`, `nextCursor`).
    - **Every POST** requires an `Idempotency-Key` header, so retries after a lost response
      never create a second item, listing, or marketplace action.
    - **Absent means no value.** The server omits a property instead of sending `null`.
    - **Open enums.** A response value that can grow (marketplaces, statuses, actions,
      capabilities) is a `Known*` value or any other string, so a new value never breaks an
      installed app. Clients handle values they do not know.
  contact:
    name: Listora engineering
servers:
  - url: http://127.0.0.1:3000
    description: Local development (`npm run dev:api`)
security:
  - bearerAuth: []
tags:
  - name: health
    description: Liveness and readiness probes for load balancers and containers.
  - name: account
    description: The signed-in person's Listora account and profile.
  - name: items
    description: Master inventory items. Each physical item has one item and one SKU.
  - name: photos
    description: Upload sessions and item photos.
  - name: analysis
    description: AI analysis of an item's photos (run once per photo set).
  - name: batches
    description: Batches of items photographed in one session, and where each item is.
  - name: hauls
    description: Items bought together for one price, and each one's share of it.
  - name: pricing
    description: Price suggestions with honest source labels.
  - name: listings
    description: Per-marketplace listings of an item and the actions on them.
  - name: operations
    description: Marketplace operations (every marketplace write) and their event history.
  - name: connections
    description: Marketplace account connections and their health.
  - name: sales
    description: Sales and the automatic delist run each sale starts.
  - name: profit
    description: The profit dashboard over the seller's sales and inventory.
  - name: reports
    description: The year's reports and the CSV exports of sales and inventory, for taxes and bookkeeping.
  - name: tasks
    description: Assisted-mode tasks the user completes in a marketplace app.
  - name: invites
    description: Invites to sign up for Listora, each to a person's own, separate account.
  - name: sale-emails
    description: The forwarding address that catches Poshmark, Mercari, and Depop sale emails.
  - name: usage
    description: How much of the plan's quotas the account has used this period.
  - name: today
    description: The Today screen (what needs the seller, and the money summary) and its morning summary.
  - name: listing-refresh
    description: Listing refresh, which keeps live listings that have not sold fresh on each marketplace (docs/features/listing-refresh.md).
  - name: pack-check
    description: Pack check, an optional mode that checks each package's label before it ships.
  - name: voice
    description: Spoken corrections on the review screen that the app could not parse itself.
  - name: prefill
    description: What each marketplace's sell form will get for an item, and the review's questions.
  - name: phone
    description: The seller's devices, and the marketplace work their iPhone runs (docs/features/phone-execution.md).
  - name: activity
    description: The activity timeline of items and marketplace actions, and how each sale was found (docs/features/activity.md).
  - name: imports
    description: Importing the seller's existing listings from a linked marketplace, and the questions it asks (docs/features/imports.md).
  - name: offers
    description: Buyers' offers on the seller's listings, read from the marketplaces, and the seller's answers to them (docs/features/offers.md).
  - name: sync
    description: Syncing the linked marketplaces now, read-only, and what each sync found (docs/features/sync.md).
  - name: marketplace-features
    description: Each marketplace's features that passed a live end-to-end test, the only ones the app shows (docs/features/verified-features.md).
  - name: sourcing
    description: The household's own sales, grouped for sourcing at the store (docs/features/thrift-scan.md).
  - name: sourcing-runs
    description: Trips to a store scanning items to buy (docs/features/thrift-scan.md).
  - name: scans
    description: Items scanned at the store, with the AI's read and the Buy / Your call / Skip call (docs/features/thrift-scan.md).

