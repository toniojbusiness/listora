/v1/imports:
  get:
    tags: [imports]
    operationId: listListingImports
    summary: List the marketplaces Listora imports listings from, each with its latest import
    description: |
      One entry per marketplace Listora can import from (Depop, Poshmark, Mercari): whether an
      import can start now (the marketplace is linked, none is under way) or why not, and its
      newest import with its progress and summary.
    responses:
      '200':
        description: The marketplaces and their newest imports.
        content:
          application/json:
            schema:
              $ref: '../components/schemas/imports.yaml#/ListingImports'
      default:
        $ref: '../components/responses.yaml#/DefaultError'
  post:
    tags: [imports]
    operationId: startListingImport
    summary: Import the seller's listings for sale on a marketplace
    description: |
      Starts reading the seller's listings for sale on a linked marketplace, a page at a time
      where the marketplace runs (the seller's iPhone, or Listora's cloud browser), read-only:
      nothing on the marketplace changes. Each listing becomes an item already listed there, is
      added to the item it is the same as, or becomes a question for the seller.
      `marketplace_not_connected` when the marketplace is not linked, `already_exists` while an
      import of it is under way, `marketplace_action_unavailable` for a marketplace Listora
      doesn't import from.
    parameters:
      - $ref: '../components/parameters.yaml#/IdempotencyKey'
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../components/schemas/imports.yaml#/ListingImportStart'
    responses:
      '202':
        description: The import started.
        content:
          application/json:
            schema:
              $ref: '../components/schemas/imports.yaml#/ListingImport'
      '409':
        $ref: '../components/responses.yaml#/Conflict'
      '422':
        $ref: '../components/responses.yaml#/ValidationFailed'
      default:
        $ref: '../components/responses.yaml#/DefaultError'
/v1/imports/{importId}:
  parameters:
    - $ref: '../components/parameters.yaml#/ImportId'
  get:
    tags: [imports]
    operationId: getListingImport
    summary: Get an import's progress and summary
    responses:
      '200':
        description: The import.
        content:
          application/json:
            schema:
              $ref: '../components/schemas/imports.yaml#/ListingImport'
      '404':
        $ref: '../components/responses.yaml#/NotFound'
      default:
        $ref: '../components/responses.yaml#/DefaultError'
/v1/imports/{importId}/questions:
  parameters:
    - $ref: '../components/parameters.yaml#/ImportId'
  get:
    tags: [imports]
    operationId: listListingImportQuestions
    summary: List the import's questions for the seller
    description: |
      The listings the import was not sure about: each may be an item Listora already has, and
      the seller says which, or that it is an item of its own, or to leave it out. At most 200,
      oldest first.
    responses:
      '200':
        description: The open questions.
        content:
          application/json:
            schema:
              $ref: '../components/schemas/imports.yaml#/ListingImportQuestions'
      '404':
        $ref: '../components/responses.yaml#/NotFound'
      default:
        $ref: '../components/responses.yaml#/DefaultError'
/v1/imports/{importId}/questions/{questionId}/answer:
  parameters:
    - $ref: '../components/parameters.yaml#/ImportId'
    - $ref: '../components/parameters.yaml#/QuestionId'
  post:
    tags: [imports]
    operationId: answerListingImportQuestion
    summary: Answer one of the import's questions
    description: |
      `same_item`: the listing is that item (one of the question's candidates), and becomes its
      listing on the marketplace. `new_item`: it is an item of its own, imported with its photos.
      `skip`: it is not imported. `invalid_state_transition` for a question already answered,
      `marketplace_action_unavailable` when the item already has a listing there.
    parameters:
      - $ref: '../components/parameters.yaml#/IdempotencyKey'
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../components/schemas/imports.yaml#/ListingImportAnswer'
    responses:
      '200':
        description: The import, with the answer counted.
        content:
          application/json:
            schema:
              $ref: '../components/schemas/imports.yaml#/ListingImport'
      '404':
        $ref: '../components/responses.yaml#/NotFound'
      '409':
        $ref: '../components/responses.yaml#/Conflict'
      '422':
        $ref: '../components/responses.yaml#/ValidationFailed'
      default:
        $ref: '../components/responses.yaml#/DefaultError'
