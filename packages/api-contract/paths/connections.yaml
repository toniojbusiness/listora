/v1/connections:
  get:
    tags: [connections]
    operationId: listConnections
    summary: List marketplace connections
    description: One entry per supported marketplace, including assisted ones, so not paginated.
    responses:
      '200':
        description: Every marketplace and its connection state.
        content:
          application/json:
            schema:
              $ref: '../components/schemas/connections.yaml#/ConnectionList'
      default:
        $ref: '../components/responses.yaml#/DefaultError'
/v1/connections/{marketplace}:
  parameters:
    - $ref: '../components/parameters.yaml#/MarketplacePath'
  get:
    tags: [connections]
    operationId: getConnection
    summary: Get one marketplace connection
    responses:
      '200':
        description: The connection.
        content:
          application/json:
            schema:
              $ref: '../components/schemas/connections.yaml#/Connection'
      '404':
        $ref: '../components/responses.yaml#/NotFound'
      default:
        $ref: '../components/responses.yaml#/DefaultError'
  delete:
    tags: [connections]
    operationId: disconnectConnection
    summary: Disconnect a marketplace account
    description: |
      Unlinks the marketplace and removes all of its data from the account: the stored tokens
      or session, its listings (and their links on items), the items only its import brought in
      that are not listed or sold anywhere else, its sales with their fees and Pack check
      orders, its offers, sale checks, imports, tasks, events, and the item history that names
      it; then it asks the marketplace to revoke Listora's access. Items made in Listora, and
      items listed on another marketplace, stay without that marketplace's listing. Nothing
      changes on the marketplace itself: its listings stay up there, and linking it again
      imports them and the sales history afresh. `404` when no account of the marketplace is
      linked; `409 connection_read_only` while the account is read only (the owner turns Read
      only off first, so an unlink and a relink never make it writable).
    responses:
      '200':
        description: The connection, now `not_connected`.
        content:
          application/json:
            schema:
              $ref: '../components/schemas/connections.yaml#/Connection'
      '404':
        $ref: '../components/responses.yaml#/NotFound'
      default:
        $ref: '../components/responses.yaml#/DefaultError'
/v1/connections/{marketplace}/authorizations:
  parameters:
    - $ref: '../components/parameters.yaml#/MarketplacePath'
  post:
    tags: [connections]
    operationId: startConnectionAuthorization
    summary: Start connecting a marketplace account (OAuth)
    description: |
      Returns the marketplace's official authorization URL. The app opens it in
      `ASWebAuthenticationSession` with `callbackUrlScheme`. The marketplace redirects the
      browser to `handleConnectionCallback`, which exchanges the code on the server and
      redirects to the app. The app then reads the result with
      `getConnectionAuthorization`; it never trusts the redirect alone. Listora never asks
      for marketplace passwords. `409 marketplace_action_unavailable` for marketplaces
      without an authorized API connection.
    parameters:
      - $ref: '../components/parameters.yaml#/IdempotencyKey'
    responses:
      '201':
        description: Created.
        content:
          application/json:
            schema:
              $ref: '../components/schemas/connections.yaml#/ConnectionAuthorization'
      '404':
        $ref: '../components/responses.yaml#/NotFound'
      '409':
        $ref: '../components/responses.yaml#/Conflict'
      default:
        $ref: '../components/responses.yaml#/DefaultError'
/v1/connections/{marketplace}/authorizations/{authorizationId}:
  parameters:
    - $ref: '../components/parameters.yaml#/MarketplacePath'
    - $ref: '../components/parameters.yaml#/AuthorizationId'
  get:
    tags: [connections]
    operationId: getConnectionAuthorization
    summary: Get the result of a connection attempt
    responses:
      '200':
        description: The authorization attempt.
        content:
          application/json:
            schema:
              $ref: '../components/schemas/connections.yaml#/ConnectionAuthorization'
      '404':
        $ref: '../components/responses.yaml#/NotFound'
      default:
        $ref: '../components/responses.yaml#/DefaultError'
/v1/connections/{marketplace}/callback:
  parameters:
    - $ref: '../components/parameters.yaml#/MarketplacePath'
  get:
    tags: [connections]
    operationId: handleConnectionCallback
    summary: OAuth redirect target (called by the marketplace, not the app)
    description: |
      The marketplace redirects the user's browser here after consent. No bearer token: the
      single-use, short-lived `state` binds the request to the authorization attempt. The
      server exchanges the code and always answers with a redirect to the app
      (`listora://connections/{marketplace}?authorizationId=...`), also on failure; the
      app then calls `getConnectionAuthorization`. Query parameter names follow OAuth 2.0.
      A request whose `state` names no attempt (missing, unknown, or already used by another
      marketplace) changes nothing and redirects without `authorizationId`; the app then
      reads the attempt it started. A repeated callback with the same `state` only redirects
      again.
    security: []
    parameters:
      - name: state
        in: query
        description: |
          The attempt's `state`. Not marked required: a marketplace's "declined" redirect may
          come without it, and that still has to reach the app.
        schema:
          type: string
          maxLength: 512
      - name: code
        in: query
        description: Authorization code; absent when the user declined.
        schema:
          type: string
          maxLength: 4096
      - name: error
        in: query
        description: OAuth error code, for example `access_denied`.
        schema:
          type: string
          maxLength: 256
      - name: error_description
        in: query
        schema:
          type: string
          maxLength: 2048
    responses:
      '302':
        description: Redirect to the app.
        headers:
          Location:
            description: An app URL with the `listora` scheme.
            required: true
            schema:
              type: string
              format: uri
      default:
        $ref: '../components/responses.yaml#/DefaultError'
/v1/connections/{marketplace}/checks:
  parameters:
    - $ref: '../components/parameters.yaml#/MarketplacePath'
  post:
    tags: [connections]
    operationId: requestConnectionCheck
    summary: Check a marketplace connection now (Retry check)
    description: |
      Queues the same cheap read the daily health check makes, for this connection only. For
      an automation connection it asks for a check of the sign-in already linked again, where
      the connection runs (the browser runner or the seller's iPhone), as after linking (`getMarketplaceSession`), without the seller signing in again;
      a check still running is left to finish. The answer is the connection with a `Checking`
      status; read it again (or `getConnectionHealth`, or `getMarketplaceSession`) to see what
      the check found. Offered as the `check` action on a connection with a problem.
      `409 invalid_state_transition` for a connection a check cannot change (not connected,
      or waiting for the seller to reconnect or link again); `409
      marketplace_action_unavailable` when this server cannot check the marketplace.
    parameters:
      - $ref: '../components/parameters.yaml#/IdempotencyKey'
    responses:
      '202':
        description: The check is queued.
        content:
          application/json:
            schema:
              $ref: '../components/schemas/connections.yaml#/Connection'
      '404':
        $ref: '../components/responses.yaml#/NotFound'
      '409':
        $ref: '../components/responses.yaml#/Conflict'
      default:
        $ref: '../components/responses.yaml#/DefaultError'
/v1/connections/{marketplace}/execution:
  parameters:
    - $ref: '../components/parameters.yaml#/MarketplacePath'
  put:
    tags: [connections]
    operationId: setConnectionExecution
    summary: Choose where a connection's automated steps run
    description: |
      Moves the connection's automated steps to Listora's cloud browser runner or to the
      iPhone that linked it (docs/features/phone-execution.md). Work waiting for the phone
      moves to the cloud with it; a run the phone is in the middle of finishes there.
      `409 invalid_state_transition` for a marketplace that is not linked by signing in;
      `409 marketplace_action_unavailable` for a move to the cloud of a marketplace that
      refuses Listora's cloud servers (`execution.cloudAllowed` false).
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../components/schemas/phone.yaml#/ConnectionExecutionChange'
    responses:
      '200':
        description: The connection.
        content:
          application/json:
            schema:
              $ref: '../components/schemas/connections.yaml#/Connection'
      '404':
        $ref: '../components/responses.yaml#/NotFound'
      '409':
        $ref: '../components/responses.yaml#/Conflict'
      '422':
        $ref: '../components/responses.yaml#/ValidationFailed'
      default:
        $ref: '../components/responses.yaml#/DefaultError'
/v1/connections/{marketplace}/read-only:
  parameters:
    - $ref: '../components/parameters.yaml#/MarketplacePath'
  put:
    tags: [connections]
    operationId: setConnectionReadOnly
    summary: Make a connection read only, or let Listora change it again
    description: |
      With `readOnly` true, Listora only reads the account (imports, listings, sold items,
      sales, offers, sale checks) and never changes anything on it (docs/features/read-only.md):
      every change to its listings is refused with `409 connection_read_only`, the changes
      still waiting to be sent fail with that error at once, and the delists after a sale skip
      it. `403 forbidden` for anyone but the account's owner; `404` when the marketplace has
      no connection.
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../components/schemas/connections.yaml#/ConnectionReadOnlyChange'
    responses:
      '200':
        description: The connection.
        content:
          application/json:
            schema:
              $ref: '../components/schemas/connections.yaml#/Connection'
      '404':
        $ref: '../components/responses.yaml#/NotFound'
      '422':
        $ref: '../components/responses.yaml#/ValidationFailed'
      default:
        $ref: '../components/responses.yaml#/DefaultError'
/v1/connection-health:
  get:
    tags: [connections]
    operationId: getConnectionHealth
    summary: The account's connection health summary
    description: |
      Every marketplace's connection (as `listConnections`), what needs the seller's
      attention (broken or failing connections and grants that end within 30 days), the
      banner the app shows while anything does, and sale email forwarding.
    responses:
      '200':
        description: The summary.
        content:
          application/json:
            schema:
              $ref: '../components/schemas/connections.yaml#/ConnectionHealthSummary'
      default:
        $ref: '../components/responses.yaml#/DefaultError'
/v1/marketplace-sessions:
  get:
    tags: [connections]
    operationId: listMarketplaceSessions
    summary: List the marketplaces linked by signing in
    description: |
      One entry per marketplace whose connection can be a browser session (`connect:
      session`): Poshmark, Mercari, Depop, and eBay (Depop and eBay until their APIs are
      connected; an API connection is `api_connected`). Each says whether it is linked, where
      the app opens the marketplace's sign-in page, and which cookies to hand over. Not
      paginated.
    responses:
      '200':
        description: Every marketplace linked by signing in, and its state.
        content:
          application/json:
            schema:
              $ref: '../components/schemas/marketplace-sessions.yaml#/MarketplaceSessionList'
      default:
        $ref: '../components/responses.yaml#/DefaultError'

/v1/marketplace-sessions/{marketplace}:
  parameters:
    - $ref: '../components/parameters.yaml#/MarketplacePath'
  get:
    tags: [connections]
    operationId: getMarketplaceSession
    summary: Get one marketplace's sign-in link
    description: |
      The app polls this after `linkMarketplaceSession` until `status` is no longer
      `checking`. `404` for a marketplace that is not linked by signing in.
    responses:
      '200':
        description: The marketplace's state.
        content:
          application/json:
            schema:
              $ref: '../components/schemas/marketplace-sessions.yaml#/MarketplaceSession'
      '404':
        $ref: '../components/responses.yaml#/NotFound'
      default:
        $ref: '../components/responses.yaml#/DefaultError'
  post:
    tags: [connections]
    operationId: linkMarketplaceSession
    summary: Link a marketplace with the session the user signed into in the app
    description: |
      The user signed into the marketplace's own sign-in page (`login.url`) inside the app,
      in a web view with its own data store, including any two-step check. The app sends
      that site's cookies (only those on `login.cookieDomains`), never the password, which
      Listora never sees. The server stores them encrypted with the token key (KMS envelope
      encryption) on the account's automation connection for the marketplace, and asks for one
      read-only check that the marketplace accepts them, where the connection runs: the
      browser runner, or the iPhone that linked it (`installationId`). The reply is
      `checking`; poll `getMarketplaceSession` for `linked` or `check_failed`. Relinking
      takes the same way and replaces the earlier session. Cookie values are never logged
      or returned.

      `404` for a marketplace that is not linked by signing in. `409
      marketplace_action_unavailable` when the marketplace is connected through its API.
      `422 validation_failed` (field `cookies`) when a cookie is on another site's domain,
      every cookie has expired, or there are none.
    parameters:
      - $ref: '../components/parameters.yaml#/IdempotencyKey'
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../components/schemas/marketplace-sessions.yaml#/MarketplaceSessionLink'
    responses:
      '201':
        description: Stored; the session is being checked.
        content:
          application/json:
            schema:
              $ref: '../components/schemas/marketplace-sessions.yaml#/MarketplaceSession'
      '404':
        $ref: '../components/responses.yaml#/NotFound'
      '409':
        $ref: '../components/responses.yaml#/Conflict'
      '422':
        $ref: '../components/responses.yaml#/ValidationFailed'
      default:
        $ref: '../components/responses.yaml#/DefaultError'
