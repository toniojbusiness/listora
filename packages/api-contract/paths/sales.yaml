/v1/sales:
  get:
    tags: [sales]
    operationId: listSales
    summary: List sales
    description: |
      The sales feed, newest sold first or in the `sort` order, each with its delist runs. The
      sort applies to the sales the filters leave. A cursor continues only the sort it was
      issued for; with another `sort` it is `400`.
    parameters:
      - name: itemId
        in: query
        description: Only sales whose order contains this item.
        schema:
          $ref: '../components/schemas/common.yaml#/Id'
      - name: status
        in: query
        schema:
          type: array
          items:
            $ref: '../components/schemas/sales.yaml#/KnownSaleStatus'
        style: form
        explode: true
      - name: delistStatus
        in: query
        description: |
          Only sales with a delist run in one of these statuses; for example
          `in_progress` and `needs_attention` for the home screen's banner.
        schema:
          type: array
          items:
            $ref: '../components/schemas/sales.yaml#/DelistRunStatus'
        style: form
        explode: true
      - name: sort
        in: query
        description: The order; `sold_newest` when omitted.
        schema:
          $ref: '../components/schemas/sales.yaml#/SaleSort'
      - $ref: '../components/parameters.yaml#/Cursor'
      - $ref: '../components/parameters.yaml#/Limit'
    responses:
      '200':
        description: A page of sales.
        content:
          application/json:
            schema:
              $ref: '../components/schemas/sales.yaml#/SalePage'
      '400':
        $ref: '../components/responses.yaml#/BadRequest'
      default:
        $ref: '../components/responses.yaml#/DefaultError'
  post:
    tags: [sales]
    operationId: createSale
    summary: Record a sale manually ("Mark sold")
    description: |
      For sales Listora did not detect itself. One sale is one order; a bundle lists several
      items. Starts the same automatic delist run as a detected sale: every other listing
      of every item in the order gets a delist operation or an urgent assisted task. A
      sale that contains an already-sold item is recorded with `isDoubleSale: true` and a
      double-sale incident for that item instead of a second delist run.
      `422 validation_failed` when an item appears twice or a `listingId` does not belong
      to its item on `marketplace`.
    parameters:
      - $ref: '../components/parameters.yaml#/IdempotencyKey'
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../components/schemas/sales.yaml#/SaleCreate'
    responses:
      '201':
        description: Created.
        content:
          application/json:
            schema:
              $ref: '../components/schemas/sales.yaml#/Sale'
      '404':
        $ref: '../components/responses.yaml#/NotFound'
      '409':
        $ref: '../components/responses.yaml#/Conflict'
      '422':
        $ref: '../components/responses.yaml#/ValidationFailed'
      default:
        $ref: '../components/responses.yaml#/DefaultError'
/v1/sales/summary:
  get:
    tags: [sales]
    operationId: getSalesSummary
    summary: Get the seller's sales, in total and per marketplace
    description: |
      Every sale that stands (detected, confirmed, or shipped), all time, in total and on each
      marketplace: the sales the seller's connected marketplaces showed (their sales history
      included) and the ones entered by hand. A canceled or returned sale counts nowhere.
    responses:
      '200':
        description: The seller's sales.
        content:
          application/json:
            schema:
              $ref: '../components/schemas/sales.yaml#/SalesSummary'
      default:
        $ref: '../components/responses.yaml#/DefaultError'
/v1/sales/{saleId}:
  parameters:
    - $ref: '../components/parameters.yaml#/SaleId'
  get:
    tags: [sales]
    operationId: getSale
    summary: Get a sale and its delist run
    responses:
      '200':
        description: The sale.
        content:
          application/json:
            schema:
              $ref: '../components/schemas/sales.yaml#/Sale'
      '404':
        $ref: '../components/responses.yaml#/NotFound'
      default:
        $ref: '../components/responses.yaml#/DefaultError'
/v1/sales/{saleId}/confirm:
  parameters:
    - $ref: '../components/parameters.yaml#/SaleId'
  post:
    tags: [sales]
    operationId: confirmSale
    summary: Confirm a sale
    description: |
      The seller confirms a `detected` sale. `409 invalid_state_transition` for any other
      status; `availableActions` lists what a sale allows.
    parameters:
      - $ref: '../components/parameters.yaml#/IdempotencyKey'
    responses:
      '200':
        description: The sale, now `confirmed`.
        content:
          application/json:
            schema:
              $ref: '../components/schemas/sales.yaml#/Sale'
      '404':
        $ref: '../components/responses.yaml#/NotFound'
      '409':
        $ref: '../components/responses.yaml#/Conflict'
      default:
        $ref: '../components/responses.yaml#/DefaultError'
/v1/sales/{saleId}/ship:
  parameters:
    - $ref: '../components/parameters.yaml#/SaleId'
  post:
    tags: [sales]
    operationId: markSaleShipped
    summary: Mark a sale shipped
    description: |
      A `detected` or `confirmed` sale is `shipped`, and its items too. `shippingCost`
      records what the label cost outside the payout, for the profit; send `{}` without one.
    parameters:
      - $ref: '../components/parameters.yaml#/IdempotencyKey'
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../components/schemas/sales.yaml#/SaleShipment'
    responses:
      '200':
        description: The sale, now `shipped`.
        content:
          application/json:
            schema:
              $ref: '../components/schemas/sales.yaml#/Sale'
      '404':
        $ref: '../components/responses.yaml#/NotFound'
      '409':
        $ref: '../components/responses.yaml#/Conflict'
      '422':
        $ref: '../components/responses.yaml#/ValidationFailed'
      default:
        $ref: '../components/responses.yaml#/DefaultError'
/v1/sales/{saleId}/cancel:
  parameters:
    - $ref: '../components/parameters.yaml#/SaleId'
  post:
    tags: [sales]
    operationId: cancelSale
    summary: Record that a sale was canceled
    description: |
      For a `detected` or `confirmed` sale whose order was canceled. Delists of the sale that
      reached no marketplace yet are stopped; the rest finish and show what is true. Each
      item with no other sale that stands goes back to inventory, and Listora asks whether
      to relist it (`items[].relist`, decided with `decideSaleRelist`). Nothing is relisted
      until the seller chooses.
    parameters:
      - $ref: '../components/parameters.yaml#/IdempotencyKey'
    responses:
      '200':
        description: The sale, now `canceled`.
        content:
          application/json:
            schema:
              $ref: '../components/schemas/sales.yaml#/Sale'
      '404':
        $ref: '../components/responses.yaml#/NotFound'
      '409':
        $ref: '../components/responses.yaml#/Conflict'
      default:
        $ref: '../components/responses.yaml#/DefaultError'
/v1/sales/{saleId}/return:
  parameters:
    - $ref: '../components/parameters.yaml#/SaleId'
  post:
    tags: [sales]
    operationId: recordSaleReturn
    summary: Record that a sale was returned
    description: |
      For a `confirmed` or `shipped` sale the buyer returned. As with `cancelSale`, the
      items go back to inventory and Listora asks whether to relist them.
    parameters:
      - $ref: '../components/parameters.yaml#/IdempotencyKey'
    responses:
      '200':
        description: The sale, now `returned`.
        content:
          application/json:
            schema:
              $ref: '../components/schemas/sales.yaml#/Sale'
      '404':
        $ref: '../components/responses.yaml#/NotFound'
      '409':
        $ref: '../components/responses.yaml#/Conflict'
      default:
        $ref: '../components/responses.yaml#/DefaultError'
/v1/sales/{saleId}/relist:
  parameters:
    - $ref: '../components/parameters.yaml#/SaleId'
  post:
    tags: [sales]
    operationId: decideSaleRelist
    summary: Answer "Relist it?" after a cancel or return
    description: |
      For each item whose `relist.decision` is `pending`: relist it on the chosen listings
      (each one a `relist` operation on the engine, shown on the item's listings until the
      marketplace confirms it or the user does an assisted step), or, with no listings, don't
      relist it. `409 invalid_state_transition` when an item's decision is not pending;
      `422 validation_failed` when a listing is not one of the item's options that can be
      relisted now.
    parameters:
      - $ref: '../components/parameters.yaml#/IdempotencyKey'
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../components/schemas/sales.yaml#/SaleRelistChoice'
    responses:
      '200':
        description: The sale with the decisions recorded.
        content:
          application/json:
            schema:
              $ref: '../components/schemas/sales.yaml#/Sale'
      '404':
        $ref: '../components/responses.yaml#/NotFound'
      '409':
        $ref: '../components/responses.yaml#/Conflict'
      '422':
        $ref: '../components/responses.yaml#/ValidationFailed'
      default:
        $ref: '../components/responses.yaml#/DefaultError'
