/v1/sourcing-runs:
  post:
    tags: [sourcing-runs]
    operationId: createSourcingRun
    summary: Start a sourcing run
    description: |
      Starts one trip to a store (docs/features/thrift-scan.md): every item the seller scans
      there (`createScan`) belongs to it, and the items they keep join it. Only for an account
      the thrift scan is on for (`listMarketplaceFeatures`'s `app`); otherwise `404`.
    parameters:
      - $ref: '../components/parameters.yaml#/IdempotencyKey'
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../components/schemas/sourcing.yaml#/SourcingRunCreate'
    responses:
      '201':
        description: Started.
        content:
          application/json:
            schema:
              $ref: '../components/schemas/sourcing.yaml#/SourcingRun'
      '404':
        $ref: '../components/responses.yaml#/NotFound'
      '422':
        $ref: '../components/responses.yaml#/ValidationFailed'
      default:
        $ref: '../components/responses.yaml#/DefaultError'
/v1/sourcing-runs/{runId}/end:
  parameters:
    - $ref: '../components/parameters.yaml#/RunId'
  post:
    tags: [sourcing-runs]
    operationId: endSourcingRun
    summary: End a sourcing run
    description: |
      Ends the run: its scans that were not kept count as skipped, and none of them can be kept
      any more. Ending a run that already ended answers it as it is.
    parameters:
      - $ref: '../components/parameters.yaml#/IdempotencyKey'
    responses:
      '200':
        description: The ended run.
        content:
          application/json:
            schema:
              $ref: '../components/schemas/sourcing.yaml#/SourcingRun'
      '404':
        $ref: '../components/responses.yaml#/NotFound'
      default:
        $ref: '../components/responses.yaml#/DefaultError'
/v1/sourcing-runs/{runId}/checkout:
  parameters:
    - $ref: '../components/parameters.yaml#/RunId'
  post:
    tags: [sourcing-runs]
    operationId: checkoutSourcingRun
    summary: Check out a sourcing run into a haul
    description: |
      At the register: the run's kept items become one haul (`createHaul`) of what the seller
      paid, each item costing its share, and the run ends (its scans not kept are skipped). A
      kept scan whose item the app had not sent yet is kept now. Answers the run's summary,
      with the estimated profit. A run already checked out or ended is `409`; a listed scan
      that is not a kept or open scan of this run is a `422` field error.
    parameters:
      - $ref: '../components/parameters.yaml#/IdempotencyKey'
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../components/schemas/sourcing.yaml#/SourcingRunCheckout'
    responses:
      '201':
        description: Checked out.
        content:
          application/json:
            schema:
              $ref: '../components/schemas/sourcing.yaml#/SourcingRunSummary'
      '404':
        $ref: '../components/responses.yaml#/NotFound'
      '409':
        $ref: '../components/responses.yaml#/Conflict'
      '422':
        $ref: '../components/responses.yaml#/ValidationFailed'
      default:
        $ref: '../components/responses.yaml#/DefaultError'
/v1/sourcing-runs/{runId}/summary:
  parameters:
    - $ref: '../components/parameters.yaml#/RunId'
  get:
    tags: [sourcing-runs]
    operationId: getSourcingRunSummary
    summary: Get a sourcing run's summary
    description: |
      The run's counts, its kept items' estimated resale, and once checked out its haul and
      estimated profit. Only for an account the thrift scan is on for; otherwise `404`.
    responses:
      '200':
        description: The summary.
        content:
          application/json:
            schema:
              $ref: '../components/schemas/sourcing.yaml#/SourcingRunSummary'
      '404':
        $ref: '../components/responses.yaml#/NotFound'
      default:
        $ref: '../components/responses.yaml#/DefaultError'
