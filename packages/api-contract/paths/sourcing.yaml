/v1/sourcing/kit:
  get:
    tags: [sourcing]
    operationId: getSourcingKit
    summary: Get the sourcing kit
    description: |
      The household's own sales, grouped for sourcing: by brand, then brand and category, then
      brand, category, and size. Each group has its sales per marketplace (count, the price
      range, the median payout after the marketplace's fees) and how many such items sit
      unsold. A few KB, read once while online so the app can look a brand up at the store with
      no signal. Only real sales count: sales that stand (not canceled or returned), from the
      last `windowDays`, on marketplaces whose sales history is on for the account (it passed
      live, or the account is in Test mode). Without such sales `buckets` is empty. `insights`
      is the same sales and the stock read as advice: the brand and item type pairs that sell
      best and worst, and what to look for. Computing it never calls a marketplace or AI.
    responses:
      '200':
        description: The sourcing kit.
        content:
          application/json:
            schema:
              $ref: '../components/schemas/sourcing.yaml#/SourcingKit'
      default:
        $ref: '../components/responses.yaml#/DefaultError'
/v1/sourcing/cost:
  get:
    tags: [sourcing]
    operationId: getSourcingCost
    summary: Get where I source
    description: |
      Where the household sources and what an item costs there, which the scan's call weighs the
      payouts against: at the bins (an outlet that sells by the pound) each item's typical weight
      for its category at `binsPricePerPound`, or at a thrift store its typical shelf price for
      its category, or `storeItemPrice` when the seller set one. An account that never saved its
      own gets Listora's default, the bins at $1.99 a pound, with `isDefault` true.
    responses:
      '200':
        description: Where the household sources.
        content:
          application/json:
            schema:
              $ref: '../components/schemas/sourcing.yaml#/SourcingCost'
      default:
        $ref: '../components/responses.yaml#/DefaultError'
  put:
    tags: [sourcing]
    operationId: replaceSourcingCost
    summary: Replace where I source
    description: |
      Saves where the household sources; the scans made from then on weigh it (scans already made
      keep their call). A price left out takes Listora's default: $1.99 a pound at the bins, and
      the typical price by category at a store. A price out of bounds ($0.10 to $20 a pound, $0 to
      $1,000 an item) or not in USD is `422 validation_failed`. It belongs to the account, so a
      member who is not its owner or an admin gets `403 forbidden`.
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../components/schemas/sourcing.yaml#/SourcingCostReplace'
    responses:
      '200':
        description: The saved setting.
        content:
          application/json:
            schema:
              $ref: '../components/schemas/sourcing.yaml#/SourcingCost'
      default:
        $ref: '../components/responses.yaml#/DefaultError'
