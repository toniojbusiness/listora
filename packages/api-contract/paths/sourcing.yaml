/v1/sourcing/kit:
  get:
    tags: [sourcing]
    operationId: getSourcingKit
    summary: Get the sourcing kit
    description: |
      The household's own sales, grouped for sourcing: by brand, then brand and category, then
      brand, category, and size. Each group has its sales per marketplace (count, the price
      range, the median payout after the marketplace's fees) and how many such items sit
      unsold. A few KB, read once while online so the app can look a brand up at the store with
      no signal. Only real sales count: sales that stand (not canceled or returned), from the
      last `windowDays`, on marketplaces whose sales history is on for the account (it passed
      live, or the account is in Test mode). Without such sales `buckets` is empty. `insights`
      is the same sales and the stock read as advice: the brand and item type pairs that sell
      best and worst, and what to look for. Computing it never calls a marketplace or AI.
    responses:
      '200':
        description: The sourcing kit.
        content:
          application/json:
            schema:
              $ref: '../components/schemas/sourcing.yaml#/SourcingKit'
      default:
        $ref: '../components/responses.yaml#/DefaultError'
