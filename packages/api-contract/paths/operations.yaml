/v1/operations:
  get:
    tags: [operations]
    operationId: listOperations
    summary: List marketplace operations
    description: Newest first. Filters combine with AND.
    parameters:
      - name: itemId
        in: query
        schema:
          $ref: '../components/schemas/common.yaml#/Id'
      - name: listingId
        in: query
        schema:
          $ref: '../components/schemas/common.yaml#/Id'
      - name: status
        in: query
        schema:
          type: array
          items:
            $ref: '../components/schemas/operations.yaml#/KnownOperationStatus'
        style: form
        explode: true
      - $ref: '../components/parameters.yaml#/Cursor'
      - $ref: '../components/parameters.yaml#/Limit'
    responses:
      '200':
        description: A page of operations.
        content:
          application/json:
            schema:
              $ref: '../components/schemas/operations.yaml#/OperationPage'
      '400':
        $ref: '../components/responses.yaml#/BadRequest'
      default:
        $ref: '../components/responses.yaml#/DefaultError'
/v1/operations/{operationId}:
  parameters:
    - $ref: '../components/parameters.yaml#/OperationId'
  get:
    tags: [operations]
    operationId: getOperation
    summary: Get an operation
    responses:
      '200':
        description: The operation.
        content:
          application/json:
            schema:
              $ref: '../components/schemas/operations.yaml#/Operation'
      '404':
        $ref: '../components/responses.yaml#/NotFound'
      default:
        $ref: '../components/responses.yaml#/DefaultError'
/v1/operations/{operationId}/events:
  parameters:
    - $ref: '../components/parameters.yaml#/OperationId'
  get:
    tags: [operations]
    operationId: listOperationEvents
    summary: List an operation's history
    description: Oldest first (by `sequence`). Events are append-only.
    parameters:
      - $ref: '../components/parameters.yaml#/Cursor'
      - $ref: '../components/parameters.yaml#/Limit'
    responses:
      '200':
        description: A page of events.
        content:
          application/json:
            schema:
              $ref: '../components/schemas/operations.yaml#/OperationEventPage'
      '400':
        $ref: '../components/responses.yaml#/BadRequest'
      '404':
        $ref: '../components/responses.yaml#/NotFound'
      default:
        $ref: '../components/responses.yaml#/DefaultError'
/v1/operations/{operationId}/retry:
  parameters:
    - $ref: '../components/parameters.yaml#/OperationId'
  post:
    tags: [operations]
    operationId: retryOperation
    summary: Retry a failed operation
    description: |
      Only for `failed` operations. Queues the same operation again with a fresh set of
      attempts; its history keeps the failure. Its first step reads the listing back before
      sending anything, because an earlier attempt may have been applied.
      `409 invalid_state_transition` when the operation has not failed, or when a newer
      operation on the listing exists (retrying would undo it).
    parameters:
      - $ref: '../components/parameters.yaml#/IdempotencyKey'
    responses:
      '202':
        description: The queued operation.
        content:
          application/json:
            schema:
              $ref: '../components/schemas/operations.yaml#/Operation'
      '404':
        $ref: '../components/responses.yaml#/NotFound'
      '409':
        $ref: '../components/responses.yaml#/Conflict'
      default:
        $ref: '../components/responses.yaml#/DefaultError'
/v1/operations/{operationId}/try-now:
  parameters:
    - $ref: '../components/parameters.yaml#/OperationId'
  post:
    tags: [operations]
    operationId: tryOperationNow
    summary: Run a waiting operation's next attempt now
    description: |
      Only while `retrying` (waiting for its next attempt after a transient failure) or
      `verifying` (waiting between read-backs). Moves the next attempt to now: the operation
      keeps its status, attempts, and error, and the attempt runs exactly as it would have later
      (a retry reads the listing back before sending anything). A step that runs on the seller's
      iPhone is taken on the phone's next look. `409 invalid_state_transition` for any other
      status.
    parameters:
      - $ref: '../components/parameters.yaml#/IdempotencyKey'
    responses:
      '200':
        description: The operation, due now.
        content:
          application/json:
            schema:
              $ref: '../components/schemas/operations.yaml#/Operation'
      '404':
        $ref: '../components/responses.yaml#/NotFound'
      '409':
        $ref: '../components/responses.yaml#/Conflict'
      default:
        $ref: '../components/responses.yaml#/DefaultError'
/v1/operations/{operationId}/cancel:
  parameters:
    - $ref: '../components/parameters.yaml#/OperationId'
  post:
    tags: [operations]
    operationId: cancelOperation
    summary: Cancel an operation that has not been sent
    description: |
      Only while `queued` or `retrying`. Once a request may have reached the marketplace
      the operation cannot be canceled (`409 invalid_state_transition`), because its outcome
      must still be verified.
    parameters:
      - $ref: '../components/parameters.yaml#/IdempotencyKey'
    responses:
      '200':
        description: The canceled operation.
        content:
          application/json:
            schema:
              $ref: '../components/schemas/operations.yaml#/Operation'
      '404':
        $ref: '../components/responses.yaml#/NotFound'
      '409':
        $ref: '../components/responses.yaml#/Conflict'
      default:
        $ref: '../components/responses.yaml#/DefaultError'
